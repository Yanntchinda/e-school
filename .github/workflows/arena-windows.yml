name: Construire GestSchool pour Windows

on:
  push:
    branches:
      - arena/b4456288-e-school
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Construire les versions Windows
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Préparer le téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: GestSchool-Windows
          path: desktop-app/dist/installers/*.exe
          if-no-files-found: error
          retention-days: 90
