name: Construire GestSchool pour Windows

on:
  push:
    branches:
      - arena/b4456288-e-school
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Construire les versions Windows
        shell: pwsh
        run: |
          cmd /c "npm run build:win -- --publish never > build.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content build.log | Write-Output
          if ($code -ne 0) {
            $details = ((Get-Content build.log -Tail 20) -join ' | ').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Préparer le téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: GestSchool-Windows
          path: desktop-app/dist/installers/*.exe
          if-no-files-found: error
          retention-days: 90
