name: Construire GestSchool pour Windows

on:
  push:
    branches:
      - arena/b4456288-e-school
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-windows]')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Construire les versions Windows
        shell: pwsh
        run: |
          cmd /c "npm run build:win -- --publish never > build.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content build.log | Write-Output
          if ($code -ne 0) {
            $details = ((Get-Content build.log -Tail 20) -join ' | ').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publier le programme Windows en téléchargement direct
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = 'dist/installers/GestSchool-1.0.0-Setup.exe'
          if (!(Test-Path $source)) { throw "Installateur introuvable : $source" }
          $name = 'GestSchool-Setup-' + $env:GITHUB_SHA.Substring(0, 7) + '.exe'
          Copy-Item $source "dist/installers/$name"
          gh release upload v1.0.0 "dist/installers/$name" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Publication du fichier .exe impossible' }
