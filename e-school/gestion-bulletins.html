<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion scolaire</title>
<style>
:root{
  --ink:#12263f; --ink-2:#34495e; --muted:#6b7a8c; --line:#d9e0e8; --line-2:#eaeef3;
  --bg:#f1f4f8; --surface:#fff; --brand:#1b3f8f; --brand-d:#122c66; --green:#4fa824; --green-d:#3c8a18;
  --red:#c0262d; --amber:#b7791f; --amber-bg:#fdf3dc; --ok-bg:#e6f4dc; --bad-bg:#fbe4e4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
a{color:var(--brand)}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px;border-radius:4px}
#printRoot{display:none}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{background:#f4f7fb;border-color:#b9c5d3}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:var(--green-d)}
.btn.danger{color:var(--red);border-color:#e7b9bb}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#e8edf4}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* forms */
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:12px}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid #c3ceda;border-radius:7px;background:#fff;font-weight:400;font-size:15px}
.inp.sm{padding:5px 8px;font-size:14px;margin:0}
label.f textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:12px;flex-wrap:wrap}
/* Bloc « Contact du parent / tuteur » dans la fiche de l'élève */
.form-sec{display:flex;align-items:center;gap:9px;margin:6px 0 10px;font-size:11.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.form-sec::after{content:'';flex:1;height:1px;background:var(--line)}
.pc{display:flex;flex-direction:column;gap:1px;line-height:1.3}
.pc .pc-n{font-weight:600;font-size:13px}
.pc a.pc-t{font-size:12.5px;color:var(--brand);text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc a.pc-t:hover{text-decoration:underline}
.pc .pc-m{font-size:11.5px;color:var(--muted);word-break:break-all}
.pc-inline{color:var(--muted);font-size:13px}
.pc-inline a{color:var(--brand);text-decoration:none;font-weight:600}
.pc-inline a:hover{text-decoration:underline}
.row>*{flex:1 1 180px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px}

/* auth */
/* auth : fond sombre + diaporama de photos scolaires (images injectees par JS) */
.auth{min-height:100vh;display:grid;place-items:center;padding:28px 20px;position:relative;overflow:hidden;
  background-color:#0a1a2f}
.auth-slides{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#0a1a2f}
.auth-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
  transform:scale(1.04);transition:opacity 1.8s ease;will-change:opacity,transform}
.auth-slide.on{opacity:1;animation:authKb 9s ease-out forwards}
@keyframes authKb{from{transform:scale(1.02)}to{transform:scale(1.10)}}
/* voile : les photos restent lisibles mais le texte blanc garde son contraste */
.auth-slides::after{content:'';position:absolute;inset:0;
  background:linear-gradient(125deg,rgba(6,17,34,.90) 0%,rgba(9,26,50,.74) 42%,rgba(6,20,40,.62) 100%)}
@media (prefers-reduced-motion:reduce){.auth-slide{transition:none}.auth-slide.on{animation:none;transform:none}}

.auth::before{content:'';position:absolute;inset:-10%;pointer-events:none;z-index:1;
  background:radial-gradient(900px 520px at 12% 8%,rgba(56,189,248,.20),transparent 62%),
             radial-gradient(760px 460px at 92% 92%,rgba(34,197,94,.16),transparent 62%),
             radial-gradient(680px 420px at 78% 6%,rgba(99,102,241,.18),transparent 60%)}
.auth::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(to top,rgba(4,12,26,.55),transparent 45%)}
.auth-box{position:relative;z-index:2;width:min(462px,100%);
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.30);border-radius:18px;
  padding:28px 30px 24px;color:#fff;
  box-shadow:0 34px 80px rgba(2,10,24,.55),0 2px 0 rgba(255,255,255,.10) inset,0 0 0 1px rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
.auth-box h1{color:#fff;font-size:26px;letter-spacing:-.02em;margin-bottom:4px}
.auth-box p{color:rgba(255,255,255,.80);margin:0 0 18px}
.auth-box img{width:100%;height:auto;display:block;margin:0 0 18px;background:#fff;padding:10px 12px;border-radius:11px;
  box-shadow:0 10px 26px rgba(2,10,24,.28)}
.auth-box label.f{color:rgba(255,255,255,.92);font-weight:600}
.auth-box label.f input,.auth-box label.f select,.auth-box .inp{
  background:rgba(6,18,36,.55);border:1px solid rgba(255,255,255,.42);color:#fff;border-radius:9px;padding:10px 12px;
  caret-color:#fff;-webkit-text-fill-color:#fff}
.auth-box label.f input[type=password]{letter-spacing:.08em}
.pw-row{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}
.pw-row .btn.sm{padding:5px 11px;font-size:12.5px}
.auth-box label.f input::placeholder{color:rgba(255,255,255,.55)}
.auth-box label.f input:focus,.auth-box .inp:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.70);outline:none}
.auth-box .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.36);color:#fff}
.auth-box .btn:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.55)}
.auth-box .btn.primary{background:linear-gradient(180deg,#2a63d4,#1b3f8f);border-color:rgba(255,255,255,.30);color:#fff;
  box-shadow:0 10px 24px rgba(27,63,143,.45)}
.auth-box .btn.primary:hover{background:linear-gradient(180deg,#316fe8,#1f47a0)}
.auth-box .notice{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.92)}
.auth-box .notice.info{background:rgba(96,165,250,.18);border-color:rgba(147,197,253,.42);color:#eaf2ff}
.auth-box .notice code{background:rgba(255,255,255,.20);color:#fff;padding:1px 6px;border-radius:5px}
.auth-box .err{color:#ffb4b4;font-weight:600}
.auth-box .muted{color:rgba(255,255,255,.68)}
.auth-box a{color:#9cc4ff;text-decoration:underline}
@media (max-width:560px){.auth{padding:18px 14px;background-attachment:scroll}
  .auth-box{padding:22px 20px 20px;border-radius:15px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}}
.auth-kicker{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#cfe0ff;background:rgba(120,170,255,.16);border:1px solid rgba(160,200,255,.32);
  padding:4px 10px;border-radius:99px;margin-bottom:12px}
.auth-kicker::before{content:'';width:6px;height:6px;border-radius:50%;background:#54e08a;box-shadow:0 0 0 3px rgba(84,224,138,.22)}
.auth-box .auth-sep{height:1px;background:rgba(255,255,255,.16);margin:16px 0 14px}
.auth-box .auth-links{margin:16px 0 0;text-align:center;font-size:12.5px}
.auth-foot{position:relative;z-index:2;margin-top:18px;text-align:center;font-size:11.5px;letter-spacing:.03em;
  color:rgba(255,255,255,.55)}
.auth-foot b{color:rgba(255,255,255,.78);font-weight:600}

/* shell */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--ink);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px;font-weight:600;min-width:0}
.brand .dot{width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-weight:700;font-family:var(--sans);font-size:15px;color:#fff;flex:none}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tri{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;margin-left:auto}
.tri button{border:0;background:transparent;color:#cfd9e6;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.tri button.on{background:#fff;color:var(--ink)}
.me{display:flex;align-items:center;gap:10px;font-size:13px}
.me .role{display:inline-block;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:99px;font-size:12px}
.me .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.me .btn:hover{background:rgba(255,255,255,.1)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 52px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.side h4{margin:16px 10px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.side a.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer}
.side a.nav:hover{background:#eef2f7}
.side a.nav.on{background:var(--brand);color:#fff}
.side a.nav small{font-weight:500;opacity:.7}
main{padding:24px 28px 60px;min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:28px}
.page-h p{margin:2px 0 0;color:var(--muted)}
.session-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.panel>h3{font-size:18px;margin-bottom:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs a{padding:9px 16px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--brand);border-bottom-color:var(--green)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.notice{padding:10px 14px;border-radius:8px;background:var(--amber-bg);color:#7a4f10;font-size:14px;margin-bottom:14px;border:1px solid #f0dca8}
.notice.info{background:#e8f0fc;color:#1d3d78;border-color:#c8d8f3}

/* tables */
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);background:#fafbfd;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:hover td{background:#f8fafc}
table.t .num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
.tw table.t th:first-child,.tw table.t td:first-child{padding-left:14px}
.avg{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.low{color:var(--red)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2f7;color:var(--ink-2)}
.badge.ok{background:var(--ok-bg);color:#2f6b12}
.badge.bad{background:var(--bad-bg);color:#9c1c22}
.badge.warn{background:var(--amber-bg);color:#7a4f10}
.student-tag{display:inline-block;min-width:30px;text-align:center;margin-right:6px;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:700;vertical-align:middle;background:#e8f0fc;color:#1d3d78}
.student-tag.na{background:var(--ok-bg);color:#2f6b12}
.student-tag.ancien{background:var(--amber-bg);color:#7a4f10}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.b>i{background:var(--brand)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:18px;overflow:hidden}
.kpi{padding:14px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}

/* grid (saisie des notes) */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:calc(100vh - 250px)}
table.grid{border-collapse:separate;border-spacing:0;font-size:14px}
table.grid th,table.grid td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0;text-align:center;background:#fff}
table.grid thead th{position:sticky;top:0;z-index:3;background:#f4f7fb;font-weight:600;padding:6px 6px;font-size:12.5px;border-bottom:2px solid var(--line)}
table.grid thead tr:first-child th{height:54px;box-sizing:border-box}
table.grid thead tr:nth-child(2) th{top:54px;z-index:3;font-weight:500;color:var(--muted);padding:3px}
table.grid th.sub{min-width:116px;border-left:2px solid var(--line)}
table.grid th.sub small{display:block;font-weight:500;color:var(--muted)}
table.grid th.sub.lock{background:#eceff3;color:#8794a3}
.stk0,.stk1{position:sticky;z-index:2;background:#fff!important}
.stk0{left:0;min-width:40px;width:40px}
.stk1{left:40px;min-width:230px;text-align:left!important;padding:0 10px!important;font-weight:600;white-space:nowrap;border-right:2px solid var(--line)!important}
thead .stk0,thead .stk1{z-index:5;background:#f4f7fb!important}
td.s-sep{border-left:2px solid var(--line)}
input.cell{width:58px;border:0;text-align:center;padding:8px 2px;background:transparent;font-variant-numeric:tabular-nums}
input.cell:focus{background:#e9f1ff;outline:2px solid #5b8def;outline-offset:-2px}
input.cell.bad{background:var(--bad-bg)}
td.lk{background:#f6f7f9!important;color:#6b7a8c;width:58px;font-variant-numeric:tabular-nums}
td.sumc{font-weight:700;min-width:64px;padding:0 8px;background:#fcfcf6}
.empty-row td{background:#fffdf0}

/* modal + toast */
.backdrop{position:fixed;inset:0;background:rgba(18,38,63,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:min(520px,100%);padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(900px,100%)}
.modal.xl{width:min(860px,100%);background:#e6eaf0;padding:16px 18px}
.modal h2{font-size:21px;margin-bottom:12px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toastRoot{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px;font-size:14px}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green-d)}

/* stats */
.hist{display:grid;gap:7px}
.hist .hr{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.hist .hb{height:20px;background:var(--line-2);border-radius:4px;overflow:hidden}
.hist .hb i{display:block;height:100%;background:var(--brand)}
.hist .hb i.lo{background:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chk{display:flex;gap:7px;align-items:center;font-weight:500;font-size:14px;cursor:pointer}

/* ===== bulletin (écran + impression) ===== */
.bulletin{width:190mm;margin:0 auto 14px;background:#fff;color:#000;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:10.5pt;padding:0;line-height:1.25}
.xl .bulletin{padding:6mm 7mm;width:100%;max-width:210mm;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.bulletin .b-head{display:block;width:100%;height:auto}
.bulletin .b-title{font-family:inherit;text-align:center;font-size:17.5pt;font-weight:400;letter-spacing:.2px;margin:2.4mm 0 1.2mm;white-space:nowrap}
.bulletin .b-title .b-sub{display:inline;font-size:17.5pt;font-style:normal;font-weight:400;letter-spacing:.2px;margin:0;white-space:nowrap}
.bulletin .b-year{font-style:italic;font-size:12pt;display:flex;justify-content:space-between;align-items:baseline;margin:0 0 .5mm;line-height:1.12;text-align:left}
.bulletin .b-year .tr{font-style:normal;font-weight:700;font-size:12.5pt;margin-left:auto;white-space:nowrap;flex:none}
.bulletin .b-year .tr.nw{white-space:nowrap;flex:none}
.bulletin .b-profile{display:flex;align-items:center;gap:4mm;margin:.4mm 0 .9mm;break-inside:avoid;page-break-inside:avoid}
.bulletin .b-profile-info{flex:1;min-width:0;text-align:left}
.bulletin .b-profile .b-line{display:flex;gap:3mm;align-items:baseline;margin:.25mm 0;line-height:1.2;text-align:left}
.bulletin .b-line .lbl{width:31mm;text-align:left;flex:none}
.bulletin .b-photo{display:block;flex:none;width:28mm;height:35mm;object-fit:cover;border:1px solid #000;box-sizing:border-box}
.bulletin .b-photo-empty{display:flex;align-items:center;justify-content:center;color:#777;font-size:8pt;background:#f7f7f7}

.bulletin .b-line .val{font-weight:700}

.bulletin .b-line .val.big{font-size:12.5pt}
.bulletin .b-line .cel{width:auto;margin-left:auto}
.bulletin .b-line .cel.nw{white-space:nowrap;flex:none}
/* matricule long : chasse fixe et taille adaptee pour rester sur la ligne d'etat civil */
.bulletin .b-line .mat-line{font-size:9.6pt;letter-spacing:0}
.bulletin .b-line .mat-line b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;font-size:9.2pt;letter-spacing:0}
.bulletin .b-line{flex-wrap:nowrap;min-width:0}
.bulletin .b-line .val{min-width:0}
.bulletin table.b-table{width:100%;border-collapse:collapse;margin-top:1.6mm;table-layout:fixed}
.bulletin .b-table th,.bulletin .b-table td{border:1px solid #000;padding:1.1mm 1.4mm;font-size:10pt;text-align:center;overflow:hidden}
.bulletin .b-table th{font-weight:700;font-size:10pt}
.bulletin .b-table td.mt{text-align:left;white-space:normal}
.bulletin .b-table td.mt .sub-teacher{font-size:8.5pt;font-weight:400;white-space:normal}
.bulletin .b-table th .th-en{font-size:8pt;font-weight:600;letter-spacing:.01em}
.bulletin sup,.b-bottom sup,.b-year sup,.b-legend sup,.hon sup{font-size:.72em;line-height:0;vertical-align:super;font-weight:600}
.bulletin .b-table td.m{color:#c00000;font-weight:700}
.bulletin .b-table th:last-child,.bulletin .b-table td.ob{text-align:left;padding-left:2mm}
.bulletin .b-table td.ob{font-weight:700}
.bulletin .b-table tr.grp td{font-weight:700;background:#eeeeee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulletin .b-table tr.grp td.mt{text-align:center}
.bulletin .b-table tr.tot td{font-weight:700}
.bulletin .b-legend{font-size:8.5pt;margin-top:1.2mm}
.bulletin .b-bottom{margin-top:2.2mm;break-inside:avoid;page-break-inside:avoid}
.bulletin table.b-bottom-t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9.4pt}
.bulletin .b-bottom-t td,.bulletin .b-bottom-t th{border:.38mm solid #000;padding:.5mm .85mm;vertical-align:top;line-height:1.1}
.bulletin .b-bottom-t th{text-align:center;font-weight:700;text-transform:uppercase;font-size:8.6pt;background:#fafafa;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulletin .b-bottom-t .lbl{font-size:8.8pt;line-height:1.1}
.bulletin .b-bottom-t .lbl b{display:block;font-size:7.8pt;text-transform:uppercase;line-height:1.05}
.bulletin .b-bottom-t .lbl i{font-style:normal;font-size:7.8pt;display:block;color:#333}
.bulletin .b-bottom-t .center{text-align:center}
/* zone d'ecriture : un seul bloc continu entre Appreciation et Chef d'Etablissement */
.bulletin .b-bottom-t td.join-r{border-right:0}
.bulletin .b-bottom-t td.join-l{border-left:0}
/* mentions : libelle et case a cocher centres dans la cellule */
.bulletin .b-bottom-t td.mtn-cell{text-align:center;vertical-align:middle}
.bulletin .b-bottom-t .mtn{display:inline-block;text-align:center;line-height:1.15}
.bulletin .b-bottom-t .mtn .chk{vertical-align:-.6mm}
/* Avertissement et Blâme : libelle et traduction alignes a gauche, case a cocher
   poussee contre le bord droit de la cellule. */
.bulletin .b-bottom-t td.mtn-left{text-align:left;vertical-align:top}
.bulletin .b-bottom-t .mtn-left .mtn{display:flex;align-items:flex-start;justify-content:space-between;gap:1.6mm;width:100%;
  text-align:left;line-height:1.1}
.bulletin .b-bottom-t .mtn-left .mtn-t{display:block;min-width:0}
.bulletin .b-bottom-t .mtn-left .mtn-t i{display:block;text-align:left;font-size:7.8pt;color:#333}
.bulletin .b-bottom-t .mtn-left .chk{flex:none;margin:.55mm 0 0 1.2mm}
.bulletin .b-bottom-t .val{display:block;width:100%;font-weight:700;font-size:10.6pt;text-align:center;min-height:4.4mm;padding:.15mm 0;color:#1a2fb5;line-height:1.12}
.bulletin .b-bottom-t .row-h{height:9.6mm}
.bulletin .b-bottom-t .appr>td{height:25mm;vertical-align:top}
.bulletin .b-bottom-t .sign-zone{height:15mm}
.bulletin .b-bottom-t .nom-lbl{font-size:8.2pt;text-align:center;line-height:1.1;color:#444}
.bulletin .b-bottom-t .nom-val{font-size:10pt;font-weight:700;text-align:center;min-height:4.2mm;padding-top:.3mm}
.bulletin .b-bottom-t .chk{display:inline-block;width:3.4mm;height:3.4mm;border:.45mm solid #000;vertical-align:-.6mm;margin-left:1.1mm;box-sizing:border-box;position:relative}
/* coche dessinee au centre de la case : le trait est epaissi et centre par translation */
.bulletin .b-bottom-t .chk.on::after{content:"";position:absolute;left:50%;top:50%;width:1.85mm;height:1mm;
  border-left:.55mm solid #000;border-bottom:.55mm solid #000;
  transform:translate(-50%,-50%) rotate(-45deg);transform-origin:center;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulletin .b-bottom-t .appr-lines{font-size:10.6pt;line-height:5.6mm;white-space:pre-wrap;word-break:break-word;min-height:5.6mm;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 5.25mm,#bbb 5.25mm,#bbb 5.4mm);background-size:100% 5.6mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulletin .b-bottom-t .appr-title{font-size:8.6pt;font-weight:400;line-height:1.1}
.bulletin .b-bottom-t td.mavg{vertical-align:middle;font-size:10.4pt}
.bulletin .b-bottom-t td.mavg b{font-size:9.6pt}
.bulletin .b-bottom-t td.mavg .val{font-size:13.2pt;min-height:5.4mm}
.bulletin .b-bottom-t td.mavg .rk-mavg{margin-top:.6mm;font-size:8.2pt}
.bulletin .b-bottom-t td.mavg .rk-mavg b{font-size:10.6pt}

/* bande de recherche sous l'en-tete */

.sband-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;

.sband-head{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:11.5px;

<div id="app"><div class="auth"><div class="auth-box"><h1>Chargement de la plateforme…</h1><p>La connexion devrait s’afficher dans un instant. Si ce message reste visible, recharge la prévisualisation.</p><p class="small muted">Première utilisation : créez le compte administrateur.</p></div></div></div>

<div id="toastRoot" aria-live="polite"></div>
<div id="printRoot"></div>
<noscript>Cette application nécessite JavaScript.</noscript>

<script>
'use strict';
/* ====================================================================
   Gestion des bulletins — application autonome (aucun serveur requis)
   Les données sont enregistrées dans le navigateur de l'ordinateur.
   ==================================================================== */
const KEY='mbi_gestion_bulletins_v1', SKEY='mbi_session_v1';
/* Logo de l'etablissement, extrait du bandeau d'origine. Il s'affiche de
   part et d'autre du titre du tableau d'honneur ; remplacable dans les
   parametres (DB.school.logo). */
const TRN=['1er','2e','3e'];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Nom de classe : le rang (e, ere, nde, re) est mis en exposant -> 6e A devient 6 avec e en exposant */
const clsSup=s=>esc(s).replace(/(\d)(ère|nde|er|re|e)(?=$|[\s)\-·,;])/g,'$1<sup>$2</sup>');
/* ---------- Ordinaux : le suffixe est en exposant (1er, 2e, 3e, 1st...) ---------- */
const ordSup=n=>String(n)+'<sup>'+(n===1?'er':'e')+'</sup>';
const ordEn=n=>String(n)+'<sup>'+['st','nd','rd'][n-1]+'</sup>';
const ordTxtEn=n=>['1st','2nd','3rd'][n-1];
/* Rang affiche : « 1er », « 2e ex » (ex = ex aequo), suffixe en exposant. */
const rankHtml=r=>r?(ordSup(r.r)+(r.tie?' ex':'')):'';

const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
let matCounter=0;
/* ---------- Matricules : uniques, longs et definitifs ----------
   Un eleve garde son matricule d'une annee a l'autre et d'une classe a l'autre.
   Format : MBI-<annee>-<6 caracteres aleatoires>, sans 0/1/I/O pour eviter les
   confusions a la lecture. Le tirage est verifie contre TOUT l'etablissement
   (annee en cours + archives) : deux eleves ne peuvent jamais avoir le meme. */
const MAT_ALPHA='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const matKey=v=>String(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
function matRandom(n){
  let out='';
  try{
    const c=window.crypto||window.msCrypto;
    if(c&&c.getRandomValues){
      const buf=new Uint8Array(n);c.getRandomValues(buf);
      for(let i=0;i<n;i++)out+=MAT_ALPHA[buf[i]%MAT_ALPHA.length];
      return out;
    }
  }catch(e){}
  for(let i=0;i<n;i++)out+=MAT_ALPHA[Math.floor(Math.random()*MAT_ALPHA.length)];
  return out;
}
const allStudentRecords=()=>{
  const out=[];
  (DB.classes||[]).forEach(c=>(c.students||[]).forEach(st=>out.push({st,cls:c,sessionId:null,year:DB.school.year,current:true})));
  (DB.sessions||[]).forEach(a=>(a.classes||[]).forEach(c=>(c.students||[]).forEach(st=>out.push({st,cls:c,sessionId:a.id,year:a.year,current:false}))));
  return out;
};
/* retourne l'eleve qui detient deja ce matricule (sauf lui-meme) */
function matTaken(mat,exceptId){
  const k=matKey(mat);if(!k)return null;
  return allStudentRecords().find(r=>r.st.id!==exceptId&&matKey(r.st.mat)===k)||null;
}
const genMat=()=>{
  const used=new Set();
  allStudentRecords().forEach(r=>{const k=matKey(r.st.mat);if(k)used.add(k)});
  const y=(String(DB.school&&DB.school.year||'').match(/\d{4}/)||[])[0]||String(new Date().getFullYear());
  const pre='MBI-'+y+'-';
  let m='',guard=0;
  do{m=pre+matRandom(6);guard++}while(used.has(matKey(m))&&guard<500);
  /* Securite supplementaire : si le tirage reste pris, on allonge le code. */
  while(used.has(matKey(m)))m=pre+matRandom(9);
  matCounter++;
  return m;
};
/* ---------- Contact du parent / tuteur ----------
   Renseigne dans « Modifier l'élève ». Tous les champs sont facultatifs :
   un élève dont les parents n'ont pas encore donne leurs coordonnees reste
   valide, et l'application affiche simplement un tiret. */
const PARENT_LINKS=['Père','Mère','Tuteur','Autre'];
function parentInfo(s){
  s=s||{};
  return {name:String(s.parent||'').trim(),link:String(s.parentLink||'').trim(),
          phone:String(s.parentPhone||'').trim(),email:String(s.parentEmail||'').trim()};
}
const hasParentInfo=s=>{const p=parentInfo(s);return !!(p.name||p.phone||p.email)};
/* Lien téléphonique : on ne garde que les chiffres et le + international. */
const telHref=v=>{const d=String(v||'').replace(/[^\d+]/g,'');return d?'tel:'+d:''};
const mailHref=v=>{const d=String(v||'').trim();return d&&/^[^\s@]+@[^\s@]+$/.test(d)?'mailto:'+d:''};
/* Bloc « contact » affiche dans la liste des eleves et l'etat civil. */
function parentCellHtml(s){
  const p=parentInfo(s);
  if(!p.name&&!p.phone&&!p.email)return '<span class="muted">—</span>';
  const tel=telHref(p.phone),mail=mailHref(p.email);
  return '<div class="pc">'+
    '<span class="pc-n">'+(p.name?esc(p.name):'<span class="muted">Parent non nommé</span>')+(p.link?' <span class="small muted">('+esc(p.link)+')</span>':'')+'</span>'+
    (p.phone?'<a class="pc-t" href="'+esc(tel)+'">'+esc(p.phone)+'</a>':'')+
    (p.email?'<span class="pc-m">'+(mail?'<a href="'+esc(mail)+'">'+esc(p.email)+'</a>':esc(p.email))+'</span>':'')+
  '</div>';
}
/* Ligne compacte "Parent / tuteur : ... " (fiche eleve). */
function parentLineHtml(s){
  const p=parentInfo(s);
  if(!p.name&&!p.phone&&!p.email)return '';
  const tel=telHref(p.phone),mail=mailHref(p.email);
  return '<span class="pc-inline">Parent / tuteur : <b>'+esc(p.name||'—')+'</b>'+
    (p.link?' ('+esc(p.link)+')':'')+
    (p.phone?' · <a href="'+esc(tel)+'">'+esc(p.phone)+'</a>':'')+
    (p.email?' · '+(mail?'<a href="'+esc(mail)+'">'+esc(p.email)+'</a>':esc(p.email)):'')+'</span>';
}
/* Repare les doublons et les matricules vides de l'annee en cours (jamais les archives) */
function repairMatricules(){
  const seen=new Set();let fixed=0;
  (DB.classes||[]).forEach(c=>(c.students||[]).forEach(st=>{
    let k=matKey(st.mat);
    if(!k||seen.has(k)){st.mat=genMat();k=matKey(st.mat);fixed++}
    seen.add(k);
  }));
  return fixed;
}
/* Les anciens matricules courts (MBI-0001) sont convertis une seule fois vers le
   format long et aleatoire. Les archives ne sont jamais modifiees. */
function upgradeLegacyMatricules(){
  let n=0;
  (DB.classes||[]).forEach(c=>(c.students||[]).forEach(st=>{
    const m=String(st.mat||'').trim().toUpperCase();
    if(/^MBI-?\d{1,4}$/.test(m)){st.mat=genMat();n++}
  }));
  return n;
}
const fmt=(v,d=2)=>v==null||isNaN(v)?'':Number(v).toFixed(d).replace('.',',');
const fmt1=v=>v==null?'—':fmt(v,2);
const rankStr=(r)=>r?((r.r===1?'1er':r.r+'e')+(r.tie?' ex':'')):'';
const obs=m=>m==null?'':m>17.99?'A+':m>11.99?'A':m>9.99?'E C A':'N A';
const cmpName=(a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'});
function studentPhotoSrc(cls,st){
  if(!st)return '';
  const p=typeof st.photo==='string'?st.photo:'';
  return /^data:image\/(?:jpeg|png|webp|gif);base64,/i.test(p)?p:'';
}
function compactStudentPhoto(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type||!file.type.startsWith('image/'))return reject(new Error('Choisissez un fichier image valide.'));
    if(file.size>10*1024*1024)return reject(new Error('La photo dépasse la taille autorisée de 10 Mo.'));
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error('Lecture de la photo impossible.'));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Cette image ne peut pas être ouverte.'));
      img.onload=()=>{
        const target=4/5;let sx=0,sy=0,sw=img.width,sh=img.height;
        if(sw/sh>target){sw=sh*target;sx=(img.width-sw)/2}else{sh=sw/target;sy=(img.height-sh)/2}
        const c=document.createElement('canvas');c.width=240;c.height=300;
        const ctx=c.getContext('2d');if(!ctx)return reject(new Error('Traitement de la photo impossible.'));
        ctx.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',.76));
      };
      img.src=String(rd.result);
    };
    rd.readAsDataURL(file);
  });
}
function previewStudentPhoto(input){
  const file=input.files&&input.files[0];if(!file)return;
  const row=input.closest('.row'),preview=row&&row.querySelector('[data-photo-preview]'),empty=row&&row.querySelector('[data-photo-empty]');
  if(!preview)return;
  const rd=new FileReader();rd.onload=()=>{preview.src=String(rd.result);preview.style.display='block';if(empty)empty.style.display='none'};rd.readAsDataURL(file);
}

function sha256Hex(text){
  const bytes=new TextEncoder().encode(text),bitLength=bytes.length*8;
  const totalLength=Math.ceil((bytes.length+9)/64)*64,data=new Uint8Array(totalLength);
  data.set(bytes);data[bytes.length]=0x80;
  const view=new DataView(data.buffer);
  view.setUint32(totalLength-8,Math.floor(bitLength/0x100000000),false);
  view.setUint32(totalLength-4,bitLength>>>0,false);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for(let off=0;off<totalLength;off+=64){
    const w=new Uint32Array(64);
    for(let i=0;i<16;i++)w[i]=view.getUint32(off+i*4,false);
    for(let i=16;i<64;i++){
      const x=w[i-15],y=w[i-2],s0=rotr(x,7)^rotr(x,18)^(x>>>3),s1=rotr(y,17)^rotr(y,19)^(y>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+SHA256_K[i]+w[i])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    h=[(h[0]+a)>>>0,(h[1]+b)>>>0,(h[2]+c)>>>0,(h[3]+d)>>>0,(h[4]+e)>>>0,(h[5]+f)>>>0,(h[6]+g)>>>0,(h[7]+hh)>>>0];
  }
  return h.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function legacyHashPw(pw,salt){
  const data=new TextEncoder().encode(salt+':'+pw);
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(const b of data){h1=Math.imul(h1^b,2654435761);h2=Math.imul(h2^b,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'f'+(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}

/* ---------- Calculs ---------- */
const seqIdx=t=>t===3?[4]:[(t-1)*2,(t-1)*2+1];
/* Une note existe des qu'une valeur numerique est saisie. 0 est une note a part entiere ;
   une case vide, une chaine vide ou NaN signifient « aucune donnee » : la matiere et son
   coefficient sont alors totalement ignores dans les calculs. */
const isNote=v=>v!=null&&v!==''&&Number.isFinite(Number(v));
function getG(cls,sid,sub){return(cls.grades[sid]&&cls.grades[sid][sub])||null}
function setG(cls,sid,sub,i,v){const g=cls.grades[sid]||(cls.grades[sid]={});const a=g[sub]||(g[sub]=[null,null,null,null,null]);a[i]=v}
function subAvg(cls,sid,sub,t){
  const g=getG(cls,sid,sub);if(!g)return null;
  if(t===3){
    /* T3 : M/20 = moyenne generale de la matiere = (T1 x2 + T2 x2 + N5) / 5.
       Les termes sans donnee ne sont pas ponderes : seul ce qui est saisi compte. */
    const seqMean=i=>{const v=[g[i*2],g[i*2+1]].filter(isNote).map(Number);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
    const t1=seqMean(0),t2=seqMean(1),n5=isNote(g[4])?Number(g[4]):null;
    let sw=0,sp=0;
    if(t1!=null){sp+=t1*2;sw+=2}
    if(t2!=null){sp+=t2*2;sw+=2}
    if(n5!=null){sp+=n5;sw+=1}
    return sw?sp/sw:null;
  }
  const v=seqIdx(t).map(i=>g[i]).filter(isNote).map(Number);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null
}
function compute(cls,t){
  const per={};
  for(const s of cls.students){
    const m={};let cs=0,pts=0;
    for(const sub of cls.subjects){
      const v=subAvg(cls,s.id,sub.id,t);m[sub.id]=v;
      /* Aucune note dans la matiere : ni la matiere ni son coefficient n'entrent dans la moyenne */
      if(v!=null&&isNote(v)){cs+=Number(sub.coef)||0;pts+=Number(v)*(Number(sub.coef)||0)}
    }
    per[s.id]={m,cs,pts,avg:cs>0?pts/cs:null,sr:{}};
  }
  const key=s=>Math.round(per[s.id].avg*100);
  const ranked=cls.students.filter(s=>per[s.id].avg!=null);
  const keys=ranked.map(key).sort((a,b)=>b-a);
  for(const s of ranked){const k=key(s);per[s.id].rank={r:keys.indexOf(k)+1,tie:keys.filter(x=>x===k).length>1}}
  for(const sub of cls.subjects){
    const ks=cls.students.map(s=>per[s.id].m[sub.id]).filter(v=>v!=null).map(v=>Math.round(v*100)).sort((a,b)=>b-a);
    for(const s of cls.students){const v=per[s.id].m[sub.id];if(v!=null){const k=Math.round(v*100);per[s.id].sr[sub.id]={r:ks.indexOf(k)+1,tie:ks.filter(x=>x===k).length>1}}}
  }
  const avgs=ranked.map(s=>per[s.id].avg);
  return{per,ranked,classAvg:avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null};
}
function getRes(cls,t){const k=cls.id+':'+t;return calcCache[k]||(calcCache[k]=compute(cls,t))}

    const notee=(m!=null&&isNote(m));

      coef:notee?sub.coef:null,pts:notee?m*sub.coef:null,rank:notee?res.per[sid].sr[sub.id]:null,notee});
    if(notee&&cur){gc+=Number(sub.coef)||0;gp+=m*(Number(sub.coef)||0)}
  }

}
function missingCount(cls,sid,t){
  let n=0;const seqs=seqIdx(t);
  for(const sub of cls.subjects){if(sub.opt)continue;const g=getG(cls,sid,sub.id);if(!g||seqs.some(i=>g[i]==null))n++}
  return n;
}
function completion(cls,t){
  const subs=cls.subjects.filter(s=>!s.opt);const seqs=seqIdx(t);const tot=cls.students.length*subs.length*seqs.length;if(!tot)return null;
  let f=0;
  for(const s of cls.students)for(const sub of subs){const g=getG(cls,s.id,sub.id);if(g)for(const i of seqs)if(g[i]!=null)f++}
  return f/tot;
}

/* ---------- Suivi de la saisie des notes ----------
   Pour un trimestre donne, on lit chaque classe / matiere et on compte les cases
   de notes encore vides. Sert au bouton « Exporter les notes manquantes » de
   l'onglet Notes : l'administrateur voit d'un coup d'oeil quels professeurs
   n'ont pas termine la saisie. */
function missingNoteSummary(rows){
  const by=new Map();
  for(const r of rows){
    const k=r.teacher||'Aucun enseignant affecté';
    if(!by.has(k))by.set(k,{classes:new Set(),subjects:0,missing:0});
    const e=by.get(k);e.classes.add(r.cls);e.subjects++;e.missing+=r.missing;
  }
  return by;
}
function missingNoteRows(t){
  const seqs=seqIdx(t),users=viewUsers(),rows=[];
  for(const cls of visibleClasses()){
    if(!cls.students.length)continue;
    for(const sub of cls.subjects){
      let expected=0,filled=0,missing=0;const studentsMissing=[];
      for(const st of cls.students){
        const g=getG(cls,st.id,sub.id);let manque=0;
        for(const i of seqs){
          expected++;
          const v=g?g[i]:null;
          if(v==null||v==='')manque++;else filled++;
        }
        if(manque){missing+=manque;studentsMissing.push(st.name)}
      }
      if(!missing)continue;
      const u=users.find(x=>x.id===sub.teacherId);
      rows.push({cls:cls.name,subject:sub.name+(sub.opt?' (option)':''),teacher:u?u.name:(sub.teacherName||''),
        students:cls.students.length,expected,filled,missing,studentsMissing});
    }
  }
  return rows;
}
/* Regroupement par classe des professeurs qui n'ont encore saisi AUCUNE note
   dans cette classe au trimestre demande. Des qu'une seule note est saisie
   par un professeur dans la classe, son nom disparait de la liste. */
function missingStartRows(t){
  const seqs=seqIdx(t),users=viewUsers(),out=[];
  for(const cls of visibleClasses()){
    if(!cls.students.length)continue;
    const by=new Map();
    for(const sub of cls.subjects){
      const u=users.find(x=>x.id===sub.teacherId);
      const key=u?u.id:('~'+(sub.teacherName||''));
      let filled=0,missing=0;
      for(const st of cls.students){
        const g=getG(cls,st.id,sub.id);
        for(const i of seqs){
          const v=g?g[i]:null;
          if(v==null||v==='')missing++;else filled++;
        }
      }
      if(!filled&&!missing)continue;
      if(!by.has(key))by.set(key,{name:u?u.name:(sub.teacherName||''),filled:0,missing:0});
      const e=by.get(key);e.filled+=filled;e.missing+=missing;
    }
    const names=[...by.values()].filter(e=>e.missing>0&&e.filled===0).map(e=>e.name||'Aucun enseignant affecté');
    if(names.length)out.push({cls:cls.name,names});
  }
  return out;
}
function missingStartTotal(rows){return rows.reduce((n,r)=>n+r.names.length,0)}
function exportMissingNotes(t){
  const rows=missingNoteRows(t);
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const line=a=>a.map(q).join(';');
  const out=[];
  out.push(line(['École',DB.school.name]));
  out.push(line(['Année scolaire',viewYear()]));
  out.push(line(['Trimestre',TRN[t-1]+' trimestre']));
  out.push(line(['Édité le',new Date().toLocaleString('fr-FR')]));
  out.push(line(['Matières à compléter',rows.length]));
  out.push('');
  out.push(line(['Classe','Matière','Enseignant','Élèves','Notes attendues','Notes saisies','Notes manquantes','Élèves concernés','Noms des élèves concernés']));
  if(!rows.length)out.push(line(['—','Toutes les notes sont saisies','','','','','','','']));
  for(const r of rows){
    out.push(line([r.cls,r.subject,r.teacher||'Aucun enseignant affecté',r.students,r.expected,r.filled,r.missing,
      r.studentsMissing.length,r.studentsMissing.join(', ')]));
  }
  /* Recapitulatif par enseignant : ce que chacun doit encore saisir */
  const byTeacher=missingNoteSummary(rows);
  if(byTeacher.size){
    out.push('');
    out.push(line(['Enseignants concernés','Classes','Matières','Notes manquantes']));
    for(const [name,e] of byTeacher)out.push(line([name,e.classes.size,e.subjects,e.missing]));
  }
  const name=('notes_a_completer_'+viewYear().replace(/[^0-9]+/g,'-')+'_T'+t+'_'+new Date().toISOString().slice(0,10)+'.csv');
  download(name,'\ufeff'+out.join('\r\n'),'text/csv;charset=utf-8');
  toast(rows.length?rows.length+' matière'+(rows.length>1?'s':'')+' à compléter — fichier exporté.':'Toutes les notes du '+TRN[t-1]+' trimestre sont saisies.','ok');
}
/* ---------- Génération PDF (aucune dépendance, fonctionne hors ligne) ----------
   L'application est un fichier HTML autonome, sans accès réseau : plutôt que de
   passer par la boîte d'impression du navigateur, on écrit directement la
   structure d'un PDF (texte Helvetica + encodage WinAnsi) pour que les rapports
   se téléchargent en .pdf, données comprises. */
const PDFW={space:278,'!':278,'"':355,'#':556,$:556,'%':889,'&':667,"'":191,'(':333,')':333,'*':389,'+':584,',':278,'-':333,'.':278,'/':278,
 '0':556,'1':556,'2':556,'3':556,'4':556,'5':556,'6':556,'7':556,'8':556,'9':556,':':278,';':278,'<':584,'=':584,'>':584,'?':556,'@':1015,
 A:667,B:667,C:722,D:722,E:667,F:611,G:778,H:722,I:278,J:500,K:667,L:556,M:833,N:722,O:778,P:667,Q:778,R:722,S:667,T:611,U:722,V:667,W:944,X:667,Y:667,Z:611,
 '[':278,'\\':278,']':278,'^':469,_:556,'`':333,
 a:556,b:556,c:500,d:556,e:556,f:278,g:556,h:556,i:222,j:222,k:500,l:222,m:833,n:556,o:556,p:556,q:556,r:333,s:500,t:278,u:556,v:500,w:722,x:500,y:500,z:500,
 '{':334,'|':260,'}':334,'~':584,'€':556,'’':191,'‘':191,'–':556,'—':1000,'…':1000,'•':350,'œ':944,'Œ':1000,'«':556,'»':556,'°':400};
/* Largeur d'un texte en points (approximation Helvetica par caractère). */
function pdfW(str,size,bold){
  let u=0;
  for(const ch of String(str==null?'':str)){const b=ch.normalize('NFD')[0];u+=PDFW[b]!==undefined?PDFW[b]:556}
  return u/1000*size*(bold?1.045:1);
}
/* Coupe un texte trop large, avec des points de suspension. */
function pdfCut(str,size,maxW,bold){
  const s=String(str==null?'':str);
  if(pdfW(s,size,bold)<=maxW)return s;
  let out='';
  for(const ch of s){
    if(pdfW(out+ch+'…',size,bold)>maxW)break;
    out+=ch;
  }
  return out.replace(/\s+$/,'')+'…';
}
/* Découpe un texte en lignes qui tiennent dans maxW (retour à la ligne par mots). */
function pdfWrap(str,size,maxW,bold){
  const words=String(str==null?'':str).split(/\s+/).filter(Boolean);
  if(!words.length)return [''];
  const lines=[];let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(pdfW(t,size,bold)<=maxW){cur=t}
    else{
      if(cur)lines.push(cur);
      if(pdfW(w,size,bold)>maxW){
        /* mot trop long (matricule, adresse) : on le coupe */
        let rest=w;
        while(pdfW(rest,size,bold)>maxW){
          let piece='';
          for(const ch of rest){if(pdfW(piece+ch,size,bold)>maxW)break;piece+=ch}
          if(!piece)piece=rest[0];
          lines.push(piece);rest=rest.slice(piece.length);
        }
        cur=rest;
      }else cur=w;
    }
  }
  if(cur)lines.push(cur);
  return lines;
}
/* Comme pdfWrap, mais chaque élément (un nom) reste entier sur sa ligne. */
function pdfWrapList(items,size,maxW,bold){
  const lines=[];let cur='';
  for(const raw of items){
    const it=String(raw==null?'':raw);
    const cand=cur?cur+', '+it:it;
    if(pdfW(cand,size,bold)<=maxW){cur=cand;continue}
    if(cur){lines.push(cur);cur=''}
    if(pdfW(it,size,bold)<=maxW){cur=it}
    else{
      /* nom démesuré : on le coupe proprement */
      let rest=it;
      while(pdfW(rest,size,bold)>maxW){
        let piece='';
        for(const ch of rest){if(pdfW(piece+ch,size,bold)>maxW)break;piece+=ch}
        if(!piece)piece=rest[0];
        lines.push(piece);rest=rest.slice(piece.length);
      }
      cur=rest;
    }
  }
  if(cur)lines.push(cur);
  return lines;
}
/* Chaîne PDF : caractères WinAnsi (les accents français tiennent sur 1 octet). */
function pdfLatin(str){
  const map={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,
    0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,
    0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
  let out='';
  for(const ch of String(str==null?'':str)){
    const c=ch.codePointAt(0);
    if(c===10||c===13||c===9){out+=' ';continue}
    if(c<32){continue}
    if(map[c]!==undefined)out+=String.fromCharCode(map[c]);
    else if(c<256)out+=String.fromCharCode(c);
    else if(c<0x0100)out+=String.fromCharCode(c); /* latin étendu : approché */
    else out+='?';
  }
  return out;
}
const pdfEsc=s=>pdfLatin(s).replace(/[\\()]/g,c=>'\\'+c);
/* Assemble les objets PDF : polices Helvetica (F1 normale, F2 gras). */
function buildPdfBytes(pages){
  const objs=[];const put=(n,b)=>{objs[n]=b};
  const pageNums=[],contentNums=[];let n=5;
  pages.forEach(()=>{pageNums.push(n);contentNums.push(n+1);n+=2});
  put(1,'<< /Type /Catalog /Pages 2 0 R >>');
  put(2,'<< /Type /Pages /Kids ['+pageNums.map(x=>x+' 0 R').join(' ')+'] /Count '+pages.length+' >>');
  put(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  put(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  pages.forEach((p,i)=>{
    put(pageNums[i],'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] '+
      '/Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+contentNums[i]+' 0 R >>');
    put(contentNums[i],'<< /Length '+p.length+' >>\nstream\n'+p+'\nendstream');
  });
  let out='%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n';
  const off=[];
  for(let i=1;i<objs.length;i++){off[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}
  const xref=out.length;
  out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(let i=1;i<objs.length;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  const bytes=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
  return bytes;
}
/* Petit moteur de mise en page A4 : texte, filets, tableaux paginés. */
function PdfDoc(){
  const d={pages:[],cur:'',y:0,W:595.28,H:841.89,M:36,has:false};
  d.cw=d.W-2*d.M;
  const put=s=>{d.cur+=s;d.has=true};
  const PY=y=>d.H-y;                       /* y : distance depuis le haut */
  d.text=(str,x,y,size,font,color)=>{
    if(str==null||str==='')return;
    const col=color||[0,0,0];
    put('BT /'+(font||'F1')+' '+size+' Tf '+col.map(c=>c.toFixed(3)).join(' ')+' rg '+
      x.toFixed(2)+' '+PY(y).toFixed(2)+' Td ('+pdfEsc(str)+') Tj ET\n');
  };
  d.textRight=(str,xr,y,size,font,color)=>d.text(str,xr-pdfW(str,size,font==='F2'),y,size,font,color);
  d.rect=(x,y,w,h,fill,stroke,lw)=>{
    if(fill)put(fill.map(c=>c.toFixed(3)).join(' ')+' rg '+x.toFixed(2)+' '+(PY(y+h)).toFixed(2)+' '+w.toFixed(2)+' '+h.toFixed(2)+' re f\n');
    if(stroke)put(stroke.map(c=>c.toFixed(3)).join(' ')+' RG '+(lw||0.5)+' w '+x.toFixed(2)+' '+(PY(y+h)).toFixed(2)+' '+w.toFixed(2)+' '+h.toFixed(2)+' re S\n');
  };
  d.hline=(x1,x2,y,color,lw)=>put((color||[0,0,0]).map(c=>c.toFixed(3)).join(' ')+' RG '+(lw||0.5)+' w '+
    x1.toFixed(2)+' '+PY(y).toFixed(2)+' m '+x2.toFixed(2)+' '+PY(y).toFixed(2)+' l S\n');
  d.newPage=()=>{if(d.has)d.endPage();d.cur='';d.has=false;d.y=d.M};
  d.endPage=()=>{
    d.textRight('page __PAGE__/__NPAGES__',d.W-d.M,d.H-20,7.5,'F1',[0.45,0.5,0.58]);
    d.pages.push(d.cur);d.cur='';d.has=false;
  };
  d.need=h=>{if(d.y+h>d.H-d.M-16){d.newPage();return true}return false};
  /* Tableau : cols=[{w,label,align}] — rows = [[valeurs]] */
  d.table=(cols,rows,opt)=>{
    const o=opt||{},size=o.size||8,lh=size*1.28,pad=3.2,headH=15,headSize=o.headSize||7.4;
    const drawHead=()=>{
      if(o.headFill!==false)d.rect(d.M,d.y,d.cw,headH,[0.929,0.945,0.965],[0.72,0.76,0.82],0.5);
      let x=d.M;
      cols.forEach(c=>{
        const label=c.label;
        const lab=pdfCut(label,headSize,c.w-6,true);
        d.text(lab, c.align==='right'?x+c.w-3-pdfW(lab,headSize,true):x+3,
          d.y+10.4,headSize,'F2',[0.06,0.10,0.18]);
        x+=c.w;
      });
      d.y+=headH;
    };
    d.need(headH+18);drawHead();
    let z=0;
    for(const r of rows){
      const cells=r.map((v,i)=>pdfWrap(String(v==null?'':v),size,cols[i].w-6,false));
      const maxL=Math.max.apply(null,cells.map(c=>c.length));
      const h=Math.max(o.rowH||13,maxL*lh+pad*2);
      if(d.y+h>d.H-d.M-18){d.newPage();drawHead()}
      if(o.zebra!==false&&z%2===1)d.rect(d.M,d.y,d.cw,h,[0.975,0.98,0.99]);
      let x=d.M;
      r.forEach((v,i)=>{
        const col=cols[i];const bold=o.boldCols&&o.boldCols.indexOf(i)>=0;
        cells[i].forEach((ln,k)=>{
          const tx=col.align==='right'?x+col.w-3-pdfW(ln,size,bold):x+3;
          d.text(ln,tx,d.y+pad+(k+1)*lh-size*0.22,size,bold?'F2':'F1',col.color||[0.09,0.12,0.18]);
        });
        x+=col.w;
      });
      d.y+=h;
      d.hline(d.M,d.M+d.cw,d.y,[0.85,0.88,0.92],0.4);
      z++;
    }
  };
  d.finish=()=>{
    if(d.has)d.endPage();
    if(!d.pages.length){d.cur='';d.has=true;d.endPage()}
    const n=d.pages.length;
    const pages=d.pages.map((p,i)=>p.replace(/__PAGE__/g,String(i+1)).replace(/__NPAGES__/g,String(n)));
    return buildPdfBytes(pages);
  };
  return d;
}
function downloadBytes(name,bytes,mime){

/* ---------- Conseil de classe ----------
   Une liste alphabetique par classe pour le conseil de classe : nom et prenom,
   moyenne du trimestre, heures d'absence non justifiees, appreciation du
   travail et une colonne Observation laissee vide. */
function classCouncilData(t){
  /* La liste est refaite a zero a chaque trimestre : seules les notes et les
     absences du trimestre choisi sont lues. Au 3e trimestre, la reference
     devient annuelle (moyenne et rang de l'annee, absences cumulees) : le
     conseil de classe du 3e trimestre est le bilan de l'annee. */
  return visibleClasses().map(cls=>{
    const res=getRes(cls,t),ann=t===3?annualStats(cls):null,ref=ann?ann.per:res.per;
    const rows=[...cls.students].sort(cmpName).map(s=>{
      const P=ref[s.id]||{};
      const abs=t===3?discSum(cls,s.id,'absNJ'):discVal(cls,s.id,t,'absNJ');
      const hi=honourInfo(cls,s.id,t);
      /* TH : tableau d'honneur seul ; THF : + felicitations ; THFA : + felicitations + encouragements */
      const th=!(hi&&hi.on)?'':(hi.enc?'THFA':(hi.fel?'THF':'TH'));
      return {name:s.name,avg:P.avg==null?null:P.avg,rank:P.rank?rankStr(P.rank):'',
        abs:abs,appr:P.avg==null?'':mention(P.avg),th:th};
    });
    const avgs=rows.map(r=>r.avg).filter(v=>v!=null);
    return {cls:cls.name,pp:ppName(cls),rows:rows,
      mean:avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null,
      hon:rows.filter(r=>r.th).length};
  }).filter(g=>g.rows.length);
}

/* Réduit l'échelle d'un bulletin trop haut pour qu'il tienne sur UNE seule page A4.
   La mise en page, les polices et les marges restent celles de l'écran : rien d'autre ne change. */
function fitBulletinsOnePage(){
  const root=$('#printRoot');
  if(!root||!root.children.length)return;
  const availPx=(297-18-3)*3.7795275591;   // A4 297 mm - 2 x 9 mm de marge - 3 mm de sécurité
  const prev=root.getAttribute('style')||'';
  root.style.cssText='display:block!important;position:fixed;left:-20000px;top:0;width:auto;visibility:hidden;z-index:-1';
  $$('#printRoot .bulletin').forEach(b=>{
    b.style.zoom='';b.style.transform='';b.style.marginBottom='';
    const h=b.getBoundingClientRect().height||b.scrollHeight||0;
    if(h>availPx){
      const k=Math.max(.55,Math.min(1,(availPx/h)*.99));
      if(window.CSS&&CSS.supports&&CSS.supports('zoom','0.9')){b.style.zoom=String(k)}
      else{b.style.transformOrigin='top left';b.style.transform='scale('+k+')';b.style.marginBottom='-'+(h*(1-k))+'px'}
    }
  });
  root.setAttribute('style',prev);
}
function printHtml(html){
  if(!isAdmin()){toast('Impression réservée à l’administrateur.','err');return}
  $('#printRoot').innerHTML=html;
  fitBulletinsOnePage();

  setTimeout(()=>{fitBulletinsOnePage();window.print()},180);
}

const schoolInitial=()=>{const n=String((viewSchool()&&viewSchool().name)||'').trim();return n?n[0].toLocaleUpperCase('fr'):'·'};

/* ---------- Discipline : saisie par le surveillant general ---------- */
const DISC_FIELDS=[
  {k:'absNJ',fr:'Abs. non. J. (h)',             en:'Unexcused absences (h)'},
  {k:'absJ', fr:'Abs. just. (h)',               en:'Excused absences (h)'},
  {k:'ret',  fr:'Retards (nombre de fois)',     en:'Lateness (times)'},
  {k:'cons', fr:'Consignes (h)',                en:'Punishment (h)'}
];
/* cls.disc = { [studentId]: { t1:{absNJ,absJ,ret,cons}, t2:{...}, t3:{...} } } */
function discGet(cls,sid,t){const m=cls.disc&&cls.disc[sid];return (m&&m['t'+t])||null}
function discVal(cls,sid,t,k){const d=discGet(cls,sid,t);if(!d)return null;const v=d[k];return (v==null||v===''||isNaN(v))?null:Number(v)}
function discSet(cls,sid,t,k,v){
  const m=cls.disc||(cls.disc={}),e=m[sid]||(m[sid]={}),d=e['t'+t]||(e['t'+t]={});
  if(v==null||v===''||isNaN(v))delete d[k];else d[k]=Math.max(0,Number(v));
}
/* Synthese annuelle : somme des trois trimestres */
function discSum(cls,sid,k){let a=0,any=false;for(const t of[1,2,3]){const v=discVal(cls,sid,t,k);if(v!=null){a+=v;any=true}}return any?a:null}
const discNum=v=>{if(v==null)return null;const r=Math.round(v*100)/100;return Number.isInteger(r)?String(r):String(r).replace('.',',')};

/* ---------- Bas du bulletin : discipline / travail / profil de classe / visas ---------- */

/* ---------- Tableau d'honneur ----------
   Conditions uniques, partagees par la case cochee sur le bulletin et par le
   diplome : moyenne de reference >= 12/20 et solde d'absences non justifiees
   inferieur a 5 h. Au 3e trimestre la reference est la moyenne annuelle, comme
   sur le bulletin. Les mentions sont cumulables : felicitations de 15,00 a
   15,99 ; encouragements a partir de 16,00. */
function honourInfo(cls,sid,t){
  const res=getRes(cls,t),P=res.per&&res.per[sid];
  if(!P)return null;
  const A=t===3?annualStats(cls):null;
  const ref=A?(A.per[sid]?A.per[sid].avg:null):P.avg;
  if(ref==null)return null;
  const gNJ=t===3?discSum(cls,sid,'absNJ'):discVal(cls,sid,t,'absNJ');
  const gJ =t===3?discSum(cls,sid,'absJ') :discVal(cls,sid,t,'absJ');
  const solde=Math.max(0,(gNJ||0)-(gJ||0));
  const on=ref>=12&&solde<5;
  return{on:on,avg:ref,solde:solde,t3:t===3,rank:(A?(A.per[sid]&&A.per[sid].rank):P.rank)||null,
    fel:on&&ref>=15&&ref<16,enc:on&&ref>=16};
}

function honDateLine(sc){
  const ville=(sc&&sc.city?String(sc.city).trim():'');

   '<div class="b-line"><span class="lbl">Né(e) le</span><span class="val">'+esc(st.dob||'—')+(st.pob?' à '+esc(st.pob):'')+'</span><span class="lbl cel nw mat-line">Matricule :&nbsp;<b>'+esc(st.mat||'—')+'</b></span></div>'+

   '<thead><tr><th>'+L.subject+'</th>'+order.map(k=>'<th>'+hd[k]+'</th>').join('')+'<th>'+L.rank+'</th><th>'+L.obs+'</th></tr></thead><tbody>'+b+'</tbody></table>'+

// ===================== Synchronisation (Supabase ou serveur e-school) =====================
// Le stockage local reste la source de vérité hors ligne.
// Dès qu'une URL + clé anon + code école sont renseignés, les données sont
// partagées entre l'administrateur et tous les professeurs.
const CLOUD_KEY='mbi_cloud_v1';

const Cloud={
  cfg:{mode:'',url:'',key:'',schoolId:''},
  client:null,online:false,busy:false,snap:null,pollT:null,ch:null,localAt:0,last:'',msg:'',
  _lib:null,

  load(){
    try{
      const c=JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}');
      this.cfg={mode:c.mode||(c.key?'supabase':(c.url?'http':'')),url:c.url||'',key:c.key||'',schoolId:c.schoolId||''};
    }catch(e){}
    return this.cfg;
  },
  store(){try{localStorage.setItem(CLOUD_KEY,JSON.stringify(this.cfg))}catch(e){}},
  enabled(){
    if(!this.cfg.url||!this.cfg.schoolId)return false;
    return this.cfg.mode==='http'?true:!!this.cfg.key;
  },
  newSchoolId(){const c='0123456789abcdef';let s='sch-';for(let i=0;i<24;i++)s+=c[Math.floor(Math.random()*16)];return s},

  libLoad(){
    if(window.supabase)return Promise.resolve(true);
    if(this._lib)return this._lib;
    this._lib=new Promise(res=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
      s.onload=()=>res(!!window.supabase);
      s.onerror=()=>res(false);
      document.head.appendChild(s);
    });
    // filet de sécurité : si le CDN ne répond pas, on continue en mode local
    return Promise.race([this._lib,new Promise(r=>setTimeout(()=>r(!!window.supabase),8000))]);
  },

  badge(){
    const b=document.getElementById('cloudBadge');if(!b)return;
    if(!this.enabled()){b.style.display='none';return}
    b.style.display='';b.className='badge '+(this.online?'ok':'warn');
    b.textContent=this.online?'En ligne':'Hors ligne';
    b.title=this.last?('Dernière synchronisation : '+this.last):'Aucune synchronisation';
  },
  setMsg(m){this.msg=m;const el=document.getElementById('cloud-status');if(el)el.textContent=m;this.badge()},

  async connect(){
    if(!this.enabled()){this.setMsg('Synchronisation non configurée — mode local.');return false}
    if(this.cfg.mode==='http')return await this.connectHttp();
    this.setMsg('Connexion à Supabase…');
    if(!await this.libLoad()){this.setMsg('Bibliothèque Supabase inaccessible (pas d’Internet ?). Mode local actif.');return false}
    try{
      this.client=window.supabase.createClient(this.cfg.url,this.cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});
      // Connexion anonyme si l'option est activée dans Supabase (mode sécurisé).
      try{await this.client.auth.signInAnonymously()}catch(e){}
      const {error}=await this.client.rpc('app_pull',{p_school:this.cfg.schoolId});
      if(error)throw new Error(error.message||'Connexion refusée');
      this.online=true;
      this.setMsg('Connecté à Supabase ('+this.cfg.url.replace(/^https?:\/\//,'')+'). Synchronisation active.');
      this.startPoll();this.startRealtime();
      return true;
    }catch(e){
      this.online=false;this.client=null;
      this.setMsg('Connexion impossible : '+(e.message||e)+' — vérifiez l’URL, la clé et que le script SQL a bien été exécuté.');
      return false;
    }
  },

  // -------- lecture / écriture locale sans repasser par le cloud --------
  saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}},

  /* -------- transport --------
     'supabase' : fonctions SQL app_pull / app_push (service hébergé).
     'http'     : deux routes POST /pull et /push sur votre propre serveur
                  (server/e-school-server.py fournit SQLite clé en main).
     L'application ne parle que ce petit contrat : n'importe quel serveur
     (SQLite, PostgreSQL, MySQL…) peut le mettre en œuvre. */
  async httpRpc(path,body){
    const base=String(this.cfg.url||'').replace(/\/+$/,'');
    const headers={'Content-Type':'application/json'};
    if(this.cfg.key)headers['Authorization']='Bearer '+this.cfg.key;
    const res=await fetch(base+path,{method:'POST',headers,body:JSON.stringify(body)});
    const txt=await res.text();
    let data=null;
    try{data=txt?JSON.parse(txt):{}}catch(e){throw new Error('Réponse illisible du serveur ('+res.status+')')}
    if(!res.ok)throw new Error((data&&data.error)||('HTTP '+res.status));
    return data;
  },
  async send(payload){
    if(this.cfg.mode==='http'){
      await this.httpRpc('/push',{school:this.cfg.schoolId,payload});
      return;
    }
    const {error}=await this.client.rpc('app_push',{p_school:this.cfg.schoolId,p_payload:payload});
    if(error)throw new Error(error.message||'Écriture refusée');
  },
  /* Efface dans la base partagée toutes les données de cette école. Utilisé
     par « Tout effacer » pour que les données supprimées ici ne reviennent pas
     à la prochaine synchronisation. */
  async clearRemote(){
    if(!this.enabled())return false;
    if(this.cfg.mode!=='http'&&!this.client)return false;
    try{
      const data=await this.fetchAll();
      const del={};
      ['users','classes','subjects','students','remarks','lessons','finance','archived','sessions'].forEach(k=>{
        const list=Array.isArray(data[k])?data[k].map(r=>r&&r.id).filter(Boolean):[];
        if(list.length)del[k]=list;
      });
      const grades=Array.isArray(data.grades)?data.grades.map(r=>r&&r.id).filter(Boolean):[];
      if(Object.keys(del).length)await this.send({deleted:del});
      for(let i=0;i<grades.length;i+=600)await this.send({deleted:{grades:grades.slice(i,i+600)}});
      this.snap=null;this.pending=false;this.setMsg('Base partagée vidée.');
      return true;
    }catch(e){
      this.setMsg('Base partagée non vidée : '+(e.message||e));
      return false;
    }
  },
  async fetchAll(){
    if(this.cfg.mode==='http')return await this.httpRpc('/pull',{school:this.cfg.schoolId});
    const {data,error}=await this.client.rpc('app_pull',{p_school:this.cfg.schoolId});
    if(error)throw new Error(error.message||'Lecture refusée');
    return data;
  },
  async connectHttp(){
    this.setMsg('Connexion à la base…');
    try{
      await this.httpRpc('/pull',{school:this.cfg.schoolId});
      this.online=true;
      this.setMsg('Connecté à la base ('+String(this.cfg.url).replace(/^https?:\/\//,'')+'). Synchronisation active.');
      this.startPoll();
      return true;
    }catch(e){
      this.online=false;
      this.setMsg('Connexion impossible : '+(e.message||e)+' — vérifiez l’adresse du serveur et le jeton.');
      return false;
    }
  },
  renderIfPossible(){try{if(typeof ME!=='undefined'&&ME)render()}catch(e){}},

  // -------- conversion de la base locale en lignes SQL --------
  rows(){
    const o={users:[],classes:[],subjects:[],students:[],grades:[],remarks:[],lessons:[],finance:[],archived:[],sessions:[]};
    (DB.users||[]).forEach(u=>o.users.push({id:u.id,username:u.username,name:u.name,phone:u.phone||'',role:u.role,salt:u.salt||'',hash:u.hash||''}));
    (DB.classes||[]).forEach(c=>{
      o.classes.push({id:c.id,name:c.name,preset_key:c.presetKey||'',ord:c.ord||0,lang:c.lang||'fr',pp_id:c.ppId||'',pp_name:c.ppName||'',pp_tel:c.ppTel||'',locks:c.locks||{}});
      (c.subjects||[]).forEach((s,i)=>o.subjects.push({id:s.id,class_id:c.id,name:s.name,coef:Number(s.coef)||0,is_opt:!!s.opt,group_name:s.group||'',teacher_id:s.teacherId||'',ord:i}));
      (c.students||[]).forEach((s,i)=>o.students.push({id:s.id,class_id:c.id,name:s.name,sex:s.sex||'',mat:s.mat||'',dob:s.dob||'',pob:s.pob||'',parent:s.parent||'',parent_link:s.parentLink||'',parent_phone:s.parentPhone||'',parent_email:s.parentEmail||'',photo:s.photo||'',session_tag:s.sessionTag||'N',ord:i}));
      for(const sid in (c.grades||{})){
        for(const sub in c.grades[sid]){
          const arr=c.grades[sid][sub]||[];
          if(!arr.some(v=>v!=null&&v!==''))continue;
          const seqs=[0,1,2,3,4].map(i=>(arr[i]==null||arr[i]==='')?null:Number(arr[i]));
          o.grades.push({id:sid+':'+sub,student_id:sid,subject_id:sub,seqs});
        }
      }
      for(const sid in (c.remarks||{})){
        const r=c.remarks[sid]||{};
        [1,2,3].forEach(t=>{if(r['t'+t])o.remarks.push({id:sid+':t'+t,student_id:sid,trim:t,text:r['t'+t]})});
      }
      for(const sub in (c.lessons||{})){
        const l=c.lessons[sub]||{};
        o.lessons.push({id:c.id+':'+sub,class_id:c.id,subject_id:sub,planned:Number(l.planned)||0,done:Number(l.done)||0,at:Number(l.at)||null});
      }
    });
    /* Finances : un enregistrement par eleve (montant + versements). */
    const fin=financeStore();
    (DB.classes||[]).forEach(c=>(c.students||[]).forEach(s=>{
      const pays=fin.pays[s.id];
      const fee=Object.prototype.hasOwnProperty.call(fin.fees,s.id)?Number(fin.fees[s.id]):null;
      if(fee===null&&(!pays||!pays.length))return;
      o.finance.push({id:s.id,fee:pays?fee:(fee==null?null:fee),pays:Array.isArray(pays)?pays:[]});
    }));
    /* Eleves archives : conserves avec leurs notes et absences. */
    (Array.isArray(DB.archivedStudents)?DB.archivedStudents:[]).forEach(r=>{
      o.archived.push({id:r.id,at:r.at||'',by:r.by||'',year:r.year||'',class_id:r.classId||'',class_name:r.className||'',data:r.data||{},snapshot:r.snapshot||{}});
    });
    /* Sessions cloturees (annees precedentes). */
    (Array.isArray(DB.sessions)?DB.sessions:[]).forEach(a=>{
      o.sessions.push({id:a.id,year:a.year||'',closed_at:a.closedAt||'',payload:a});
    });
    return o;
  },

  /* Copie profonde : sans elle, this.snap partage les tableaux de DB
     (versements, verrous…) et une modification faite en place passerait
     inaperçue au calcul des différences. */
  freeze(rows){try{return JSON.parse(JSON.stringify(rows))}catch(e){return rows}},

  diff(rows){
    const prev=this.snap||{};
    const payload={},deleted={};let n=0;
    for(const t in rows){
      const old={};(prev[t]||[]).forEach(r=>old[r.id]=r);
      const seen={},changed=[];
      rows[t].forEach(r=>{seen[r.id]=1;const p=old[r.id];if(!p||JSON.stringify(p)!==JSON.stringify(r)){changed.push(r);n++}});
      const gone=(prev[t]||[]).filter(r=>!seen[r.id]).map(r=>r.id);
      if(changed.length)payload[t]=changed;
      if(gone.length){deleted[t]=gone;n+=gone.length}
    }
    return {payload,deleted,n};
  },

  // -------- envoi (delta uniquement) --------
  async push(force){
    if(!this.enabled())return false;
    if(this.cfg.mode!=='http'&&!this.client)return false;
    if(this.busy)return false;
    const rows=this.rows();
    const {payload,deleted,n}=this.diff(rows);
    if(!n&&!force){this.snap=this.freeze(rows);this.pending=false;return true}
    this.busy=true;this.setMsg('Envoi des modifications…');
    this.pending=false;   // ce qui suit couvre l'état courant
    let sent=false;
    try{
      const school={name:DB.school.name||'',city:DB.school.city||'',year:DB.school.year||'',principal:DB.school.principal||'',header:DB.school.header||null,logo:DB.school.logo||null};
      const head={school,deleted:{}};
      ['users','classes','subjects','students','remarks','lessons','finance','archived','sessions'].forEach(t=>{if(payload[t])head[t]=payload[t]});
      Object.keys(deleted).forEach(t=>{if(t!=='grades')head.deleted[t]=deleted[t]});
      await this.send(head);
      // notes par lots de 600 pour ne pas dépasser la taille maximale d'une requête
      const grades=payload.grades||[];
      for(let i=0;i<grades.length;i+=600){
        await this.send({grades:grades.slice(i,i+600)});
      }
      if(deleted.grades&&deleted.grades.length){
        await this.send({deleted:{grades:deleted.grades}});
      }
      this.snap=this.freeze(rows);this.last=new Date().toLocaleTimeString('fr-FR');
      this.online=true;sent=true;
      this.setMsg('Synchronisé — '+this.last+' ('+n+' élément'+(n>1?'s':'')+' envoyé'+(n>1?'s':'')+').');
      return true;
    }catch(e){
      this.pending=true;  // à renvoyer plus tard
      this.setMsg('Erreur d’envoi : '+(e.message||e));
      return false;
    }finally{
      this.busy=false;
      // Une saisie est arrivée pendant l'envoi : on la renvoie sans attendre.
      if(sent&&this.pending){clearTimeout(this._t);this._t=setTimeout(()=>this.push(false),1200)}
    }
  },

  schedule(){
    this.localAt=Date.now();
    if(!this.enabled())return;
    if(this.cfg.mode!=='http'&&!this.client)return; // en mode serveur, pas de client Supabase
    this.pending=true;                              // écriture locale pas encore envoyée
    clearTimeout(this._t);
    this._t=setTimeout(()=>{this.push(false)},2500);
  },

  // -------- récupération --------
  async pull(force){
    if(!this.enabled())return false;
    if(this.cfg.mode!=='http'&&!this.client)return false;
    if(!force&&this.pending)return false;                  // une saisie attend encore son envoi
    if(!force&&Date.now()-this.localAt<2500)return false; // ne pas écraser une saisie en cours
    try{
      const data=await this.fetchAll();
      const remoteClasses=(data&&Array.isArray(data.classes))?data.classes:[];
      if(!remoteClasses.length&&(DB.classes||[]).length){
        // Cloud vide : on y envoie les données locales
        this.snap=this.freeze(this.rows());
        await this.push(true);
        return true;
      }
      if(!remoteClasses.length)return false;
      const before=this.snap?JSON.stringify(this.snap):'';
      this.apply(data);
      const after=this.rows();
      const changed=before!==JSON.stringify(after);
      this.snap=this.freeze(after);
      this.last=new Date().toLocaleTimeString('fr-FR');
      this.online=true;
      this.setMsg('Données reçues du cloud — '+this.last+'.');
      this.saveLocal();
      if(typeof calcCache!=='undefined')calcCache={};
      if(changed){
        this.badge();
        const busy=document.querySelector('#modalRoot .modal')||document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if(busy){this.pendingRender=true}
        else{this.pendingRender=false;this.renderIfPossible()}
      }
      return true;
    }catch(e){
      this.setMsg('Erreur de réception : '+(e.message||e));
      return false;
    }
  },

  apply(d){
    if(!d)return false;
    /* Discipline (saisie locale du surveillant) : conservee pour chaque classe retrouvee. */
    const keepDisc={};
    (DB.classes||[]).forEach(c=>{if(c.disc&&Object.keys(c.disc).length)keepDisc[c.id]=c.disc});
    if(d.school){
      const s=d.school;
      DB.school.name=s.name||DB.school.name;
      DB.school.city=s.city||DB.school.city;
      DB.school.year=s.year||DB.school.year;
      DB.school.principal=s.principal||DB.school.principal;
      if(s.header)DB.school.header=s.header;
      if(s.logo)DB.school.logo=s.logo;
    }
    if(Array.isArray(d.users)&&d.users.length){
      DB.users=d.users.map(u=>({id:u.id,username:String(u.username||'').toLowerCase(),name:u.name||'',phone:u.phone||'',role:['admin','surv','econ'].indexOf(u.role)>=0?u.role:'prof',salt:u.salt||'',hash:u.hash||''}));
      try{if(typeof ME!=='undefined'&&ME&&!DB.users.some(u=>u.id===ME.id)){ME=null;try{sessionStorage.removeItem(SKEY)}catch(e){}}}catch(e){}
    }
    const byId={};
    (d.classes||[]).forEach(c=>{
      byId[c.id]={id:c.id,name:c.name,presetKey:c.preset_key||'',ord:c.ord||0,lang:c.lang||'fr',
        ppId:c.pp_id||'',ppName:c.pp_name||'',ppTel:c.pp_tel||'',
        locks:c.locks||{1:false,2:false,3:false},
        subjects:[],students:[],grades:{},remarks:{},lessons:{}};
    });
    const stuCls={},subCls={};
    (d.students||[]).forEach(s=>stuCls[s.id]=s.class_id);
    (d.subjects||[]).forEach(s=>subCls[s.id]=s.class_id);
    (d.subjects||[]).forEach(s=>{const c=byId[s.class_id];if(c)c.subjects.push({id:s.id,name:s.name,coef:Number(s.coef)||1,group:s.group_name||'',opt:!!s.is_opt,teacherId:s.teacher_id||'',_ord:s.ord||0})});
    /* Un eleve archive localement ne doit pas revenir lors d'une synchronisation. */
    const archIds=new Set((Array.isArray(DB.archivedStudents)?DB.archivedStudents:[]).map(r=>r&&r.data&&r.data.id).filter(Boolean));
    (d.students||[]).forEach(s=>{if(archIds.has(s.id))return;const c=byId[s.class_id];if(c)c.students.push({id:s.id,name:s.name,sex:s.sex||'',mat:s.mat||'',dob:s.dob||'',pob:s.pob||'',parent:s.parent||'',parentLink:s.parent_link||'',parentPhone:s.parent_phone||'',parentEmail:s.parent_email||'',photo:s.photo||'',sessionTag:s.session_tag||'N'})});
    (d.grades||[]).forEach(g=>{
      const c=byId[stuCls[g.student_id]];if(!c)return;
      const arr=(g.seqs||[]).slice(0,5).map(v=>v==null||v===''?null:Number(v));
      while(arr.length<5)arr.push(null);
      (c.grades[g.student_id]||(c.grades[g.student_id]={}))[g.subject_id]=arr;
    });
    (d.remarks||[]).forEach(r=>{
      const c=byId[stuCls[r.student_id]];if(!c)return;
      const o=c.remarks[r.student_id]||(c.remarks[r.student_id]={});
      o['t'+r.trim]=r.text;
    });
    (d.lessons||[]).forEach(l=>{
      const c=byId[l.class_id];if(!c)return;
      c.lessons[l.subject_id]={planned:Number(l.planned)||0,done:Number(l.done)||0,at:l.updated_at?Date.parse(l.updated_at):(l.at?Number(l.at):0)};
    });
    const ordered=(d.classes||[]).map(c=>byId[c.id]).filter(Boolean);
    ordered.forEach(c=>{
      c.subjects.sort((a,b)=>(a._ord||0)-(b._ord||0));
      c.subjects.forEach(s=>{delete s._ord});
    });
    if(ordered.length){
      ordered.forEach(c=>{if((!c.disc||!Object.keys(c.disc).length)&&keepDisc[c.id])c.disc=keepDisc[c.id]});
      DB.classes=ordered;
      try{repairMatricules();upgradeLegacyMatricules()}catch(e){}
    }
    /* Finances : montants et versements recus de la base. */
    if(Array.isArray(d.finance)){
      const fees={},pays={};
      d.finance.forEach(r=>{
        if(!r||!r.id)return;
        if(r.fee!=null&&r.fee!=='')fees[r.id]=Number(r.fee);
        if(Array.isArray(r.pays)&&r.pays.length)pays[r.id]=r.pays;
      });
      DB.finance={fees,pays,updatedAt:new Date().toISOString()};
    }
    /* Eleves archives (corbeille) recus de la base. */
    if(Array.isArray(d.archived)){
      DB.archivedStudents=d.archived.filter(r=>r&&r.id).map(r=>({
        id:r.id,at:r.at||'',by:r.by||'',year:r.year||'',
        classId:r.class_id||'',className:r.class_name||'',
        data:r.data||{},snapshot:r.snapshot||{}
      }));
    }
    /* Sessions cloturees. */
    if(Array.isArray(d.sessions)){
      DB.sessions=d.sessions.filter(s=>s&&s.id&&s.payload).map(s=>{
        const a=Object.assign({},s.payload);
        a.id=s.id;a.year=s.year||a.year||'';a.closedAt=s.closed_at||a.closedAt||'';
        return a;
      });
    }
    return true;
  },

  startPoll(){
    clearInterval(this.pollT);
    this.pollT=setInterval(()=>{if(this.online&&!document.hidden)this.pull(false)},20000);
  },

  startRealtime(){
    if(this.cfg.mode==='http')return;
    if(!this.client||this.ch)return;
    try{
      this.ch=this.client.channel('mbi-sync')
        .on('postgres_changes',{event:'*',schema:'public',table:'lessons'},()=>this.pull(false))
        .on('postgres_changes',{event:'*',schema:'public',table:'grades'},()=>this.pull(false))
        .on('postgres_changes',{event:'*',schema:'public',table:'remarks'},()=>this.pull(false))
        .subscribe();
    }catch(e){this.ch=null}
  },

  stop(){
    clearInterval(this.pollT);this.pollT=null;
    try{if(this.ch&&this.client)this.client.removeChannel(this.ch)}catch(e){}
    this.ch=null;this.client=null;this.online=false;
  },

  async boot(){
    this.load();
    if(!this.enabled()){this.setMsg('Mode local — aucune synchronisation configurée.');return}
    const ok=await this.connect();
    if(ok){await this.pull(true)}
  }
};

/* ---------- Rendu principal ---------- */
function renderCore(){
  const app=$('#app');
  /* Onglet du navigateur : le nom de l'établissement, jamais un nom d'exemple. */
  try{document.title=(DB.school&&DB.school.name)?(DB.school.name+' — Gestion scolaire'):'Gestion scolaire'}catch(e){}
  if(!DB.users.length && typeof Cloud!=='undefined' && Cloud.enabled() && !Cloud.online){
    app.innerHTML='<div class="auth"><div class="auth-box"><h1>Synchronisation en cours…</h1>'+
      '<p>Connexion à la base partagée. Si ce message persiste, vérifiez l’adresse, le jeton et le code d’école dans <b>Paramètres</b>.</p>'+
      '<p class="small muted">'+esc(Cloud.msg||'')+'</p>'+
      '<div class="toolbar" style="justify-content:center"><button class="btn primary" data-act="cloud-retry">Réessayer</button>'+
      '<button class="btn" data-act="cloud-force-setup">Créer un établissement</button></div></div></div>';
    return;
  }
  if(!DB.users.length){app.innerHTML=setupHtml();return}
  if(!ME){app.innerHTML=S.loginView==='forgot'?forgotHtml():loginHtml();return}
  /* Le surveillant general n'accede qu'a la discipline et a son compte */
  if(isSurv()&&S.view!=='discipline'&&S.view!=='account'){S.view='discipline';S.classId=null}
  if(isEcon()&&['fin','fin-class','fin-student','account'].indexOf(S.view)<0){S.view='fin';S.classId=null;S.studentId=null}
  const cls=curClass();
  if(S.view==='class'&&!cls){S.view='dash'}
  app.innerHTML=shellHtml();
}

const AuthShow={
  i:0,t:null,delay:7000,
  /* Cree (une seule fois par affichage) les calques du diaporama dans .auth */
  mount(){
    const host=document.querySelector('.auth');
    if(!host){this.stop();return}
    if(!host.querySelector('.auth-slides')){
      const wrap=document.createElement('div');
      wrap.className='auth-slides';wrap.setAttribute('aria-hidden','true');
      AUTH_SLIDES.forEach((src,k)=>{
        const sl=document.createElement('div');
        sl.className='auth-slide'+(k===this.i?' on':'');
        sl.style.backgroundImage='url("'+src+'")';
        wrap.appendChild(sl);
      });
      host.insertBefore(wrap,host.firstChild);
    }
    this.start();
  },
  show(k){
    const host=document.querySelector('.auth');if(!host)return;
    const slides=host.querySelectorAll('.auth-slide');if(!slides.length)return;
    this.i=((k%slides.length)+slides.length)%slides.length;
    for(let n=0;n<slides.length;n++)slides[n].classList.toggle('on',n===this.i);
  },
  /* Le minuteur s'arrete des que la page de connexion disparait. */
  start(){
    if(this.t)return;
    this.t=setInterval(()=>{
      if(document.hidden)return;
      const host=document.querySelector('.auth');
      if(!host||!host.querySelector('.auth-slide')){this.stop();return}
      this.show(this.i+1);
    },this.delay);
  },
  stop(){if(this.t){clearInterval(this.t);this.t=null}}
};
/* Tous les rendus passent par ici : la page de connexion garde son diaporama. */
function render(){renderCore();AuthShow.mount()}

  '<div class="row"><label class="f">Ville<input name="city" value="" autocomplete="off"></label>'+
    '<label class="f">Année scolaire<input name="year" value="" placeholder="AAAA/AAAA" inputmode="numeric" autocomplete="off" required></label></div>'+
