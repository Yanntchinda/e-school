document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const kind=f.dataset.form;
  try{
  if(isReadOnlySession()){toast('Cette session est archivée et consultable en lecture seule.','err');return;}
  const fd=Object.fromEntries(new FormData(f).entries());
  const err=m=>{const x=f.querySelector('#fe')||f.querySelector('#fe2')||$('#fe',f.closest('.modal')||document);if(x)x.textContent=m};
  if(kind==='setup'){
    const un=fd.username.trim().toLowerCase();if(!/^[a-z0-9._-]{2,}$/.test(un))return err('Identifiant : lettres, chiffres, point ou tiret (2 caractères minimum), sans espace.');
    if(DB.users.some(x=>x.username===un))return err('Cet identifiant est déjà utilisé.');
    if(String(fd.pw).length<4)return err('Le mot de passe doit contenir au moins 4 caractères.');
    if(fd.pw!==fd.pw2)return err('Les deux mots de passe ne sont pas identiques.');
    /* Question secrète : obligatoire, elle permet de récupérer le mot de passe. */
    const secQ=String(fd.secQ==='__other'?(fd.secQother||''):(fd.secQ||'')).trim();
    if(!secQ)return err('Choisissez une question secrète (ou écrivez la vôtre) : elle sert à récupérer votre mot de passe.');
    if(secQ.length<6)return err('La question secrète doit contenir au moins 6 caractères.');
    const secA=normAns(fd.secA);
    if(secA.length<2)return err('Écrivez une réponse secrète (2 caractères minimum) : elle sera demandée en cas d’oubli.');
    const salt=uid();
    DB.school.name=String(fd.school||'').trim()||DB.school.name;
    DB.school.city=String(fd.city||'').trim();
    DB.school.year=String(fd.year||'').trim()||schoolYear();
    const secSalt=uid();
    const u={id:uid(),name:fd.name.trim(),username:un,phone:'',role:'admin',salt,hash:await hashPw(fd.pw,salt),
      secQ:secQ,secSalt:secSalt,secHash:await hashPw(secA,secSalt),secAt:new Date().toISOString()};
    DB.users.push(u);dirty();saveNow();ME=u;try{sessionStorage.setItem(SKEY,u.id)}catch(x){}render();
    toast('Bienvenue ! Votre question secrète est enregistrée : elle permettra de récupérer votre mot de passe.','ok');
  }else if(kind==='forgot-start'){
    /* 1re étape : retrouver le compte administrateur. */
    if(!DB.users.length)return err('Aucun compte n’existe encore : créez d’abord le compte administrateur.');
    const un=String(fd.username||'').trim().toLowerCase();
    const admins=DB.users.filter(x=>x.role==='admin');
    const u=un?DB.users.find(x=>x.username===un):(admins.length===1?admins[0]:null);
    if(!u){
      if(!un&&admins.length>1)return err('Plusieurs comptes administrateur existent : indiquez l’identifiant à récupérer.');
      if(!un&&!admins.length)return err('Aucun compte administrateur sur cet ordinateur.');
      return err('Aucun compte ne porte cet identifiant. Vérifiez l’orthographe.');
    }
    if(u.role!=='admin')return err('Ce compte n’est pas un compte administrateur : seul l’administrateur peut récupérer son mot de passe ici. Demandez-lui la réinitialisation de votre mot de passe (Paramètres → Personnel).');
    S.forgotUid=u.id;S.forgotOk=false;S.forgotTries=0;S.forgotHelp=false;render();
  }else if(kind==='forgot-answer'){
    /* 2e étape : la réponse à la question secrète. */
    const u=S.forgotUid&&DB.users.find(x=>x.id===S.forgotUid);
    if(!u)return err('La vérification a expiré : recommencez la récupération.');
    if(u.role!=='admin')return err('Seul un compte administrateur peut être récupéré ici.');
    if(!u.secQ||!u.secHash)return err('Aucune question secrète n’est définie pour ce compte.');
    if(normAns(fd.secA).length<1)return err('Écrivez votre réponse secrète.');
    const bonne=await hashPw(normAns(fd.secA),u.secSalt);
    if(bonne!==u.secHash){
      S.forgotTries=(Number(S.forgotTries)||0)+1;
      render();
      const rest=5-S.forgotTries;
      const msg=rest>0
        ? 'Réponse incorrecte. Il vous reste '+rest+' tentative'+(rest>1?'s':'')+'. Les accents, majuscules et espaces n’ont pas d’importance.'
        : 'Réponse incorrecte. Les 5 tentatives sont utilisées : le dernier recours est proposé ci-dessous.';
      const box=document.querySelector('form[data-form="forgot-answer"] #fe');
      if(box)box.textContent=msg;else toast(msg,'err');
      return;
    }
    S.forgotOk=true;S.forgotTries=0;render();
    toast('Réponse exacte : choisissez maintenant un nouveau mot de passe.','ok');
  }else if(kind==='forgot'){
    /* Comptes installés sans question secrète : vérification par le nom de l'établissement. */
    const u=S.forgotUid&&DB.users.find(x=>x.id===S.forgotUid);
    if(!u)return err('La vérification a expiré : recommencez la récupération.');
    if(u.role!=='admin')return err('Seul un compte administrateur peut être récupéré ici.');
    if(u.secQ)return err('Ce compte utilise une question secrète : répondez à la question.');
    const said=normTxt(fd.school);
    if(!said)return err('Indiquez le nom de l’établissement.');
    const key=v=>normTxt(v).replace(/[^a-z0-9]+/g,' ').trim();
    const known=[DB.school.name,DB.school.city].filter(v=>String(v||'').trim()).map(key);
    const typed=key(fd.school);
    const okName=!known.length||known.some(k=>k===typed)||known.some(k=>typed.length>=5&&(k.indexOf(typed)>=0||typed.indexOf(k)>=0));
    if(!okName)return err('Ce nom ne correspond pas à celui enregistré (« '+(DB.school.name||DB.school.city||'—')+' »). Recopiez-le tel qu’il est affiché.');
    S.forgotOk=true;render();
    toast('Identité vérifiée : choisissez maintenant un nouveau mot de passe.','ok');
  }else if(kind==='forgot-force'){
    /* Dernier recours : après 5 réponses fausses, sur cet ordinateur. */
    if(!DB.users.length)return err('Aucun compte n’existe encore : créez d’abord le compte administrateur.');
    const admins=DB.users.filter(x=>x.role==='admin');
    if(!admins.length)return err('Aucun compte administrateur sur cet ordinateur.');
    const pick=fd.admin&&admins.find(a=>a.id===fd.admin)||admins[0];
    if(normTxt(fd.confirm).replace(/[^a-z]/g,'')!=='reinitialiser')return err('Recopiez exactement REINITIALISER dans le champ de confirmation.');
    S.forgotUid=pick.id;S.forgotOk=true;S.forgotTries=0;S.forgotHelp=false;render();
    toast('Compte « '+pick.username+' » : choisissez maintenant un nouveau mot de passe.','ok');
  }else if(kind==='import-plan'){
    if(!isAdmin())return err('Seul l’administrateur peut créer des classes par import.');
    if(!IMPPLAN.length)return err('Aucune feuille à importer.');
    let added=0,dup=0,created=0,classes=0,firstId=null;
    IMPPLAN.forEach((plan,i)=>{
      if(!fd['on-'+i])return;
      const r=importApplyPlan(plan,fd['name-'+i],fd['preset-'+i]);
      added+=r.n;dup+=r.dup;if(r.created)created++;classes++;
      if(!firstId)firstId=r.cls.id;
    });
    if(!classes)return err('Cochez au moins une feuille à importer.');
    dirty();saveNow();closeModal();
    if(classes===1&&firstId){S.view='class';S.classId=firstId;S.tab='eleves'}
    IMPPLAN=[];render();
    toast(added+' élève'+(added>1?'s':'')+' importé'+(added>1?'s':'')+(created?' · '+created+' classe'+(created>1?'s':'')+' créée'+(created>1?'s':''):'')+(dup?' · '+dup+' déjà présent'+(dup>1?'s':'')+' ignoré'+(dup>1?'s':''):'')+'.','ok');
  }else if(kind==='wipe'){
    if(!isAdmin())return err('Seul l’administrateur peut effacer les données.');
    if(fd.remote&&Cloud.enabled()&&Cloud.online){
      if(!await Cloud.clearRemote())return err('Base partagée non vidée : vérifiez la connexion, puis réessayez. Rien n’a été effacé sur cet ordinateur.');
      Cloud.cfg.lastPush='';
    }
    /* On garde l'identité de l'établissement : seul le contenu est effacé. */
    const school=JSON.parse(JSON.stringify(DB.school||{}));
    try{localStorage.removeItem(KEY);sessionStorage.removeItem(SKEY)}catch(e){}
    DB=blankDB();
    if(school&&school.name)DB.school=Object.assign(DB.school,school);
    ME=null;S.sessionId=null;S.closeState=null;S.simulationState=null;S.asAdmin=null;S.forgotUid=null;S.forgotOk=false;calcCache={};S.view='dash';
    closeModal();render();
    toast('Données effacées : créez maintenant votre compte administrateur.','ok');
  }else if(kind==='secrecy'){
    /* Définir ou changer la question secrète (administrateur connecté). */
    if(!isAdmin())return err('Réservé à l’administrateur.');
    if(!verifyPw(fd.old,ME.salt,ME.hash))return err('Le mot de passe actuel est incorrect.');
    const q=String(fd.secQ==='__other'?(fd.secQother||''):(fd.secQ||'')).trim();
    if(!q)return err('Choisissez une question secrète (ou écrivez la vôtre).');
    if(q.length<6)return err('La question secrète doit contenir au moins 6 caractères.');
    const a=normAns(fd.secA);
    if(a.length<2)return err('Écrivez une réponse secrète (2 caractères minimum).');
    ME.secQ=q;ME.secSalt=uid();ME.secHash=await hashPw(a,ME.secSalt);ME.secAt=new Date().toISOString();
    try{DB.recoveryLog=Array.isArray(DB.recoveryLog)?DB.recoveryLog:[];DB.recoveryLog.push({at:new Date().toISOString(),user:ME.username,type:'question-secrete-definie'});}catch(e){}
    dirty();saveNow();render();
    toast('Question secrète enregistrée : elle servira si vous oubliez votre mot de passe.','ok');
  }else if(kind==='forgot-reset'){
    /* 3e étape : nouveau mot de passe, après vérification. */
    const u=S.forgotUid&&DB.users.find(x=>x.id===S.forgotUid);
    if(!u)return err('La vérification a expiré : recommencez la récupération.');
    if(!S.forgotOk)return err('Répondez d’abord à la question secrète.');
    if(u.role!=='admin')return err('Seul un compte administrateur peut être récupéré ici.');
    if(String(fd.pw||'').length<4)return err('Le mot de passe doit contenir au moins 4 caractères.');
    if(fd.pw!==fd.pw2)return err('Les deux mots de passe ne sont pas identiques. Corrigez le second champ.');
    u.salt=uid();u.hash=await hashPw(fd.pw,u.salt);
    try{DB.recoveryLog=Array.isArray(DB.recoveryLog)?DB.recoveryLog:[];DB.recoveryLog.push({at:new Date().toISOString(),user:u.username,type:'mdp-admin-reinitialise'});}catch(e){}
    S.forgotUid=null;S.forgotOk=false;S.forgotTries=0;S.forgotHelp=false;S.loginView=null;S.forgotLegacy=false;S.loginUser=u.username;S.loginRole='staff';
    dirty();saveNow();render();
    toast('Nouveau mot de passe enregistré. Identifiant de connexion : « '+u.username+' ».','ok');
  }else if(kind==='login'||kind==='login-surv'||kind==='login-econ'||kind==='login-prof'){
    const u=DB.users.find(x=>x.username===fd.username.trim().toLowerCase());
    if(!u||!verifyPw(fd.pw,u.salt,u.hash))return err('Identifiant ou mot de passe incorrect.');
    /* Un seul formulaire pour tous les espaces : le compte ouvre toujours son
       propre tableau de bord, quel que soit l'onglet choisi. Les onglets ne
       sont qu'une aide visuelle, ils ne bloquent jamais la connexion. */
    ME=u;S.loginUser='';try{sessionStorage.setItem(SKEY,u.id)}catch(x){}S.asAdmin=null;S.sessionId=null;S.closeState=null;S.simulationState=null;
    S.view=(u.role==='surv')?'discipline':(u.role==='econ'?'fin':'dash');S.classId=null;S.studentId=null;render();
    const asked=kind==='login-surv'?'surveillance':(kind==='login-econ'?'économe':(kind==='login-prof'?'enseignant':'administration'));
    const own=u.role==='surv'?'surveillance':(u.role==='econ'?'économe':(u.role==='admin'?'administration':'enseignant'));
    if(asked!==own)toast('Compte '+own+' : ouverture de l’espace correspondant.','ok');
  }else if(kind==='pw'){
    if(!isAdmin())return err('Seul l’administrateur peut changer son mot de passe. Contactez-le pour toute modification.');

    if(!verifyPw(fd.old,ME.salt,ME.hash))return err('Le mot de passe actuel est incorrect.');
    ME.salt=uid();ME.hash=await hashPw(fd.new,ME.salt);dirty();render();toast('Mot de passe modifié.','ok');
  }else if(kind==='fee'){
    if(!canFinance())return err('Seuls l’économe et l’administrateur peuvent modifier les montants.');
    const sid=f.dataset.id;if(!financeStudent(sid))return err('Élève introuvable.');
    const raw=String(fd.amount==null?'':fd.amount).replace(/[^0-9.,]/g,'').replace(',','.');
    if(raw===''||!Number.isFinite(Number(raw))||Number(raw)<0)return err('Saisissez un montant en FCFA (0 pour un élève exonéré).');
    setFee(sid,raw);dirty();saveNow();closeModal();render();
    toast('Montant à payer enregistré : '+money(feeOf(sid))+'.','ok');
  }else if(kind==='pay'){
    if(!canFinance())return err('Seuls l’économe et l’administrateur peuvent enregistrer les versements.');
    const sid=f.dataset.id;if(!financeStudent(sid))return err('Élève introuvable.');
    const raw=String(fd.amount==null?'':fd.amount).replace(/[^0-9.,]/g,'').replace(',','.'),amt=Number(raw);
    if(!Number.isFinite(amt)||amt<=0)return err('Saisissez un montant supérieur à zéro.');
    if(!fd.date)return err('Indiquez la date du versement.');
    const p=addPayment(sid,{date:fd.date,amount:amt,mode:fd.mode,ref:fd.ref,note:fd.note});
    dirty();saveNow();closeModal();render();
    toast('Versement de '+money(p.amount)+' enregistré · reçu N° '+String(p.no).padStart(4,'0'),'ok');
  }else if(kind==='teacher'){
    const un=fd.username.trim().toLowerCase();if(!/^[a-z0-9._-]{2,}$/.test(un))return err('Identifiant : lettres, chiffres, point ou tiret, sans espace.');
    const id=f.dataset.id;if(DB.users.some(u=>u.username===un&&u.id!==id))return err('Cet identifiant est déjà utilisé.');
    let u=id&&DB.users.find(x=>x.id===id);
    if(!u){u={id:uid(),role:'prof'};DB.users.push(u)}
    u.role=(fd.role==='surv')?'surv':(fd.role==='econ'?'econ':'prof');
    u.name=fd.name.trim();u.username=un;u.phone=fd.phone.trim();
    if(fd.pw){u.salt=uid();u.hash=await hashPw(fd.pw,u.salt)}
    dirty();closeModal();render();
    if(fd.pw)toast('Enregistré. Identifiant : '+un+' · mot de passe : '+fd.pw,'ok');
  }else if(kind==='newclass'){
    const c=newClass(fd.preset,fd.name.trim());DB.classes.push(c);dirty();closeModal();S.view='class';S.classId=c.id;S.tab='eleves';render();
    if(fd.importList){toast('Classe créée — importez maintenant la liste des élèves.','ok');A['import-students']();}
  }else if(kind==='student'){
    const cls=curClass(),name=fd.name.trim().replace(/\s+/g,' ').toLocaleUpperCase('fr'),id=f.dataset.id;
    if(cls.students.some(s=>s.name===name&&s.id!==id))return err('Un élève porte déjà ce nom dans cette classe.');
    const existant=id?cls.students.find(x=>x.id===id):null;
    const mat=(fd.mat.trim()||(existant&&existant.mat)||genMat()).toUpperCase();
    const detenteur=matTaken(mat,id);
    if(detenteur)return err('Matricule déjà attribué à '+detenteur.st.name+' ('+(detenteur.current?detenteur.cls.name:'archive '+detenteur.year)+'). Chaque élève doit avoir un matricule unique.');
    if(existant&&existant.mat&&matKey(mat)!==matKey(existant.mat))toast('Matricule de '+existant.name+' modifié : '+existant.mat+' → '+mat+'.','ok');
    /* Contact du parent / tuteur : facultatif, mais verifie quand il est renseigne. */
    const parent=(fd.parent||'').replace(/\s+/g,' ').trim().toLocaleUpperCase('fr');
    const parentLink=(fd.parentLink||'').trim();
    const parentPhone=(fd.parentPhone||'').replace(/\s+/g,' ').trim();
    const parentEmail=(fd.parentEmail||'').trim();
    const serie=['A','C','D'].includes(String(fd.serie||'').toUpperCase())?String(fd.serie).toUpperCase():'';
    if(parentPhone&&parentPhone.replace(/\D/g,'').length<6)return err('Numéro de téléphone du parent invalide : indiquez au moins 6 chiffres.');
    if(parentEmail&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(parentEmail))return err('Adresse e-mail du parent invalide (exemple : parent@exemple.cm).');
    if(parentLink&&!PARENT_LINKS.includes(parentLink))return err('Lien de parenté inconnu.');
    const photoInput=f.querySelector('input[data-file="photo"]');let photo='';
    if(photoInput&&photoInput.files&&photoInput.files[0]){try{photo=await compactStudentPhoto(photoInput.files[0])}catch(ex){return err(ex.message||'Photo illisible.')}}
    if(id){const s=cls.students.find(x=>x.id===id);s.name=name;s.sex=fd.sex;s.serie=serie;s.mat=mat;s.dob=fd.dob||'';s.pob=(fd.pob||'').trim();
      s.parent=parent;s.parentLink=parentLink;s.parentPhone=parentPhone;s.parentEmail=parentEmail;
      if(photo)s.photo=photo}else cls.students.push({id:uid(),name,sex:fd.sex,serie:serie,mat:mat,dob:fd.dob||'',pob:(fd.pob||'').trim(),parent:parent,parentLink:parentLink,parentPhone:parentPhone,parentEmail:parentEmail,photo:photo||'',sessionTag:'N'});
    cls.students.sort(cmpName);dirty();closeModal();render();
  }else if(kind==='group'){
    const cls=curClass(),g=fd.g.trim().toLocaleUpperCase('fr');if(!g)return;
    const last=cls.subjects[cls.subjects.length-1];cls.subjects.push({id:uid(),name:'NOUVELLE MATIÈRE',coef:1,group:g,opt:false,teacherId:''});dirty();closeModal();render();
  }
  }catch(ex){
    /* Un formulaire ne doit jamais laisser la fenêtre bloquée : on explique,
       on garde la saisie et on rend la main. */
    reportErr('formulaire '+kind,(ex&&ex.message)||String(ex));
    try{
      const x=f.querySelector('#fe')||$('#fe',f.closest('.modal')||document);
      if(x)x.textContent='Enregistrement impossible : '+((ex&&ex.message)||'action inattendue')+' — vérifiez la saisie, puis réessayez.';
    }catch(e2){}
  }
});
A['noop']=()=>{};
/* Afficher/masquer le mot de passe saisi (page de connexion et installation). */
A['toggle-pw']=el=>{
  const f=el.closest('form');if(!f)return;
  const sel='input[type="password"],input[name="pw"],input[name="pw2"],input[name="old"],input[name="new"]';
  const list=[...f.querySelectorAll(sel)].filter(i=>i.type!=='hidden');
  if(!list.length)return;
  const show=list[0].type==='password';
  list.forEach(i=>{i.type=show?'text':'password'});
  el.textContent=(show?'Masquer':'Afficher')+(list.length>1?' les mots de passe':' le mot de passe');
  list[0].focus();
};
/* Vider les champs d'un formulaire sans recharger la page. */
A['form-reset']=el=>{
  const f=el.closest('form');if(!f)return;
  f.reset();
  f.querySelectorAll('input[name="pw"],input[name="pw2"],input[name="old"],input[name="new"]').forEach(i=>{i.type=i.dataset.visible?'text':'password'});
  const fe=$('#fe',f.closest('.modal')||document);if(fe)fe.textContent='';
  const other=f.querySelector('[data-secq-other]');if(other){other.style.display='none';const i=other.querySelector('input');if(i)i.value=''}
  const first=f.querySelector('input:not([type=hidden])');if(first)first.focus();
};
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(!el||el.id!=='sband-input')return;
  if(e.key==='Escape'){el.value='';sbandUpdate('');el.blur();return}
  if(e.key==='Enter'){
    const first=document.querySelector('#sband-results .sband-row');
    if(first){e.preventDefault();first.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
  }
});
document.addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('.sband-field'))return;
  const box=document.querySelector('#sband-results');
  if(box&&box.classList.contains('on')){box.className='sband-res';box.innerHTML=''}
});
document.addEventListener('change',e=>{
  if(e.target.matches&&e.target.matches('[data-secq]')){
    const box=e.target.closest('form');const other=box&&box.querySelector('[data-secq-other]');
    if(other)other.style.display=(e.target.value==='__other')?'':'none';
    if(other&&e.target.value==='__other'){const inp=other.querySelector('input');if(inp)inp.focus()}
    return;
  }
  if(e.target.id==='q-class'){SEARCH.cls=e.target.value;renderSearchResults();return}
  if(e.target.id==='q-scope'){SEARCH.scope=e.target.value;renderSearchResults();return}
  if(e.target.dataset&&e.target.dataset.discsel){S.view='discipline';S.classId=e.target.value;render();return}
  if(e.target.name==='preset'){const p=PRESETS.find(x=>x.key===e.target.value),n=$('#ncname');if(n&&p)n.value=p.key==='X'?'':p.label}});

function handleFile(el){
  const file=el.files&&el.files[0];if(!file)return;const kind=el.dataset.file;
  const bad=m=>{const x=$('#fe');if(x)x.textContent=m;else toast(m,'err')};
  /* Liste d'élèves : lecture binaire (détection d'un .xlsx) puis CSV / Excel XML. */
  if(kind==='imp'){importFile(file);try{el.value=''}catch(e){}return}
  if(kind==='header'){
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const w=Math.min(1400,img.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(img.height*w/img.width);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);DB.school.header=c.toDataURL('image/jpeg',.88);URL.revokeObjectURL(url);dirty();render();toast('En-tête remplacé.','ok')};
    img.onerror=()=>toast('Image illisible.','err');img.src=url;return;
  }
  if(kind==='logo'){
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const w=Math.min(600,img.width),h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);DB.school.logo=c.toDataURL('image/jpeg',.9);URL.revokeObjectURL(url);dirty();render();toast('Logo remplacé.','ok')};
    img.onerror=()=>toast('Image illisible.','err');img.src=url;return;
  }
  const rd=new FileReader();
  rd.onerror=()=>bad('Lecture du fichier impossible.');
  rd.onload=()=>{
    const txt=String(rd.result);
    let d;try{d=JSON.parse(txt)}catch(e){return bad('Ce fichier n’est pas un fichier JSON valide.')}
    if(kind==='restore'){
      /* Anciennes sauvegardes : le fichier EST la base. Nouvelles : enveloppe
         {app:'e-school',data:…}. Les deux formats restent acceptés. */
      if(d&&d.app==='e-school'&&d.data&&d.data.school)d=d.data;
      if(!d||!d.school||!Array.isArray(d.users)||!Array.isArray(d.classes)||!d.users.some(u=>u.role==='admin'))return bad('Ce fichier n’est pas une sauvegarde complète de cette application.');
      const rc0=backupCounts(d);
      askConfirm('Restaurer cette sauvegarde ?','Elle contient '+rc0.students+' élève'+(rc0.students>1?'s':'')+', '+rc0.classes+' classe'+(rc0.classes>1?'s':'')+' et '+rc0.sessions+' session'+(rc0.sessions>1?'s':'')+' précédente'+(rc0.sessions>1?'s':'')+'. Les données actuelles seront remplacées.','Restaurer',()=>{
      stripLegacyFlags(d);DB=d;if(!Array.isArray(DB.archivedStudents))DB.archivedStudents=[];if(!Array.isArray(DB.sessions))DB.sessions=[];if(!DB.finance||typeof DB.finance!=='object')DB.finance={fees:{},pays:{},updatedAt:''};else{if(!DB.finance.fees||typeof DB.finance.fees!=='object')DB.finance.fees={};if(!DB.finance.pays||typeof DB.finance.pays!=='object')DB.finance.pays={}};calcCache={};S.sessionId=null;S.closeState=null;S.simulationState=null;try{repairMatricules();upgradeLegacyMatricules()}catch(e){}saveNow();closeModal();ME=null;try{sessionStorage.removeItem(SKEY)}catch(e){}render();
      const rc=backupCounts(DB);
      toast('Sauvegarde restaurée : '+rc.students+' élève'+(rc.students>1?'s':'')+', '+rc.classes+' classe'+(rc.classes>1?'s':'')+', '+rc.sessions+' session'+(rc.sessions>1?'s':'')+' précédente'+(rc.sessions>1?'s':'')+'. Connectez-vous.','ok');
      },true);
    }else if(kind==='merge'){
      if(!d||d.type!=='mbi-notes'||!Array.isArray(d.classes))return bad('Ce fichier n’est pas un fichier de notes exporté par un enseignant.');
      let n=0,skipped=0;
      for(const fc of d.classes){const c=DB.classes.find(x=>x.id===fc.id);if(!c){skipped++;continue}
        for(const sid in fc.grades){if(!c.students.some(s=>s.id===sid))continue;
          for(const sub in fc.grades[sid]){if(!c.subjects.some(s=>s.id===sub))continue;
            fc.grades[sid][sub].forEach((v,i)=>{if(v!=null&&i<5&&typeof v==='number'&&v>=0&&v<=20){setG(c,sid,sub,i,v);n++}})}}}
      dirty();closeModal();render();toast(n+' note'+(n>1?'s importées':' importée')+(skipped?' · '+skipped+' classe(s) du fichier introuvable(s)':'')+'.',n?'ok':'');
    }
  };
  rd.readAsText(file,'utf-8');
}

/* ---------- Démarrage ---------- */
ME=sessionUser();

/* ---------- Démarrage ---------- */
/* ====================================================================
   Démarrage
   Aucun compte ni donnée de démonstration n'est créé. Sur une installation
   neuve, l'application ouvre la création du compte administrateur ; sur une
   installation existante, la page de connexion, puis le tableau de bord.
   ==================================================================== */
function bootApp(){
  /* Drapeau de démonstration hérité d'une ancienne version : effacé de la base
     pour qu'il ne revienne pas au prochain démarrage. */
  stripLegacyFlags(DB);
  if(legacyDemoCleared){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
  /* Aucun doublon de matricule ne doit subsister dans l'année en cours */
  try{
    let touched=repairMatricules();
    touched+=upgradeLegacyMatricules();
    if(touched>0){
      try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
      toast(touched+' matricule(s) mis à niveau : format long et unique.','ok');
    }
  }catch(e){ console.error(e); }
  render();
}

try{ if(typeof Cloud!=='undefined'){ Cloud.load(); Cloud.badge(); } }catch(e){}
bootApp();
try{ if(typeof Cloud!=='undefined'){ setTimeout(()=>Cloud.boot(),1200); } }catch(e){}
