<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ming's Bilingual Institute</title>
<style>
:root{
  --ink:#12263f; --ink-2:#34495e; --muted:#6b7a8c; --line:#d9e0e8; --line-2:#eaeef3;
  --bg:#f1f4f8; --surface:#fff; --brand:#1b3f8f; --brand-d:#122c66; --green:#4fa824; --green-d:#3c8a18;
  --red:#c0262d; --amber:#b7791f; --amber-bg:#fdf3dc; --ok-bg:#e6f4dc; --bad-bg:#fbe4e4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
a{color:var(--brand)}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px;border-radius:4px}
#printRoot{display:none}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{background:#f4f7fb;border-color:#b9c5d3}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:var(--green-d)}
.btn.danger{color:var(--red);border-color:#e7b9bb}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#e8edf4}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* forms */
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:12px}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid #c3ceda;border-radius:7px;background:#fff;font-weight:400;font-size:15px}
.inp.sm{padding:5px 8px;font-size:14px;margin:0}
label.f textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px}

.auth::before{content:'';position:absolute;inset:-10%;pointer-events:none;
  background:radial-gradient(900px 520px at 12% 8%,rgba(56,189,248,.20),transparent 62%),
             radial-gradient(760px 460px at 92% 92%,rgba(34,197,94,.16),transparent 62%),
             radial-gradient(680px 420px at 78% 6%,rgba(99,102,241,.18),transparent 60%)}
.auth::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(4,12,26,.55),transparent 45%)}
.auth-box{position:relative;z-index:2;width:min(462px,100%);
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.30);border-radius:18px;
  padding:28px 30px 24px;color:#fff;
  box-shadow:0 34px 80px rgba(2,10,24,.55),0 2px 0 rgba(255,255,255,.10) inset,0 0 0 1px rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
.auth-box h1{color:#fff;font-size:26px;letter-spacing:-.02em;margin-bottom:4px}
.auth-box p{color:rgba(255,255,255,.80);margin:0 0 18px}
.auth-box img{width:100%;height:auto;display:block;margin:0 0 18px;background:#fff;padding:10px 12px;border-radius:11px;
  box-shadow:0 10px 26px rgba(2,10,24,.28)}
.auth-box label.f{color:rgba(255,255,255,.92);font-weight:600}
.auth-box label.f input,.auth-box label.f select,.auth-box .inp{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);color:#fff;border-radius:9px;padding:10px 12px}
.auth-box label.f input::placeholder{color:rgba(255,255,255,.55)}
.auth-box label.f input:focus,.auth-box .inp:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.70);outline:none}
.auth-box .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.36);color:#fff}
.auth-box .btn:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.55)}
.auth-box .btn.primary{background:linear-gradient(180deg,#2a63d4,#1b3f8f);border-color:rgba(255,255,255,.30);color:#fff;
  box-shadow:0 10px 24px rgba(27,63,143,.45)}
.auth-box .btn.primary:hover{background:linear-gradient(180deg,#316fe8,#1f47a0)}
.auth-box .notice{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.92)}
.auth-box .notice.info{background:rgba(96,165,250,.18);border-color:rgba(147,197,253,.42);color:#eaf2ff}
.auth-box .notice code{background:rgba(255,255,255,.20);color:#fff;padding:1px 6px;border-radius:5px}
.auth-box .err{color:#ffb4b4;font-weight:600}
.auth-box .muted{color:rgba(255,255,255,.68)}
.auth-box a{color:#9cc4ff;text-decoration:underline}
@media (max-width:560px){.auth{padding:18px 14px;background-attachment:scroll}
  .auth-box{padding:22px 20px 20px;border-radius:15px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}}
.auth-kicker{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#cfe0ff;background:rgba(120,170,255,.16);border:1px solid rgba(160,200,255,.32);
  padding:4px 10px;border-radius:99px;margin-bottom:12px}
.auth-kicker::before{content:'';width:6px;height:6px;border-radius:50%;background:#54e08a;box-shadow:0 0 0 3px rgba(84,224,138,.22)}
.auth-box .auth-sep{height:1px;background:rgba(255,255,255,.16);margin:16px 0 14px}
.auth-box .auth-links{margin:16px 0 0;text-align:center;font-size:12.5px}
.auth-foot{position:relative;z-index:2;margin-top:18px;text-align:center;font-size:11.5px;letter-spacing:.03em;
  color:rgba(255,255,255,.55)}
.auth-foot b{color:rgba(255,255,255,.78);font-weight:600}

/* shell */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--ink);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px;font-weight:600;min-width:0}
.brand .dot{width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-weight:700;font-family:var(--sans);font-size:15px;color:#fff;flex:none}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tri{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;margin-left:auto}
.tri button{border:0;background:transparent;color:#cfd9e6;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.tri button.on{background:#fff;color:var(--ink)}
.me{display:flex;align-items:center;gap:10px;font-size:13px}
.me .role{display:inline-block;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:99px;font-size:12px}
.me .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.me .btn:hover{background:rgba(255,255,255,.1)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 52px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.side h4{margin:16px 10px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.side a.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer}
.side a.nav:hover{background:#eef2f7}
.side a.nav.on{background:var(--brand);color:#fff}
.side a.nav small{font-weight:500;opacity:.7}
main{padding:24px 28px 60px;min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:28px}
.page-h p{margin:2px 0 0;color:var(--muted)}
.session-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.panel>h3{font-size:18px;margin-bottom:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs a{padding:9px 16px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--brand);border-bottom-color:var(--green)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.notice{padding:10px 14px;border-radius:8px;background:var(--amber-bg);color:#7a4f10;font-size:14px;margin-bottom:14px;border:1px solid #f0dca8}
.notice.info{background:#e8f0fc;color:#1d3d78;border-color:#c8d8f3}

/* tables */
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);background:#fafbfd;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:hover td{background:#f8fafc}
table.t .num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
.tw table.t th:first-child,.tw table.t td:first-child{padding-left:14px}
.avg{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.low{color:var(--red)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2f7;color:var(--ink-2)}
.badge.ok{background:var(--ok-bg);color:#2f6b12}
.badge.bad{background:var(--bad-bg);color:#9c1c22}
.badge.warn{background:var(--amber-bg);color:#7a4f10}
.student-tag{display:inline-block;min-width:30px;text-align:center;margin-right:6px;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:700;vertical-align:middle;background:#e8f0fc;color:#1d3d78}
.student-tag.na{background:var(--ok-bg);color:#2f6b12}
.student-tag.ancien{background:var(--amber-bg);color:#7a4f10}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.b>i{background:var(--brand)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:18px;overflow:hidden}
.kpi{padding:14px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}

/* grid (saisie des notes) */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:calc(100vh - 250px)}
table.grid{border-collapse:separate;border-spacing:0;font-size:14px}
table.grid th,table.grid td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0;text-align:center;background:#fff}
table.grid thead th{position:sticky;top:0;z-index:3;background:#f4f7fb;font-weight:600;padding:6px 6px;font-size:12.5px;border-bottom:2px solid var(--line)}
table.grid thead tr:first-child th{height:54px;box-sizing:border-box}
table.grid thead tr:nth-child(2) th{top:54px;z-index:3;font-weight:500;color:var(--muted);padding:3px}
table.grid th.sub{min-width:116px;border-left:2px solid var(--line)}
table.grid th.sub small{display:block;font-weight:500;color:var(--muted)}
table.grid th.sub.lock{background:#eceff3;color:#8794a3}
.stk0,.stk1{position:sticky;z-index:2;background:#fff!important}
.stk0{left:0;min-width:40px;width:40px}
.stk1{left:40px;min-width:230px;text-align:left!important;padding:0 10px!important;font-weight:600;white-space:nowrap;border-right:2px solid var(--line)!important}
thead .stk0,thead .stk1{z-index:5;background:#f4f7fb!important}
td.s-sep{border-left:2px solid var(--line)}
input.cell{width:58px;border:0;text-align:center;padding:8px 2px;background:transparent;font-variant-numeric:tabular-nums}
input.cell:focus{background:#e9f1ff;outline:2px solid #5b8def;outline-offset:-2px}
input.cell.bad{background:var(--bad-bg)}
td.lk{background:#f6f7f9!important;color:#6b7a8c;width:58px;font-variant-numeric:tabular-nums}
td.sumc{font-weight:700;min-width:64px;padding:0 8px;background:#fcfcf6}
.empty-row td{background:#fffdf0}

/* modal + toast */
.backdrop{position:fixed;inset:0;background:rgba(18,38,63,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:min(520px,100%);padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(900px,100%)}
.modal.xl{width:min(860px,100%);background:#e6eaf0;padding:16px 18px}
.modal h2{font-size:21px;margin-bottom:12px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toastRoot{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px;font-size:14px}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green-d)}

/* stats */
.hist{display:grid;gap:7px}
.hist .hr{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.hist .hb{height:20px;background:var(--line-2);border-radius:4px;overflow:hidden}
.hist .hb i{display:block;height:100%;background:var(--brand)}
.hist .hb i.lo{background:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chk{display:flex;gap:7px;align-items:center;font-weight:500;font-size:14px;cursor:pointer}

/* ===== bulletin (écran + impression) ===== */
.bulletin{width:190mm;margin:0 auto 14px;background:#fff;color:#000;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:10.5pt;padding:0;line-height:1.25}
.xl .bulletin{padding:6mm 7mm;width:100%;max-width:210mm;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.bulletin .b-head{display:block;width:100%;height:auto}
.bulletin .b-title{font-family:inherit;text-align:center;font-size:17.5pt;font-weight:400;letter-spacing:.2px;margin:2.4mm 0 1.2mm;white-space:nowrap}
.bulletin .b-title .b-sub{display:inline;font-size:17.5pt;font-style:normal;font-weight:400;letter-spacing:.2px;margin:0;white-space:nowrap}
.bulletin .b-year{font-style:italic;font-size:12pt;display:flex;justify-content:space-between;align-items:baseline;margin:0 0 .5mm;line-height:1.12;text-align:left}
.bulletin .b-year .tr{font-style:normal;font-weight:700;font-size:12.5pt;margin-left:auto;white-space:nowrap;flex:none}
.bulletin .b-year .tr.nw{white-space:nowrap;flex:none}
.bulletin .b-profile{display:flex;align-items:center;gap:4mm;margin:.4mm 0 .9mm;break-inside:avoid;page-break-inside:avoid}
.bulletin .b-profile-info{flex:1;min-width:0;text-align:left}
.bulletin .b-profile .b-line{display:flex;gap:3mm;align-items:baseline;margin:.25mm 0;line-height:1.2;text-align:left}
.bulletin .b-line .lbl{width:31mm;text-align:left;flex:none}
.bulletin .b-photo{display:block;flex:none;width:28mm;height:35mm;object-fit:cover;border:1px solid #000;box-sizing:border-box}
.bulletin .b-photo-empty{display:flex;align-items:center;justify-content:center;color:#777;font-size:8pt;background:#f7f7f7}

.bulletin .b-line .val{font-weight:700}

.bulletin .b-line .val.big{font-size:12.5pt}
.bulletin .b-line .cel{width:auto;margin-left:auto}
.bulletin .b-line .cel.nw{white-space:nowrap;flex:none}
.bulletin .b-line{flex-wrap:nowrap;min-width:0}
.bulletin .b-line .val{min-width:0}
.bulletin table.b-table{width:100%;border-collapse:collapse;margin-top:1.6mm;table-layout:fixed}
.bulletin .b-table th,.bulletin .b-table td{border:1px solid #000;padding:1.1mm 1.4mm;font-size:10pt;text-align:center;overflow:hidden}
.bulletin .b-table th{font-weight:700;font-size:10pt}
.bulletin .b-table td.mt{text-align:left;white-space:normal}
.bulletin .b-table td.mt .sub-teacher{font-size:8.5pt;font-weight:400;white-space:normal}
.bulletin .b-table td.m{color:#c00000;font-weight:700}
.bulletin .b-table th:last-child,.bulletin .b-table td.ob{text-align:left;padding-left:2mm}
.bulletin .b-table td.ob{font-weight:700}
.bulletin .b-table tr.grp td{font-weight:700;background:#eeeeee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulletin .b-table tr.grp td.mt{text-align:center}
.bulletin .b-table tr.tot td{font-weight:700}
.bulletin .b-legend{font-size:8.5pt;margin-top:1.2mm}
.bulletin .b-bottom{margin-top:2.2mm;break-inside:avoid;page-break-inside:avoid}
.bulletin table.b-bottom-t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9.4pt}
.bulletin .b-bottom-t td,.bulletin .b-bottom-t th{border:.38mm solid #000;padding:.5mm .85mm;vertical-align:top;line-height:1.1}
.bulletin .b-bottom-t th{text-align:center;font-weight:700;text-transform:uppercase;font-size:8.6pt;background:#fafafa;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulletin .b-bottom-t .lbl{font-size:8.8pt;line-height:1.1}
.bulletin .b-bottom-t .lbl b{display:block;font-size:7.8pt;text-transform:uppercase;line-height:1.05}
.bulletin .b-bottom-t .lbl i{font-style:normal;font-size:7.8pt;display:block;color:#333}
.bulletin .b-bottom-t .center{text-align:center}
/* zone d'ecriture : un seul bloc continu entre Appreciation et Chef d'Etablissement */
.bulletin .b-bottom-t td.join-r{border-right:0}
.bulletin .b-bottom-t td.join-l{border-left:0}
/* mentions : libelle et case a cocher centres dans la cellule */
.bulletin .b-bottom-t td.mtn-cell{text-align:center;vertical-align:middle}
.bulletin .b-bottom-t .mtn{display:inline-block;text-align:center;line-height:1.15}
.bulletin .b-bottom-t .mtn .chk{vertical-align:-.3mm}
.bulletin .b-bottom-t .val{display:block;width:100%;font-weight:700;font-size:10.6pt;text-align:center;min-height:4.4mm;padding:.15mm 0;color:#1a2fb5;line-height:1.12}
.bulletin .b-bottom-t .row-h{height:9.6mm}
.bulletin .b-bottom-t .appr>td{height:25mm;vertical-align:top}
.bulletin .b-bottom-t .sign-zone{height:15mm}
.bulletin .b-bottom-t .nom-lbl{font-size:8.2pt;text-align:center;line-height:1.1;color:#444}
.bulletin .b-bottom-t .nom-val{font-size:10pt;font-weight:700;text-align:center;min-height:4.2mm;padding-top:.3mm}
.bulletin .b-bottom-t .chk{display:inline-block;width:2.9mm;height:2.9mm;border:.35mm solid #000;vertical-align:-.5mm;margin-left:1.2mm;box-sizing:border-box;position:relative}
.bulletin .b-bottom-t .chk.on::after{content:"";position:absolute;left:.35mm;top:-.35mm;width:1.55mm;height:.85mm;
  border-left:.45mm solid #000;border-bottom:.45mm solid #000;transform:rotate(-45deg);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulletin .b-bottom-t .appr-lines{font-size:10.6pt;line-height:5.6mm;white-space:pre-wrap;word-break:break-word;min-height:5.6mm;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 5.25mm,#bbb 5.25mm,#bbb 5.4mm);background-size:100% 5.6mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulletin .b-bottom-t .appr-title{font-size:8.6pt;font-weight:400;line-height:1.1}
.bulletin .b-bottom-t td.mavg{vertical-align:middle;font-size:10.4pt}
.bulletin .b-bottom-t td.mavg b{font-size:9.6pt}
.bulletin .b-bottom-t td.mavg .val{font-size:13.2pt;min-height:5.4mm}
.bulletin .b-bottom-t td.mavg .rk-mavg{margin-top:.6mm;font-size:8.2pt}
.bulletin .b-bottom-t td.mavg .rk-mavg b{font-size:10.6pt}
.bulletin .b-bottom-t td.dcc{vertical-align:middle;line-height:1.25}
/* 3e trimestre : moyenne de chaque trimestre, moyenne annuelle, rangs */
.bulletin .b-bottom-t tr.row-ann td{vertical-align:middle}
.bulletin .b-bottom-t tr.row-ann .val{font-size:10.8pt;min-height:4.2mm}
.bulletin .b-bottom-t tr.row-ann .lbl b{font-size:8.4pt}
.bulletin .b-bottom-t tr.row-ann .lbl i{font-size:7pt}
.bulletin .b-bottom-t tr.row-ann .ann-cell{background:#f4f7ff}
.bulletin .b-bottom-t tr.row-ann .ann-cell .val{font-size:13pt;color:#1a2fb5}
/* decisions du conseil : une case par element, espace libre dessous pour ecrire */
.bulletin .b-bottom-t tr.row-t3{height:7mm}
.bulletin .b-bottom-t td.dec{vertical-align:top;padding:.8mm .85mm 3mm}
.bulletin .b-bottom-t td.dec b{font-size:8.8pt;line-height:1.1;display:block}
.bulletin .b-bottom-t td.dec i{font-size:7.2pt;font-style:normal;color:#333;display:block;line-height:1.05}
/* rang de chaque trimestre, sous la moyenne */
.bulletin .b-bottom-t .rk-in{margin-top:.3mm;font-size:7.6pt;line-height:1.08;color:#1a2fb5;white-space:nowrap}
.bulletin .b-bottom-t .rk-in b{font-size:9.6pt;font-weight:700}
.bulletin .b-bottom-t .rk-ann{display:flex;align-items:baseline;justify-content:center;gap:2.6mm;margin-top:.9mm}
.bulletin .b-bottom-t .rk-ann span{font-size:8.6pt;font-weight:700;color:#12263f;line-height:1.1}
.bulletin .b-bottom-t .rk-ann span i{display:block;font-size:7.4pt;font-weight:400;font-style:normal;color:#333}
.bulletin .b-bottom-t .rk-ann b{font-size:11.6pt;color:#1a2fb5}
.bulletin .b-bottom-t .lbl .chk{margin-left:1.4mm}
.bulletin sup{font-size:.62em;vertical-align:super;line-height:0;font-weight:700}
.bulletin .b-bottom-t .appr-title.chef{font-weight:700}
.bulletin .b-bottom-t .appr-title.chef i{font-weight:700}
.bulletin .b-bottom-t .appr-title i{font-style:italic;font-size:7.6pt;color:#333}
.bulletin .b-bottom-t th i{font-style:normal;font-weight:400;font-size:7.4pt;display:block;text-transform:none}
.sheet{width:190mm;margin:0 auto;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#000;font-size:10.5pt}
.sheet h2{font-family:inherit;text-align:center;font-size:17pt;font-weight:600;margin:4mm 0 1mm}
.sheet .sub{text-align:center;margin-bottom:4mm}
.sheet table{width:100%;border-collapse:collapse;margin-bottom:5mm}
.sheet th,.sheet td{border:1px solid #000;padding:1mm 2mm;font-size:10pt}
.sheet th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .k{display:flex;flex-wrap:wrap;gap:3mm 8mm;margin-bottom:5mm}

@media print{
  /* Marges de page à 0 : le navigateur n'a plus de place pour imprimer
     son en-tête (titre de la page) et son pied de page (adresse https).
     Les marges visibles du bulletin sont recréées par le padding ci-dessous. */
  @page{size:A4;margin:0}
  html,body{background:#fff!important;height:auto}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
  #printRoot .bulletin{margin:0 auto;box-shadow:none;box-sizing:content-box;
    width:190mm;max-width:190mm;padding:9mm;background:#fff;
    break-after:page;page-break-after:always}
  #printRoot .bulletin:last-child{break-after:auto;page-break-after:auto}
  #printRoot .sheet{box-sizing:content-box;width:190mm;max-width:190mm;padding:9mm;
    margin:0 auto;break-after:page;page-break-after:always}
  #printRoot .sheet:last-child{break-after:auto;page-break-after:auto}
  body.no-print>*{display:none!important}
  body.no-print::after{content:'';display:block!important;height:60mm}
  body.no-print::before{content:'Impression réservée à l’administrateur.';display:block!important;font-size:16pt;text-align:center;padding:40mm 20mm 0;font-family:Arial,sans-serif}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow:auto;padding:8px}
  .side h4{display:none}
  .side a.nav{white-space:nowrap}
  main{padding:16px 12px 50px}
  .topbar{flex-wrap:wrap;gap:8px}
  .tri{margin-left:0}
  .two{grid-template-columns:1fr}
  .kpi{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function compactStudentPhoto(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type||!file.type.startsWith('image/'))return reject(new Error('Choisissez un fichier image valide.'));
    if(file.size>10*1024*1024)return reject(new Error('La photo dépasse la taille autorisée de 10 Mo.'));
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error('Lecture de la photo impossible.'));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Cette image ne peut pas être ouverte.'));
      img.onload=()=>{
        const target=4/5;let sx=0,sy=0,sw=img.width,sh=img.height;
        if(sw/sh>target){sw=sh*target;sx=(img.width-sw)/2}else{sh=sw/target;sy=(img.height-sh)/2}
        const c=document.createElement('canvas');c.width=240;c.height=300;
        const ctx=c.getContext('2d');if(!ctx)return reject(new Error('Traitement de la photo impossible.'));
        ctx.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',.76));
      };
      img.src=String(rd.result);
    };
    rd.readAsDataURL(file);
  });
}

function sha256Hex(text){
  const bytes=new TextEncoder().encode(text),bitLength=bytes.length*8;
  const totalLength=Math.ceil((bytes.length+9)/64)*64,data=new Uint8Array(totalLength);

  view.setUint32(totalLength-4,bitLength>>>0,false);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));

    const w=new Uint32Array(64);
    for(let i=0;i<16;i++)w[i]=view.getUint32(off+i*4,false);
    for(let i=16;i<64;i++){
      const x=w[i-15],y=w[i-2],s0=rotr(x,7)^rotr(x,18)^(x>>>3),s1=rotr(y,17)^rotr(y,19)^(y>>>10);

    }
    h=[(h[0]+a)>>>0,(h[1]+b)>>>0,(h[2]+c)>>>0,(h[3]+d)>>>0,(h[4]+e)>>>0,(h[5]+f)>>>0,(h[6]+g)>>>0,(h[7]+hh)>>>0];
  }
  return h.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function legacyHashPw(pw,salt){
  const data=new TextEncoder().encode(salt+':'+pw);

const seqIdx=t=>t===3?[4]:[(t-1)*2,(t-1)*2+1];
function getG(cls,sid,sub){return(cls.grades[sid]&&cls.grades[sid][sub])||null}
function setG(cls,sid,sub,i,v){const g=cls.grades[sid]||(cls.grades[sid]={});const a=g[sub]||(g[sub]=[null,null,null,null,null]);a[i]=v}
function subAvg(cls,sid,sub,t){
  const g=getG(cls,sid,sub);if(!g)return null;
  if(t===3){
    /* T3 : M/20 = moyenne generale de la matiere = (T1 x2 + T2 x2 + N5) / 5 */
    const seqMean=i=>{const v=[g[i*2],g[i*2+1]].filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
    const t1=seqMean(0),t2=seqMean(1),n5=g[4]!=null?g[4]:null;
    let sw=0,sp=0;
    if(t1!=null){sp+=t1*2;sw+=2}
    if(t2!=null){sp+=t2*2;sw+=2}
    if(n5!=null){sp+=n5;sw+=1}
    return sw?sp/sw:null;
  }
  const v=seqIdx(t).map(i=>g[i]).filter(x=>x!=null);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null
}
function compute(cls,t){
  const per={};
  for(const s of cls.students){
    const m={};let cs=0,pts=0;
    for(const sub of cls.subjects){const v=subAvg(cls,s.id,sub.id,t);m[sub.id]=v;if(v!=null){cs+=sub.coef;pts+=v*sub.coef}}
    per[s.id]={m,cs,pts,avg:cs>0?pts/cs:null,sr:{}};
  }
  const key=s=>Math.round(per[s.id].avg*100);
  const ranked=cls.students.filter(s=>per[s.id].avg!=null);
  const keys=ranked.map(key).sort((a,b)=>b-a);
  for(const s of ranked){const k=key(s);per[s.id].rank={r:keys.indexOf(k)+1,tie:keys.filter(x=>x===k).length>1}}
  for(const sub of cls.subjects){
    const ks=cls.students.map(s=>per[s.id].m[sub.id]).filter(v=>v!=null).map(v=>Math.round(v*100)).sort((a,b)=>b-a);
    for(const s of cls.students){const v=per[s.id].m[sub.id];if(v!=null){const k=Math.round(v*100);per[s.id].sr[sub.id]={r:ks.indexOf(k)+1,tie:ks.filter(x=>x===k).length>1}}}
  }
  const avgs=ranked.map(s=>per[s.id].avg);
  return{per,ranked,classAvg:avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null};
}

function bulletinRows(cls,sid,res,t){

  const seqs=seqIdx(t);

    const g=(sub.group||'').trim();

}

}

/* Réduit l'échelle d'un bulletin trop haut pour qu'il tienne sur UNE seule page A4.
   La mise en page, les polices et les marges restent celles de l'écran : rien d'autre ne change. */
function fitBulletinsOnePage(){
  const root=$('#printRoot');
  if(!root||!root.children.length)return;
  const availPx=(297-18-3)*3.7795275591;   // A4 297 mm - 2 x 9 mm de marge - 3 mm de sécurité
  const prev=root.getAttribute('style')||'';
  root.style.cssText='display:block!important;position:fixed;left:-20000px;top:0;width:auto;visibility:hidden;z-index:-1';
  $$('#printRoot .bulletin').forEach(b=>{
    b.style.zoom='';b.style.transform='';b.style.marginBottom='';
    const h=b.getBoundingClientRect().height||b.scrollHeight||0;
    if(h>availPx){
      const k=Math.max(.55,Math.min(1,(availPx/h)*.99));
      if(window.CSS&&CSS.supports&&CSS.supports('zoom','0.9')){b.style.zoom=String(k)}
      else{b.style.transformOrigin='top left';b.style.transform='scale('+k+')';b.style.marginBottom='-'+(h*(1-k))+'px'}
    }
  });
  root.setAttribute('style',prev);
}
function printHtml(html){
  if(!isAdmin()){toast('Impression réservée à l’administrateur.','err');return}
  $('#printRoot').innerHTML=html;
  fitBulletinsOnePage();
  document.body.classList.add('printing');
  setTimeout(()=>{fitBulletinsOnePage();window.print()},180);
}
addEventListener('beforeprint',()=>{
  document.body.classList.toggle('no-print',!isAdmin());
  if(isAdmin())fitBulletinsOnePage();
});
addEventListener('afterprint',()=>{document.body.classList.remove('printing','no-print');$('#printRoot').innerHTML=''});

// ===================== Synchronisation Supabase (production) =====================
// Le stockage local reste la source de vérité hors ligne.
// Dès qu'une URL + clé anon + code école sont renseignés, les données sont
// partagées entre l'administrateur et tous les professeurs.
const CLOUD_KEY='mbi_cloud_v1';

const Cloud={
  cfg:{url:'',key:'',schoolId:''},
  client:null,online:false,busy:false,snap:null,pollT:null,ch:null,localAt:0,last:'',msg:'',
  _lib:null,

  load(){try{const c=JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}');this.cfg={url:c.url||'',key:c.key||'',schoolId:c.schoolId||''}}catch(e){}return this.cfg},
  store(){try{localStorage.setItem(CLOUD_KEY,JSON.stringify(this.cfg))}catch(e){}},
  enabled(){return !!(this.cfg.url&&this.cfg.key&&this.cfg.schoolId)},
  newSchoolId(){const c='0123456789abcdef';let s='sch-';for(let i=0;i<24;i++)s+=c[Math.floor(Math.random()*16)];return s},

  libLoad(){
    if(window.supabase)return Promise.resolve(true);
    if(this._lib)return this._lib;
    this._lib=new Promise(res=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
      s.onload=()=>res(!!window.supabase);
      s.onerror=()=>res(false);
      document.head.appendChild(s);
    });
    // filet de sécurité : si le CDN ne répond pas, on continue en mode local
    return Promise.race([this._lib,new Promise(r=>setTimeout(()=>r(!!window.supabase),8000))]);
  },

  badge(){
    const b=document.getElementById('cloudBadge');if(!b)return;
    if(!this.enabled()){b.style.display='none';return}
    b.style.display='';b.className='badge '+(this.online?'ok':'warn');
    b.textContent=this.online?'En ligne':'Hors ligne';
    b.title=this.last?('Dernière synchronisation : '+this.last):'Aucune synchronisation';
  },
  setMsg(m){this.msg=m;const el=document.getElementById('cloud-status');if(el)el.textContent=m;this.badge()},

  async connect(){
    if(!this.enabled()){this.setMsg('Synchronisation non configurée — mode local.');return false}
    this.setMsg('Connexion à Supabase…');
    if(!await this.libLoad()){this.setMsg('Bibliothèque Supabase inaccessible (pas d’Internet ?). Mode local actif.');return false}
    try{
      this.client=window.supabase.createClient(this.cfg.url,this.cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});
      // Connexion anonyme si l'option est activée dans Supabase (mode sécurisé).
      try{await this.client.auth.signInAnonymously()}catch(e){}
      const {error}=await this.client.rpc('app_pull',{p_school:this.cfg.schoolId});
      if(error)throw new Error(error.message||'Connexion refusée');
      this.online=true;
      this.setMsg('Connecté à Supabase ('+this.cfg.url.replace(/^https?:\/\//,'')+'). Synchronisation active.');
      this.startPoll();this.startRealtime();
      return true;
    }catch(e){
      this.online=false;this.client=null;
      this.setMsg('Connexion impossible : '+(e.message||e)+' — vérifiez l’URL, la clé et que le script SQL a bien été exécuté.');
      return false;
    }
  },

  // -------- lecture / écriture locale sans repasser par le cloud --------
  saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}},
  renderIfPossible(){try{if(typeof ME!=='undefined'&&ME)render()}catch(e){}},

  // -------- conversion de la base locale en lignes SQL --------
  rows(){
    const o={users:[],classes:[],subjects:[],students:[],grades:[],remarks:[],lessons:[]};
    (DB.users||[]).forEach(u=>o.users.push({id:u.id,username:u.username,name:u.name,phone:u.phone||'',role:u.role,salt:u.salt||'',hash:u.hash||''}));
    (DB.classes||[]).forEach(c=>{
      o.classes.push({id:c.id,name:c.name,preset_key:c.presetKey||'',ord:c.ord||0,lang:c.lang||'fr',pp_id:c.ppId||'',pp_name:c.ppName||'',pp_tel:c.ppTel||'',locks:c.locks||{}});
      (c.subjects||[]).forEach((s,i)=>o.subjects.push({id:s.id,class_id:c.id,name:s.name,coef:Number(s.coef)||0,is_opt:!!s.opt,group_name:s.group||'',teacher_id:s.teacherId||'',ord:i}));
      (c.students||[]).forEach((s,i)=>o.students.push({id:s.id,class_id:c.id,name:s.name,sex:s.sex||'',mat:s.mat||'',dob:s.dob||'',pob:s.pob||'',photo:s.photo||'',session_tag:s.sessionTag||'N',ord:i}));
      for(const sid in (c.grades||{})){
        for(const sub in c.grades[sid]){
          const arr=c.grades[sid][sub]||[];
          if(!arr.some(v=>v!=null&&v!==''))continue;
          const seqs=[0,1,2,3,4].map(i=>(arr[i]==null||arr[i]==='')?null:Number(arr[i]));
          o.grades.push({id:sid+':'+sub,student_id:sid,subject_id:sub,seqs});
        }
      }
      for(const sid in (c.remarks||{})){
        const r=c.remarks[sid]||{};
        [1,2,3].forEach(t=>{if(r['t'+t])o.remarks.push({id:sid+':t'+t,student_id:sid,trim:t,text:r['t'+t]})});
      }
      for(const sub in (c.lessons||{})){
        const l=c.lessons[sub]||{};
        o.lessons.push({id:c.id+':'+sub,class_id:c.id,subject_id:sub,planned:Number(l.planned)||0,done:Number(l.done)||0,at:Number(l.at)||null});
      }
    });
    return o;
  },

  diff(rows){
    const prev=this.snap||{};
    const payload={},deleted={};let n=0;
    for(const t in rows){
      const old={};(prev[t]||[]).forEach(r=>old[r.id]=r);
      const seen={},changed=[];
      rows[t].forEach(r=>{seen[r.id]=1;const p=old[r.id];if(!p||JSON.stringify(p)!==JSON.stringify(r)){changed.push(r);n++}});
      const gone=(prev[t]||[]).filter(r=>!seen[r.id]).map(r=>r.id);
      if(changed.length)payload[t]=changed;
      if(gone.length){deleted[t]=gone;n+=gone.length}
    }
    return {payload,deleted,n};
  },

  // -------- envoi (delta uniquement) --------
  async push(force){
    if(!this.client||!this.enabled())return false;
    if(this.busy)return false;
    const rows=this.rows();
    const {payload,deleted,n}=this.diff(rows);
    if(!n&&!force){this.snap=rows;return true}
    this.busy=true;this.setMsg('Envoi des modifications…');
    try{
      const school={name:DB.school.name||'',city:DB.school.city||'',year:DB.school.year||'',principal:DB.school.principal||'',header:DB.school.header||null};
      const head={school,deleted:{}};
      ['users','classes','subjects','students','remarks','lessons'].forEach(t=>{if(payload[t])head[t]=payload[t]});
      if(deleted.users)head.deleted.users=deleted.users;
      if(deleted.classes)head.deleted.classes=deleted.classes;
      if(deleted.subjects)head.deleted.subjects=deleted.subjects;
      if(deleted.students)head.deleted.students=deleted.students;
      if(deleted.remarks)head.deleted.remarks=deleted.remarks;
      if(deleted.lessons)head.deleted.lessons=deleted.lessons;
      let {error}=await this.client.rpc('app_push',{p_school:this.cfg.schoolId,p_payload:head});
      if(error)throw new Error(error.message||'Écriture refusée');
      // notes par lots de 600 pour ne pas dépasser la taille maximale d'une requête
      const grades=payload.grades||[];
      for(let i=0;i<grades.length;i+=600){
        const chunk={grades:grades.slice(i,i+600)};
        const res=await this.client.rpc('app_push',{p_school:this.cfg.schoolId,p_payload:chunk});
        if(res.error)throw new Error(res.error.message||'Écriture des notes refusée');
      }
      if(deleted.grades&&deleted.grades.length){
        const res=await this.client.rpc('app_push',{p_school:this.cfg.schoolId,p_payload:{deleted:{grades:deleted.grades}}});
        if(res.error)throw new Error(res.error.message);
      }
      this.snap=rows;this.last=new Date().toLocaleTimeString('fr-FR');
      this.online=true;this.setMsg('Synchronisé — '+this.last+' ('+n+' élément'+(n>1?'s':'')+' envoyé'+(n>1?'s':'')+').');
      return true;
    }catch(e){
      this.setMsg('Erreur d’envoi : '+(e.message||e));
      return false;
    }finally{this.busy=false}
  },

  schedule(){
    this.localAt=Date.now();
    if(!this.client||!this.enabled())return;
    clearTimeout(this._t);
    this._t=setTimeout(()=>{this.push(false)},2500);
  },

  // -------- récupération --------
  async pull(force){
    if(!this.client||!this.enabled())return false;
    if(!force&&Date.now()-this.localAt<2500)return false; // ne pas écraser une saisie en cours
    try{
      const {data,error}=await this.client.rpc('app_pull',{p_school:this.cfg.schoolId});
      if(error)throw new Error(error.message||'Lecture refusée');
      const remoteClasses=(data&&Array.isArray(data.classes))?data.classes:[];
      if(!remoteClasses.length&&(DB.classes||[]).length){
        // Cloud vide : on y envoie les données locales
        this.snap=this.rows();
        await this.push(true);
        return true;
      }
      if(!remoteClasses.length)return false;
      const before=this.snap?JSON.stringify(this.snap):'';
      this.apply(data);
      const after=this.rows();
      const changed=before!==JSON.stringify(after);
      this.snap=after;
      this.last=new Date().toLocaleTimeString('fr-FR');
      this.online=true;
      this.setMsg('Données reçues du cloud — '+this.last+'.');
      this.saveLocal();
      if(typeof calcCache!=='undefined')calcCache={};
      if(changed){
        this.badge();
        const busy=document.querySelector('#modalRoot .modal')||document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if(busy){this.pendingRender=true}
        else{this.pendingRender=false;this.renderIfPossible()}
      }
      return true;
    }catch(e){
      this.setMsg('Erreur de réception : '+(e.message||e));
      return false;
    }
  },

  apply(d){
    if(!d)return false;
    if(d.school){
      const s=d.school;
      DB.school.name=s.name||DB.school.name;
      DB.school.city=s.city||DB.school.city;
      DB.school.year=s.year||DB.school.year;
      DB.school.principal=s.principal||DB.school.principal;
      if(s.header)DB.school.header=s.header;
    }
    if(Array.isArray(d.users)&&d.users.length){
      DB.users=d.users.map(u=>({id:u.id,username:String(u.username||'').toLowerCase(),name:u.name||'',phone:u.phone||'',role:u.role==='admin'?'admin':'prof',salt:u.salt||'',hash:u.hash||''}));
      try{if(typeof ME!=='undefined'&&ME&&!DB.users.some(u=>u.id===ME.id)){ME=null;try{sessionStorage.removeItem(SKEY)}catch(e){}}}catch(e){}
    }
    const byId={};
    (d.classes||[]).forEach(c=>{
      byId[c.id]={id:c.id,name:c.name,presetKey:c.preset_key||'',ord:c.ord||0,lang:c.lang||'fr',
        ppId:c.pp_id||'',ppName:c.pp_name||'',ppTel:c.pp_tel||'',
        locks:c.locks||{1:false,2:false,3:false},
        subjects:[],students:[],grades:{},remarks:{},lessons:{}};
    });
    const stuCls={},subCls={};
    (d.students||[]).forEach(s=>stuCls[s.id]=s.class_id);
    (d.subjects||[]).forEach(s=>subCls[s.id]=s.class_id);
    (d.subjects||[]).forEach(s=>{const c=byId[s.class_id];if(c)c.subjects.push({id:s.id,name:s.name,coef:Number(s.coef)||1,group:s.group_name||'',opt:!!s.is_opt,teacherId:s.teacher_id||'',_ord:s.ord||0})});
    (d.students||[]).forEach(s=>{const c=byId[s.class_id];if(c)c.students.push({id:s.id,name:s.name,sex:s.sex||'',mat:s.mat||'',dob:s.dob||'',pob:s.pob||'',photo:s.photo||'',sessionTag:s.session_tag||'N'})});
    (d.grades||[]).forEach(g=>{
      const c=byId[stuCls[g.student_id]];if(!c)return;
      const arr=(g.seqs||[]).slice(0,5).map(v=>v==null||v===''?null:Number(v));
      while(arr.length<5)arr.push(null);
      (c.grades[g.student_id]||(c.grades[g.student_id]={}))[g.subject_id]=arr;
    });
    (d.remarks||[]).forEach(r=>{
      const c=byId[stuCls[r.student_id]];if(!c)return;
      const o=c.remarks[r.student_id]||(c.remarks[r.student_id]={});
      o['t'+r.trim]=r.text;
    });
    (d.lessons||[]).forEach(l=>{
      const c=byId[l.class_id];if(!c)return;
      c.lessons[l.subject_id]={planned:Number(l.planned)||0,done:Number(l.done)||0,at:l.updated_at?Date.parse(l.updated_at):(l.at?Number(l.at):0)};
    });
    const ordered=(d.classes||[]).map(c=>byId[c.id]).filter(Boolean);
    ordered.forEach(c=>{
      c.subjects.sort((a,b)=>(a._ord||0)-(b._ord||0));
      c.subjects.forEach(s=>{delete s._ord});
    });
    if(ordered.length)DB.classes=ordered;
    return true;
  },

  startPoll(){
    clearInterval(this.pollT);
    this.pollT=setInterval(()=>{if(this.online&&!document.hidden)this.pull(false)},20000);
  },

  startRealtime(){
    if(!this.client||this.ch)return;
    try{
      this.ch=this.client.channel('mbi-sync')
        .on('postgres_changes',{event:'*',schema:'public',table:'lessons'},()=>this.pull(false))
        .on('postgres_changes',{event:'*',schema:'public',table:'grades'},()=>this.pull(false))
        .on('postgres_changes',{event:'*',schema:'public',table:'remarks'},()=>this.pull(false))
        .subscribe();
    }catch(e){this.ch=null}
  },

  stop(){
    clearInterval(this.pollT);this.pollT=null;
    try{if(this.ch&&this.client)this.client.removeChannel(this.ch)}catch(e){}
    this.ch=null;this.client=null;this.online=false;
  },

  async boot(){
    this.load();
    if(!this.enabled()){this.setMsg('Mode local — aucune synchronisation configurée.');return}
    const ok=await this.connect();
    if(ok){await this.pull(true)}
  }
};

/* ---------- Sessions scolaires ---------- */
function sessionTotals(classes){const a=Array.isArray(classes)?classes:[];return{classes:a.length,students:a.reduce((n,c)=>n+((c&&c.students)||[]).length,0)}}
function sessionDate(iso){if(!iso)return'—';const d=new Date(iso);return isNaN(d)?'—':d.toLocaleDateString('fr-FR')}
function sessionsHtml(){
  // Nettoie automatiquement les doublons d'archives au chargement
  if(Array.isArray(DB.sessions)){
    const seen=new Set();
    DB.sessions=DB.sessions.filter(s=>{
      if(seen.has(s.year))return false;
      seen.add(s.year);return true;
    });
  }
  const archived=archivedSessions(),tot=sessionTotals(DB.classes);
  if(!Array.isArray(DB.sessions))DB.sessions=[];
  const nextY=nextSchoolYear(DB.school.year);
  const needActivate = DB.school.year!=='2027/2028';
  const actions='<div class="session-actions">'+
    '<button class="btn" data-act="simulate-year">Simuler la nouvelle session ('+esc(nextY)+')</button>'+
    (needActivate?'<button class="btn green" data-act="direct-activate">Activer '+esc(nextY)+' en un clic</button>':'')+
    '<button class="btn primary" data-act="close-year">Créer une nouvelle session</button>'+
    '</div>';
  let h='<div class="page-h"><div><h1>Sessions scolaires</h1><p>Session active : <b>'+esc(DB.school.year)+'</b> — Consultez les années clôturées ou préparez la nouvelle session.</p></div>'+
    (isAdmin()&&!isReadOnlySession()?actions:'')+'</div>';
  if(needActivate && Array.isArray(DB.sessions) && DB.sessions.length>0){
    const hasArchive = DB.sessions.some(s=>s&&s.year==='2026/2027');
    // Vérifier si les notes ont été effacées (classes vides de notes = essai précédent échoué)
    let anyGrades=false;
    for(let ci=0;ci<DB.classes.length;ci++){for(let sid in DB.classes[ci].grades){for(let subid in DB.classes[ci].grades[sid]){const g=DB.classes[ci].grades[sid][subid];if(g&&g.some(x=>x!=null)){anyGrades=true;break}}if(anyGrades)break}if(anyGrades)break}
    if(hasArchive){
      h+='<div class="notice" style="background:'+(anyGrades?'#e6f4dc':'#fbe4e4')+';border-color:'+(anyGrades?'#b9d89b':'#e7b9bb')+';padding:16px">';
      if(!anyGrades){
        h+='<b style="color:var(--red);font-size:16px">ATTENTION : LES NOTES ONT ÉTÉ EFFACÉES PAR UN ESSAI PRÉCÉDENT</b><br>Vous devez restaurer les données avant de pouvoir activer correctement :<br><br><button class="btn danger" data-act="restore-archive" style="font-size:15px;padding:10px 18px">RESTAURER LES DONNÉES 2026/2027 ET TOUTES LES NOTES</button><br><br>Le bouton Activer ne fonctionnera pas tant que les notes ne seront pas restaurées.';
      }else{
        h+='Les notes sont bien présentes. Vous pouvez activer la nouvelle session. Les élèves avec moyenne <10/20 seront marqués <b>Ancien</b> (redoublent), ceux ≥10/20 seront <b>NA</b> (passent en classe supérieure).';
      }
      h+='</div>';
    }
  }
  if(isReadOnlySession())h+='<div class="notice info">Vous consultez une session archivée en lecture seule. <button class="btn sm" data-act="session-current">Revenir à la session en cours</button></div>';
  h+='<div class="panel"><h3>Session en cours <span class="badge ok">ACTIVE</span></h3><p><b>Année scolaire :</b> '+esc(DB.school.year)+' · <b>Classes :</b> '+tot.classes+' · <b>Élèves :</b> '+tot.students+'</p><button class="btn" data-act="session-current">Ouvrir la session en cours</button></div>';
  h+='<div class="panel"><h3>Sessions clôturées</h3>';
  if(!archived.length)h+='<p class="muted">Aucune session clôturée pour le moment. Les années clôturées seront conservées ici avec leurs classes, élèves, notes et bulletins.</p>';
  else h+='<div class="tw"><table class="t"><thead><tr><th>Année scolaire</th><th>Date de clôture</th><th>Classes</th><th>Élèves</th><th></th></tr></thead><tbody>'+archived.map(a=>{const n=sessionTotals(a.classes);return'<tr><td><b>'+esc(a.year)+'</b></td><td>'+sessionDate(a.closedAt)+'</td><td>'+n.classes+'</td><td>'+n.students+'</td><td class="right"><button class="btn sm" data-act="session-view" data-id="'+esc(a.id)+'">Consulter / imprimer</button></td></tr>'}).join('')+'</tbody></table></div>';
  h+='</div>';
  if(isAdmin())h+='<div class="notice">La clôture archive les données de l’année, recrée les classes pour l’année suivante et ne supprime aucune ancienne note ni aucun bulletin.</div>';
  return h;
}

const NEXT_LEVEL_MAP={'6e':'5e','5e':'4e','4e':'3e','3e':'2A','2A':'1A','2C':'1D','1A':'TA','1D':'TD','F1':'F2','TA':'','TD':'','F2':''};
function startCloseYear(){
  // 1) les classes actuelles (recréées à l'identique) + 2) les niveaux d'accueil manquants
  const nextClasses=DB.classes.map(c=>({sourceId:c.id,id:uid(),name:c.name,ord:c.ord,presetKey:c.presetKey}));
  const needed=new Set();
  DB.classes.forEach(c=>{const n=NEXT_LEVEL_MAP[c.presetKey];if(n)needed.add(n)});
  for(const pk of needed){
    if(nextClasses.some(nc=>nc.presetKey===pk))continue;
    const pr=PRESETS.find(x=>x.key===pk);
    const label=pr?pr.label:pk;
    let name=label,k=2;
    while(nextClasses.some(nc=>nc.name===name)){name=label+' '+k;k++}
    nextClasses.push({sourceId:null,id:uid(),name,ord:pr?PRESETS.findIndex(x=>x.key===pk):99,presetKey:pk,isNew:true});
  }
  nextClasses.sort((a,b)=>(a.ord-b.ord)||a.name.localeCompare(b.name,'fr',{numeric:true}));
  const decisions={};
  DB.classes.forEach(c=>{
    const nextPreset=NEXT_LEVEL_MAP[c.presetKey]||'';
    // classe d'accueil présélectionnée : la classe du niveau supérieur déjà existante
    const defaultTarget=nextPreset?nextClasses.find(nc=>nc.presetKey===nextPreset):null;
    c.students.forEach(st=>{
      const avg=annualStudentAverage(c,st.id);
      let decision,targetClassId='';
      if(!nextPreset){decision='sorti'}                                   // Tle / Form II → sortie
      else if(avg==null||avg<10){decision='redouble'}                     // pas de notes ou < 10 → redouble
      else{decision='admis';targetClassId=defaultTarget?defaultTarget.id:''} // ≥ 10 → admis
      decisions[closeKey(c.id,st.id)]={sourceClassId:c.id,studentId:st.id,decision,targetClassId};
    });
  });
  S.closeState={year:DB.school.year,nextYear:nextSchoolYear(DB.school.year),nextClasses,decisions};
}
function annualStudentAverage(cls,studentId){
  const vals=[1,2,3].map(t=>getRes(cls,t).per[studentId]?.avg).filter(v=>v!=null);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
/* Bilan annuel d'une classe : moyenne annuelle de chaque eleve (moyenne des trois trimestres),
   rang annuel, min/max, nombre de moyennes >= 10 et taux de reussite — utilise au 3e trimestre. */
function annualStats(cls){
  const per={};
  for(const s of cls.students){
    const vals=[1,2,3].map(t=>getRes(cls,t).per[s.id]?.avg).filter(v=>v!=null);
    per[s.id]={avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null};
  }
  const ranked=cls.students.filter(s=>per[s.id].avg!=null);
  const keys=ranked.map(s=>Math.round(per[s.id].avg*100)).sort((a,b)=>b-a);
  for(const s of ranked){
    const k=Math.round(per[s.id].avg*100);
    per[s.id].rank={r:keys.indexOf(k)+1,tie:keys.filter(x=>x===k).length>1};
  }
  const avgs=ranked.map(s=>per[s.id].avg);
  const passCount=avgs.filter(a=>a>=10).length;
  return {per,ranked,
    avg:avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null,
    mn:avgs.length?Math.min.apply(null,avgs):null,
    mx:avgs.length?Math.max.apply(null,avgs):null,
    passCount,pass:avgs.length?passCount/avgs.length:null};
}

}
function closeProgress(){
  if(!S.closeState)return{done:0,total:0};

}

function cloneClassToNextSession(cls,id){
  const c=JSON.parse(JSON.stringify(cls));c.id=id;c.students=[];c.grades={};c.remarks={};c.lessons={};c.locks={1:false,2:false,3:false};
  c.subjects=(cls.subjects||[]).map(s=>({...s,id:uid()}));return c;
}
function finishCloseYear(){
  const state=S.closeState;if(!state||!closePlanComplete()){toast('Choisissez une décision pour chaque élève et une classe pour chaque élève admis.','err');return}
  const archived={id:uid(),year:DB.school.year,closedAt:new Date().toISOString(),closedBy:ME?ME.name:'',school:JSON.parse(JSON.stringify(DB.school)),users:DB.users.map(u=>({id:u.id,name:u.name,phone:u.phone||'',role:u.role})),classes:JSON.parse(JSON.stringify(DB.classes))};
  const nextClasses=state.nextClasses.map(nc=>{
    if(nc.sourceId){
      const src=DB.classes.find(c=>c.id===nc.sourceId);
      if(src)return cloneClassToNextSession(src,nc.id);
    }
    // niveau d'accueil qui n'existait pas : on le crée depuis le modèle officiel
    const c=newClass(nc.presetKey,nc.name);
    c.id=nc.id;c.students=[];c.grades={};c.remarks={};c.lessons={};
    c.locks={1:false,2:false,3:false};
    return c;
  });
  const nextBySource=new Map();
  state.nextClasses.forEach(nc=>{if(nc.sourceId)nextBySource.set(nc.sourceId,nextClasses.find(x=>x.id===nc.id))});
  for(const oldClass of DB.classes)for(const st of oldClass.students){
    const plan=state.decisions[closeKey(oldClass.id,st.id)];if(plan.decision==='sorti')continue;
    const target=plan.decision==='redouble'?nextBySource.get(oldClass.id):nextClasses.find(c=>c.id===plan.targetClassId);
    if(!target){toast('Une classe d’accueil sélectionnée est introuvable.','err');return}
    const student=JSON.parse(JSON.stringify(st));student.sessionTag=plan.decision==='redouble'?'Ancien':'NA';target.students.push(student);
  }
  nextClasses.forEach(c=>c.students.sort(cmpName));
  if(!Array.isArray(DB.sessions))DB.sessions=[];DB.sessions.unshift(archived);
  DB.classes=nextClasses;DB.school.year=state.nextYear;calcCache={};
  S.closeState=null;S.sessionId=null;S.simulationState=null;S.view='dash';S.classId=null;S.tab='eleves';S.trim=1;
  dirty();saveNow();render();toast('Session '+archived.year+' archivée ; la nouvelle session '+DB.school.year+' a été créée.','ok');
}

function startSessionSimulation(){
  // Mapping des classes supérieures pour préselection auto
  const nextLevelMap={'6e':'5e','5e':'4e','4e':'3e','3e':'2A','2A':'1A','2C':'1D','1A':'TA','1D':'TD','F1':'F2','TA':'','TD':'','F2':''};
  // Créer map des classes simulées par presetKey
  const nextClasses=DB.classes.map(c=>({sourceId:c.id,id:'sim-'+uid(),name:c.name,ord:c.ord,presetKey:c.presetKey}));
  const decisions={};
  DB.classes.forEach(c=>{
    // Trouver la classe d'accueil par défaut pour ce niveau
    const nextPreset=nextLevelMap[c.presetKey]||'';
    let defaultTargetId='';
    if(nextPreset){
      // Chercher une classe de niveau supérieur existante
      const target=nextClasses.find(nc=>nc.presetKey===nextPreset);
      if(target)defaultTargetId=target.id;
    }
    c.students.forEach(st=>{
      const avg=annualStudentAverage(c,st.id);
      // Décision par défaut : si pas de note → redouble ; si ≥10 → admis ; sinon redouble ; Tle → sorti
      let decision;
      if(nextPreset===''){
        decision='sorti';
      }else if(avg==null || avg<10){
        decision='redouble';
      }else{
        decision='admis';
      }
      decisions[closeKey(c.id,st.id)]={
        sourceClassId:c.id,studentId:st.id,
        decision:decision,
        targetClassId:decision==='admis'?defaultTargetId:''
      }
    })
  });
  S.simulationState={sourceYear:DB.school.year,year:'2027/2028',nextClasses,decisions};S.closeState=null;S.sessionId=null;S.classId=null;S.view='simulate-year';render();
}
function simulationComplete(){
  if(!S.simulationState)return false;
  return Object.values(S.simulationState.decisions).every(p=>p.decision&&(p.decision!=='admis'||p.targetClassId));
}
function simulationSummaryHtml(){
  const state=S.simulationState;if(!state)return'';
  const nextLevelMap={'6e':'5e','5e':'4e','4e':'3e','3e':'2A','2A':'1A','2C':'1D','1A':'TA','1D':'TD','F1':'F2','TA':'','TD':'','F2':''};
  const neededPresets=new Set();
  for(const cls of DB.classes){neededPresets.add(cls.presetKey);const nextP=nextLevelMap[cls.presetKey];if(nextP)neededPresets.add(nextP)}
  const dispClasses=[...neededPresets].map(pk=>{const pr=PRESETS.find(p=>p.key===pk);return{presetKey:pk,name:pr?pr.label:pk}});
  const rosters=new Map(dispClasses.map(c=>[c.presetKey,[]]));let admis=0,redouble=0,sortis=0;
  for(const cls of DB.classes)for(const st of cls.students){
    const p=state.decisions[closeKey(cls.id,st.id)];if(!p||!p.decision)continue;
    if(p.decision==='sorti'){sortis++;continue}
    let targetPreset;
    if(p.decision==='redouble'){targetPreset=cls.presetKey}
    else{const targetSim=state.nextClasses.find(nc=>nc.id===p.targetClassId);targetPreset=targetSim?nextLevelMap[targetSim.presetKey]||targetSim.presetKey:nextLevelMap[cls.presetKey]}
    if(!targetPreset||!rosters.has(targetPreset))continue;
    const tag=p.decision==='redouble'?'Ancien':'NA';if(tag==='Ancien')redouble++;else admis++;
    rosters.get(targetPreset).push({...st,sessionTag:tag});
  }
  const pending=Object.values(state.decisions).filter(p=>!p.decision||(p.decision==='admis'&&!p.targetClassId)).length,total=Object.keys(state.decisions).length;
  let h='<div class="panel"><h3>Répartition simulée — '+esc(state.year)+'</h3><div class="kpis"><div class="kpi"><b>'+admis+'</b><span>admis · tag NA</span></div><div class="kpi"><b>'+redouble+'</b><span>redoublants · tag Ancien</span></div><div class="kpi"><b>'+sortis+'</b><span>sorties fin de cycle</span></div><div class="kpi"><b>'+pending+'</b><span>à compléter</span></div></div><p class="small muted">Décisions complètes : '+(total-pending)+' / '+total+' · Les classes supérieures sont automatiquement créées (6e→5e, 5e→4e, ..., Tle → sortie).</p><div class="tw"><table class="t"><thead><tr><th>Classe dans la session 2027/2028</th><th>Effectif</th><th>Élèves et tags</th></tr></thead><tbody>';
  for(const cls of dispClasses){const names=(rosters.get(cls.presetKey)||[]).sort(cmpName).map(st=>tagBadge(st)+' '+esc(st.name)).join(' · ');h+='<tr><td><b>'+esc(cls.name)+'</b></td><td>'+(rosters.get(cls.presetKey)||[]).length+'</td><td class="small">'+(names||'<span class="muted">Aucun élève dans cette classe</span>')+'</td></tr>'}
  h+='</tbody></table></div></div>';return h;
}

function applySimulationYear(){
  const state=S.simulationState;
  if(!state){toast('Aucune simulation en cours.','err');return;}
  const nextLevelMap={'6e':'5e','5e':'4e','4e':'3e','3e':'2A','2A':'1A','2C':'1D','1A':'TA','1D':'TD','F1':'F2','TA':'','TD':'','F2':''};
  // Vérifie qu'on ne va pas archiver une session déjà archivée (évite doublons)
  if(!Array.isArray(DB.sessions))DB.sessions=[];
  const alreadyArchived=DB.sessions.some(a=>a.year===DB.school.year);
  if(!alreadyArchived){
    // Archive l'année actuelle
    const archived={id:uid(),year:DB.school.year,closedAt:new Date().toISOString(),classes:JSON.parse(JSON.stringify(DB.classes))};
    DB.sessions.unshift(archived);
  }
  // Créer les classes nécessaires (niveau actuel + niveaux supérieurs)
  const neededPresets=new Set();
  for(const cls of DB.classes){
    neededPresets.add(cls.presetKey); // classe pour redoublants
    const nextP=nextLevelMap[cls.presetKey];
    if(nextP)neededPresets.add(nextP); // classe supérieure pour admis
  }
  const nextClasses=[];
  for(const presetKey of neededPresets){
    const pr=PRESETS.find(p=>p.key===presetKey);
    if(!pr)continue;
    nextClasses.push({
      id:uid(),
      name:pr.label,
      ord:PRESETS.findIndex(p=>p.key===presetKey),
      presetKey:presetKey,
      ppId:'',ppName:'',
      subjects:pr.subs().map(s=>({...s,id:uid()})),
      students:[],locks:{1:false,2:false,3:false},grades:{},remarks:{}
    });
  }
  // Affecte les élèves - sécurité : toute décision manquante = redouble par défaut
  const rosters=new Map(nextClasses.map(c=>[c.presetKey,c.students]));
  for(const cls of DB.classes)for(const st of cls.students){
    let p=state.decisions[closeKey(cls.id,st.id)];
    if(!p)p={decision:'redouble',targetClassId:''};
    let decision=p.decision;
    if(!decision){
      decision = nextLevelMap[cls.presetKey]==='' ? 'sorti' : 'redouble';
    }
    if(decision==='sorti')continue;
    let targetPreset;
    if(decision==='redouble'){
      targetPreset=cls.presetKey;
    }else{
      let targetSim=null;
      if(p.targetClassId) targetSim=state.nextClasses.find(nc=>nc.id===p.targetClassId);
      targetPreset=targetSim?nextLevelMap[targetSim.presetKey]||targetSim.presetKey:nextLevelMap[cls.presetKey];
    }
    const targetCls=nextClasses.find(c=>c.presetKey===targetPreset);
    if(!targetCls)continue;
    const student=JSON.parse(JSON.stringify(st));
    student.sessionTag=decision==='redouble'?'Ancien':'NA';
    student.mat=genMat();
    student.photo=student.photo||'';
    targetCls.students.push(student);
  }
  // Trie les élèves par nom dans chaque classe
  nextClasses.forEach(c=>c.students.sort(cmpName));
  // Force la mise à jour de l'année en PREMIER dans la sauvegarde
  DB.school.year=state.year; // 2027/2028 - OBLIGATOIRE, avant toute autre opération
  DB.classes=nextClasses;
  calcCache={};
  S.simulationState=null;S.sessionId=null;S.view='dash';S.classId=null;S.tab='eleves';S.trim=1;
  // Sauvegarde IMMÉDIATE synchrone pour éviter tout état interrompu
  clearTimeout(saveT);
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){memOnly=true}
  dirty();render();
  toast('Nouvelle session activée : '+DB.school.year+' !','ok');
}

/* ---------- Gestion des leçons / progression des matières ---------- */
function initLessonsForClass(cls){
  if(!cls.lessons)cls.lessons={};
  for(const sub of cls.subjects){if(!cls.lessons[sub.id])cls.lessons[sub.id]={planned:0,done:0}}
}
function initAllLessons(){
  try{for(const c of viewClasses())initLessonsForClass(c)}catch(e){}
}
/* Couleur de la barre de progression : rouge <50 %, orange 50-74 %, vert >=75 % */
function lsnColor(pct){return pct>=75?'var(--green)':pct>=50?'var(--amber)':'var(--red)'}
function lsnPct(ls){return ls&&ls.planned>0?Math.min(100,Math.round(ls.done/ls.planned*100)):0}
/* Rafraîchit le badge « X / Y leçons · Z % » de l'en-tête d'une classe */
function refreshClassLessonBadge(cls){
  const el=document.querySelector('[data-clsinfo="'+cls.id+'"]');if(!el)return;
  let tp=0,td=0;
  for(const sub of cls.subjects){if(!isAdmin()&&sub.teacherId!==ME.id)continue;const l=cls.lessons[sub.id]||{planned:0,done:0};tp+=l.planned;td+=l.done}
  const p=tp>0?Math.min(100,Math.round(td/tp*100)):0;
  el.textContent=td+' / '+tp+' leçons · '+p+' %';
  el.style.color=lsnColor(p);el.style.borderColor=lsnColor(p);
}
/* Empreinte stable d'une chaîne : même matière = mêmes valeurs à chaque chargement */
function lsnHash(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
  return Math.abs(h);
}
/* Saisit des leçons réalistes à la place de tous les professeurs (valeurs stables) */
function seedLessonsDeterministic(){
  let n=0;const now=Date.now();
  for(const cls of viewClasses()){
    initLessonsForClass(cls);
    for(const sub of cls.subjects){
      const h=lsnHash(cls.id+':'+sub.id);
      const planned=[40,44,48,50,52,56,60][h%7];
      const ratio=(h>>3)%100;                            // 0 → 99
      // léger décalage propre à chaque professeur : certains sont en avance, d'autres en retard
      const tb=((lsnHash(String(sub.teacherId||'none'))%61)-30)/100;   // -0,30 → +0,30
      const raw=0.42+ratio/100*0.62+tb;
      const done=Math.min(planned,Math.max(0,Math.round(planned*Math.min(1.02,Math.max(0.12,raw)))));
      cls.lessons[sub.id]={planned,done,at:now-Math.round(((h>>7)%20)*86400000)};
      n++;
    }
  }
  return n;
}
/* Au premier chargement : si aucun professeur n'a jamais rien saisi, on remplit une fois */
function autoSeedLessonsIfEmpty(){
  try{
    if(DB.lessonsSeed)return false;
    const all=viewClasses();
    if(!all||!all.length)return false;
    let total=0;
    for(const c of all){initLessonsForClass(c);for(const sub of c.subjects){const l=c.lessons[sub.id];total+=(l.planned||0)+(l.done||0)}}
    if(total>0){DB.lessonsSeed=1;return false}
    seedLessonsDeterministic();
    DB.lessonsSeed=1;
    dirty();saveNow();
    return true;
  }catch(e){return false}
}
/* Simulation de la progression des leçons pour toutes les classes et matières */
function simulateLessons(){
  let n=0;
  for(const cls of viewClasses()){
    initLessonsForClass(cls);
    for(const sub of cls.subjects){
      const planned=[40,44,48,50,52,56,60][Math.floor(Math.random()*7)];
      const r=0.25+Math.random()*0.8;            // entre 25 % et 105 % d'avancement
      const done=Math.min(planned,Math.round(planned*r));
      cls.lessons[sub.id]={planned,done,at:Date.now()};n++;
    }
  }
  return n;
}

function parseNote(s){
  s=String(s).trim().replace(',','.');if(s==='')return null;
  if(!/^\d+(\.\d+)?$/.test(s))return undefined;
  const v=Number(s);if(v<0||v>20)return undefined;return Math.round(v*100)/100;
}
function commitCell(el){
  if(isReadOnlySession())return false;
  const cls=curClass();if(!cls)return false;
  const v=parseNote(el.value);
  if(v===undefined){el.classList.add('bad');toast('Note invalide : saisissez un nombre entre 0 et 20.','err');return false}
  el.classList.remove('bad');
  const sub=cls.subjects.find(s=>s.id===el.dataset.sub);if(!sub||!canEdit(cls,sub))return false;
  const old=getG(cls,el.dataset.sid,sub.id);const oldV=old?old[+el.dataset.seq]:null;
  if(oldV!=null && oldV!==v){if(!confirm('Modifier la note de '+cls.students.find(s=>s.id===el.dataset.sid).name+' — '+sub.name+' (S'+(+el.dataset.seq+1)+') de '+String(oldV).replace('.',',')+' en '+(v==null?'vide':String(v).replace('.',','))+' ?')){el.value=oldV==null?'':String(oldV).replace('.',',');return false}}
  setG(cls,el.dataset.sid,sub.id,+el.dataset.seq,v);
  el.value=v==null?'':String(v).replace('.',',');
  if(v!=null&&v<10)el.classList.add('low');else el.classList.remove('low');
  dirty();return true;
}

/* --- Statistiques --- */
const BINS=[['< 5',0,5],['5 à 8',5,8],['8 à 10',8,10],['10 à 12',10,12],['12 à 14',12,14],['14 à 16',14,16],['16 et +',16,21]];
function statsData(cls,t){
  const res=getRes(cls,t),list=cls.students;
  const rk=res.ranked.map(s=>({s,a:res.per[s.id].avg})).sort((x,y)=>y.a-x.a);
  const avgs=rk.map(x=>x.a);
  const bins=BINS.map(([l,lo,hi])=>({l,lo,n:avgs.filter(a=>a>=lo&&a<hi).length}));
  const bySex=['M','F'].map(k=>{const a=rk.filter(x=>x.s.sex===k).map(x=>x.a);return{k,n:list.filter(s=>s.sex===k).length,avg:mean(a),pass:a.length?a.filter(v=>v>=10).length/a.length:null}});
  const subs=cls.subjects.map(sub=>{
    const v=list.map(s=>res.per[s.id].m[sub.id]).filter(x=>x!=null);
    return{sub,n:v.length,avg:mean(v),min:v.length?Math.min(...v):null,max:v.length?Math.max(...v):null,pass:v.length?v.filter(x=>x>=10).length/v.length:null};
  });
  const evo=[1,2,3].map(k=>getRes(cls,k).classAvg);
  return{res,rk,avgs,bins,bySex,subs,evo,mean:mean(avgs),med:median(avgs),pass:avgs.length?avgs.filter(a=>a>=10).length/avgs.length:null};
}
function statsTab(cls){
  initLessonsForClass(cls);
  const t=S.trim,D=statsData(cls,t);
  let h='';
  // Panel statistiques progression leçons pour admin/PP
  if(isAdmin()||cls.ppId===ME.id){
    let totalPlanned=0,totalDone=0,subCount=0;
    h+='<div class="panel"><h3>Progression des leçons par matière</h3><div class="tw"><table class="t"><thead><tr><th>Matière</th><th>Enseignant</th><th class="num">Prévues</th><th class="num">Faites</th><th style="width:260px">Progression</th></tr></thead><tbody>';
    for(const sub of cls.subjects){
      const ls=cls.lessons[sub.id]||{planned:0,done:0};
      totalPlanned+=ls.planned;totalDone+=ls.done;subCount++;
      const pct=ls.planned>0?Math.min(100,Math.round(ls.done/ls.planned*100)):0;
      const teacher=DB.users.find(u=>u.id===sub.teacherId);

/* ---------- Import des élèves ---------- */
const SEXM=['M','H','G','GARCON','GARÇON','MASCULIN','MALE'],SEXF=['F','FILLE','FEMININ','FÉMININ','FEMALE'];
function parseStudents(text){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    let cells=/[\t;]/.test(line)?line.split(/[\t;]/):(line.includes(',')?line.split(','):[line]);
    cells=cells.map(c=>c.trim()).filter(Boolean);
    let sex='',parts=[];
    for(const c of cells){
      const u=c.toUpperCase();
      if(SEXM.includes(u)){sex='M';continue}
      if(SEXF.includes(u)){sex='F';continue}
      if(/^\d{1,4}[.)]?$/.test(c))continue;
      if(/^(N°|N°\.|NO|NUM[ÉE]RO|NOMS?( ET PR[ÉE]NOMS?)?|PR[ÉE]NOMS?|NAMES?|SEXE|GENRE|MATRICULE)$/i.test(c))continue;
      if(/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}$/.test(c))continue;
      parts.push(c.replace(/^\d{1,4}\s*[.)\-]\s+/,''));
    }
    const name=parts.join(' ').replace(/\s+/g,' ').trim().toLocaleUpperCase('fr');
    if(name.length<2)continue;
    if(/^(NOMS?( ET PR[ÉE]NOMS?)?|NAMES?|N°|NO)$/.test(name))continue;
    out.push({name,sex});
  }
  return out;
}
let IMP=[];
function importPreview(text){

  const ok=IMP.filter(x=>!x.dup).length,dup=IMP.length-ok;
  $('#imp-prev').innerHTML=IMP.length?'<p class="small"><b>'+ok+'</b> élève'+(ok>1?'s':'')+' à ajouter'+(dup?' · <span class="badge warn">'+dup+' déjà présent'+(dup>1?'s':'')+' (ignoré'+(dup>1?'s':'')+')</span>':'')+'</p><div class="tw" style="max-height:230px;overflow:auto"><table class="t"><tbody>'+IMP.map((x,i)=>'<tr><td style="width:40px">'+(i+1)+'</td><td'+(x.dup?' class="muted" style="text-decoration:line-through"':'')+'>'+esc(x.name)+'</td><td style="width:60px">'+(x.sex||'')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="small muted">Rien à importer pour le moment.</p>';

function loadDemo(){
  const cls=newClass('6e','6e (exemple)');
  const sn=['MBALLA','FOTSO','NJOYA','TCHAMBA','ESSOMBA','KAMGA','NKOULOU','BELLO','ATANGANA','MOUKOKO','TCHOUMI','ONANA'];
  const gn=['Arnaud','Sandrine','Michel','Grace','Brice','Laure','Junior','Estelle','Franck','Mireille','Cédric','Nadine','Prisca','Yannick'];
  const used=new Set();
  while(cls.students.length<14){const n=(sn[Math.floor(Math.random()*sn.length)]+' '+gn[Math.floor(Math.random()*gn.length)]).toLocaleUpperCase('fr');if(used.has(n))continue;used.add(n);cls.students.push({id:uid(),name:n,sex:Math.random()<.5?'M':'F',mat:genMat(),dob:'',pob:'',sessionTag:'N'})}
  cls.students.sort(cmpName);
  cls.students.slice(0,3).forEach((s,i)=>s.photo='sample:'+i);
  for(const s of cls.students){const lvl=6+Math.random()*8;for(const sub of cls.subjects){
    if(sub.name==='ALLEMAND'&&Math.random()<.5)continue;if(sub.name==='ESPAGNOL'&&cls.grades[s.id]&&cls.grades[s.id][cls.subjects.find(x=>x.name==='ALLEMAND').id])continue;
    for(let q=0;q<4;q++){const v=Math.max(0,Math.min(20,Math.round((lvl+(Math.random()*8-4))*4)/4));setG(cls,s.id,sub.id,q,v)}}}
  DB.classes.push(cls);dirty();return cls;
}

document.addEventListener('paste',e=>{
  const el=e.target;if(!el.classList||!el.classList.contains('cell'))return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');
  if(!/[\n\t]/.test(txt.trim()))return;
  e.preventDefault();
  const rows=txt.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(r=>r.split('\t'));
  const r0=+el.dataset.r,c0=+el.dataset.c;let n=0,bad=0;
  rows.forEach((row,i)=>row.forEach((v,j)=>{
    const t=$('.cell[data-r="'+(r0+i)+'"][data-c="'+(c0+j)+'"]');if(!t)return;
    t.value=v.trim();if(commitCell(t))n++;else bad++;
  }));
  refreshSummary();if(n)toast(n+' note'+(n>1?'s collées':' collée')+(bad?' ('+bad+' invalide'+(bad>1?'s':'')+')':'')+'.',bad?'':'ok');
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(isReadOnlySession()){toast('Cette session est archivée et consultable en lecture seule.','err');return;}
  const fd=Object.fromEntries(new FormData(f).entries()),err=m=>{const x=$('#fe',f.closest('.modal')||document);if(x)x.textContent=m};
  const kind=f.dataset.form;
  if(kind==='setup'){if(!confirm('Créer le compte administrateur et commencer ?'))return;
    const un=fd.username.trim().toLowerCase();if(!/^[a-z0-9._-]{2,}$/.test(un))return err('Identifiant : lettres, chiffres, point ou tiret (2 caractères minimum), sans espace.');
    const salt=uid();DB.school.name=fd.school.trim()||DB.school.name;
    const u={id:uid(),name:fd.name.trim(),username:un,phone:'',role:'admin',salt,hash:await hashPw(fd.pw,salt)};
    DB.users.push(u);dirty();saveNow();ME=u;try{sessionStorage.setItem(SKEY,u.id)}catch(x){}render();
  }else if(kind==='login'){
    const u=DB.users.find(x=>x.username===fd.username.trim().toLowerCase());
    if(!u||!verifyPw(fd.pw,u.salt,u.hash))return err(DB.demoMode?'Identifiant ou mot de passe incorrect. Vérifiez admin / admin1234 ou utilisez « Réparer l’accès démo » sans effacer vos données.':'Identifiant ou mot de passe incorrect.');
    ME=u;try{sessionStorage.setItem(SKEY,u.id)}catch(x){}S.sessionId=null;S.closeState=null;S.simulationState=null;S.view='dash';render();
  }else if(kind==='pw'){if(!confirm('Changer le mot de passe ?'))return;
    if(!verifyPw(fd.old,ME.salt,ME.hash))return err('Le mot de passe actuel est incorrect.');
    ME.salt=uid();ME.hash=await hashPw(fd.new,ME.salt);dirty();render();toast('Mot de passe modifié.','ok');
  }else if(kind==='teacher'){if(!confirm('Enregistrer cet enseignant ?'))return;
    const un=fd.username.trim().toLowerCase();if(!/^[a-z0-9._-]{2,}$/.test(un))return err('Identifiant : lettres, chiffres, point ou tiret, sans espace.');
    const id=f.dataset.id;if(DB.users.some(u=>u.username===un&&u.id!==id))return err('Cet identifiant est déjà utilisé.');
    let u=id&&DB.users.find(x=>x.id===id);
    if(!u){u={id:uid(),role:'prof'};DB.users.push(u)}
    u.name=fd.name.trim();u.username=un;u.phone=fd.phone.trim();
    if(fd.pw){u.salt=uid();u.hash=await hashPw(fd.pw,u.salt)}
    dirty();closeModal();render();
    if(fd.pw)toast('Enregistré. Identifiant : '+un+' · mot de passe : '+fd.pw,'ok');
  }else if(kind==='newclass'){if(!confirm('Créer cette classe ?'))return;
    const c=newClass(fd.preset,fd.name.trim());DB.classes.push(c);dirty();closeModal();S.view='class';S.classId=c.id;S.tab='eleves';render();
  }else if(kind==='student'){if(!confirm('Enregistrer cet élève ?'))return;
    const cls=curClass(),name=fd.name.trim().replace(/\s+/g,' ').toLocaleUpperCase('fr'),id=f.dataset.id;
    if(cls.students.some(s=>s.name===name&&s.id!==id))return err('Un élève porte déjà ce nom dans cette classe.');
    const mat=fd.mat.trim()||genMat();
    const photoInput=f.querySelector('input[data-file="photo"]');let photo='';

    if(id){const s=cls.students.find(x=>x.id===id),legacySample=!Object.prototype.hasOwnProperty.call(s,'photo')?demoPhotoIndex(cls,s):-1;s.name=name;s.sex=fd.sex;s.mat=mat;s.dob=fd.dob||'';s.pob=(fd.pob||'').trim();if(photo)s.photo=photo;else if(legacySample>=0&&legacySample<DEMO_PHOTOS.length)s.photo='sample:'+legacySample}else cls.students.push({id:uid(),name,sex:fd.sex,mat:mat,dob:fd.dob||'',pob:(fd.pob||'').trim(),photo:photo||'',sessionTag:'N'});
    cls.students.sort(cmpName);dirty();closeModal();render();

    const last=cls.subjects[cls.subjects.length-1];cls.subjects.push({id:uid(),name:'NOUVELLE MATIÈRE',coef:1,group:g,opt:false,teacherId:''});dirty();closeModal();render();

function handleFile(el){
  const file=el.files&&el.files[0];if(!file)return;const kind=el.dataset.file;
  const bad=m=>{const x=$('#fe');if(x)x.textContent=m;else toast(m,'err')};
  if(kind==='header'){if(!confirm('Remplacer l’en-tête des bulletins par cette image ?'))return;
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const w=Math.min(1400,img.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(img.height*w/img.width);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);DB.school.header=c.toDataURL('image/jpeg',.88);URL.revokeObjectURL(url);dirty();render();toast('En-tête remplacé.','ok')};
    img.onerror=()=>toast('Image illisible.','err');img.src=url;return;
  }
  const rd=new FileReader();
  rd.onerror=()=>bad('Lecture du fichier impossible.');
  rd.onload=()=>{
    const txt=String(rd.result);
    if(kind==='imp'){const ta=$('#imp-text');ta.value=txt;importPreview(txt);return}
    let d;try{d=JSON.parse(txt)}catch(e){return bad('Ce fichier n’est pas un fichier JSON valide.')}
    if(kind==='restore'){if(!confirm('Restaurer cette sauvegarde (les données actuelles seront remplacées) ?'))return;
      if(!d||!d.school||!Array.isArray(d.users)||!Array.isArray(d.classes)||!d.users.some(u=>u.role==='admin'))return bad('Ce fichier n’est pas une sauvegarde complète de cette application.');
      DB=d;calcCache={};S.sessionId=null;S.closeState=null;S.simulationState=null;saveNow();closeModal();ME=null;try{sessionStorage.removeItem(SKEY)}catch(e){}render();toast('Sauvegarde restaurée : connectez-vous.','ok');
    }else if(kind==='merge'){if(!confirm('Fusionner les notes de ce fichier dans les classes correspondantes ?'))return;
      if(!d||d.type!=='mbi-notes'||!Array.isArray(d.classes))return bad('Ce fichier n’est pas un fichier de notes exporté par un enseignant.');
      let n=0,skipped=0;
      for(const fc of d.classes){const c=DB.classes.find(x=>x.id===fc.id);if(!c){skipped++;continue}
        for(const sid in fc.grades){if(!c.students.some(s=>s.id===sid))continue;
          for(const sub in fc.grades[sid]){if(!c.subjects.some(s=>s.id===sub))continue;
            fc.grades[sid][sub].forEach((v,i)=>{if(v!=null&&i<5&&typeof v==='number'&&v>=0&&v<=20){setG(c,sid,sub,i,v);n++}})}}}
      dirty();closeModal();render();toast(n+' note'+(n>1?'s importées':' importée')+(skipped?' · '+skipped+' classe(s) du fichier introuvable(s)':'')+'.',n?'ok':'');
    }
  };
  rd.readAsText(file,'utf-8');
}
