<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion des bulletins</title>
<style>
:root{
  --ink:#12263f; --ink-2:#34495e; --muted:#6b7a8c; --line:#d9e0e8; --line-2:#eaeef3;
  --bg:#f1f4f8; --surface:#fff; --brand:#1b3f8f; --brand-d:#122c66; --green:#4fa824; --green-d:#3c8a18;
  --red:#c0262d; --amber:#b7791f; --amber-bg:#fdf3dc; --ok-bg:#e6f4dc; --bad-bg:#fbe4e4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
a{color:var(--brand)}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px;border-radius:4px}
#printRoot{display:none}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{background:#f4f7fb;border-color:#b9c5d3}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:var(--green-d)}
.btn.danger{color:var(--red);border-color:#e7b9bb}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#e8edf4}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* forms */
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:12px}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid #c3ceda;border-radius:7px;background:#fff;font-weight:400;font-size:15px}
.inp.sm{padding:5px 8px;font-size:14px;margin:0}
label.f textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px}

.auth-box{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px 30px 24px;box-shadow:0 12px 40px rgba(18,38,63,.08)}
.auth-box img{width:100%;height:auto;display:block;margin-bottom:14px}
.auth-box h1{font-size:25px;margin-bottom:4px}
.auth-box p{margin:0 0 18px;color:var(--muted)}

/* shell */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--ink);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px;font-weight:600;min-width:0}
.brand .dot{width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-weight:700;font-family:var(--sans);font-size:15px;color:#fff;flex:none}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tri{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;margin-left:auto}
.tri button{border:0;background:transparent;color:#cfd9e6;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.tri button.on{background:#fff;color:var(--ink)}
.me{display:flex;align-items:center;gap:10px;font-size:13px}
.me .role{display:inline-block;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:99px;font-size:12px}
.me .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.me .btn:hover{background:rgba(255,255,255,.1)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 52px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.side h4{margin:16px 10px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.side a.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer}
.side a.nav:hover{background:#eef2f7}
.side a.nav.on{background:var(--brand);color:#fff}
.side a.nav small{font-weight:500;opacity:.7}
main{padding:24px 28px 60px;min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:28px}
.page-h p{margin:2px 0 0;color:var(--muted)}
.session-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.panel>h3{font-size:18px;margin-bottom:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs a{padding:9px 16px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--brand);border-bottom-color:var(--green)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.notice{padding:10px 14px;border-radius:8px;background:var(--amber-bg);color:#7a4f10;font-size:14px;margin-bottom:14px;border:1px solid #f0dca8}
.notice.info{background:#e8f0fc;color:#1d3d78;border-color:#c8d8f3}

/* tables */
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);background:#fafbfd;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:hover td{background:#f8fafc}
table.t .num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
.tw table.t th:first-child,.tw table.t td:first-child{padding-left:14px}
.avg{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.low{color:var(--red)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2f7;color:var(--ink-2)}
.badge.ok{background:var(--ok-bg);color:#2f6b12}
.badge.bad{background:var(--bad-bg);color:#9c1c22}
.badge.warn{background:var(--amber-bg);color:#7a4f10}
.student-tag{display:inline-block;min-width:30px;text-align:center;margin-right:6px;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:700;vertical-align:middle;background:#e8f0fc;color:#1d3d78}
.student-tag.na{background:var(--ok-bg);color:#2f6b12}
.student-tag.ancien{background:var(--amber-bg);color:#7a4f10}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.b>i{background:var(--brand)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:18px;overflow:hidden}
.kpi{padding:14px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}

/* grid (saisie des notes) */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:calc(100vh - 250px)}
table.grid{border-collapse:separate;border-spacing:0;font-size:14px}
table.grid th,table.grid td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0;text-align:center;background:#fff}
table.grid thead th{position:sticky;top:0;z-index:3;background:#f4f7fb;font-weight:600;padding:6px 6px;font-size:12.5px;border-bottom:2px solid var(--line)}
table.grid thead tr:first-child th{height:54px;box-sizing:border-box}
table.grid thead tr:nth-child(2) th{top:54px;z-index:3;font-weight:500;color:var(--muted);padding:3px}
table.grid th.sub{min-width:116px;border-left:2px solid var(--line)}
table.grid th.sub small{display:block;font-weight:500;color:var(--muted)}
table.grid th.sub.lock{background:#eceff3;color:#8794a3}
.stk0,.stk1{position:sticky;z-index:2;background:#fff!important}
.stk0{left:0;min-width:40px;width:40px}
.stk1{left:40px;min-width:230px;text-align:left!important;padding:0 10px!important;font-weight:600;white-space:nowrap;border-right:2px solid var(--line)!important}
thead .stk0,thead .stk1{z-index:5;background:#f4f7fb!important}
td.s-sep{border-left:2px solid var(--line)}
input.cell{width:58px;border:0;text-align:center;padding:8px 2px;background:transparent;font-variant-numeric:tabular-nums}
input.cell:focus{background:#e9f1ff;outline:2px solid #5b8def;outline-offset:-2px}
input.cell.bad{background:var(--bad-bg)}
td.lk{background:#f6f7f9!important;color:#6b7a8c;width:58px;font-variant-numeric:tabular-nums}
td.sumc{font-weight:700;min-width:64px;padding:0 8px;background:#fcfcf6}
.empty-row td{background:#fffdf0}

/* modal + toast */
.backdrop{position:fixed;inset:0;background:rgba(18,38,63,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:min(520px,100%);padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(900px,100%)}
.modal.xl{width:min(860px,100%);background:#e6eaf0;padding:16px 18px}
.modal h2{font-size:21px;margin-bottom:12px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toastRoot{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px;font-size:14px}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green-d)}

/* stats */
.hist{display:grid;gap:7px}
.hist .hr{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.hist .hb{height:20px;background:var(--line-2);border-radius:4px;overflow:hidden}
.hist .hb i{display:block;height:100%;background:var(--brand)}
.hist .hb i.lo{background:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chk{display:flex;gap:7px;align-items:center;font-weight:500;font-size:14px;cursor:pointer}

/* ===== bulletin (écran + impression) ===== */
.bulletin{width:190mm;margin:0 auto 14px;background:#fff;color:#000;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:10.5pt;padding:0;line-height:1.25}
.xl .bulletin{padding:6mm 7mm;width:100%;max-width:210mm;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.bulletin .b-head{display:block;width:100%;height:auto}
.bulletin .b-title{font-family:inherit;text-align:center;font-size:20pt;font-weight:400;letter-spacing:.3px;margin:3.5mm 0 1.5mm}
.bulletin .b-year{font-style:italic;font-size:12pt;display:flex;justify-content:space-between;align-items:baseline;margin:0 0 1.5mm;text-align:left}
.bulletin .b-year .tr{font-style:normal;font-weight:700;font-size:11pt}
.bulletin .b-profile{display:flex;align-items:center;gap:4mm;margin:1mm 0 1.5mm;break-inside:avoid;page-break-inside:avoid}
.bulletin .b-profile-info{flex:1;min-width:0;text-align:left}
.bulletin .b-profile .b-line{display:flex;gap:3mm;align-items:baseline;margin:.7mm 0;text-align:left}
.bulletin .b-line .lbl{width:31mm;text-align:left;flex:none}
.bulletin .b-photo{display:block;flex:none;width:28mm;height:35mm;object-fit:cover;border:1px solid #000;box-sizing:border-box}
.bulletin .b-photo-empty{display:flex;align-items:center;justify-content:center;color:#777;font-size:8pt;background:#f7f7f7}
.bulletin .b-line .val{font-weight:700}
.bulletin .b-line .val.big{font-size:12.5pt}
.bulletin .b-line .cel{width:auto;margin-left:auto}
.bulletin table.b-table{width:100%;border-collapse:collapse;margin-top:2.5mm;table-layout:fixed}
.bulletin .b-table th,.bulletin .b-table td{border:1px solid #000;padding:1.1mm 1.4mm;font-size:10pt;text-align:center;overflow:hidden}
.bulletin .b-table th{font-weight:700;font-size:10pt}
.bulletin .b-table td.mt{text-align:left;white-space:normal}
.bulletin .b-table td.mt .sub-teacher{font-size:8.5pt;font-weight:400;white-space:normal}
.bulletin .b-table td.m{color:#c00000;font-weight:700}
.bulletin .b-table th:last-child,.bulletin .b-table td.ob{text-align:left;padding-left:2mm}
.bulletin .b-table td.ob{font-weight:700}
.bulletin .b-table tr.grp td{font-weight:700;background:#eeeeee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulletin .b-table tr.grp td.mt{text-align:center}
.bulletin .b-table tr.tot td{font-weight:700}
.bulletin .b-legend{font-size:8.5pt;margin-top:1.2mm}
.bulletin .b-foot{display:flex;justify-content:space-between;gap:2mm;align-items:flex-start;margin-top:3mm}
.bulletin .b-foot-pair{display:flex;align-items:stretch;gap:2mm;flex:none}
.bulletin .b-sum{border-collapse:collapse;border:1px solid #000}
.bulletin .b-mentions{border:1px solid #000;padding:1mm 2mm;min-width:42mm;box-sizing:border-box;font-size:9.5pt;align-self:stretch}
.bulletin .b-mentions-title{text-align:center;font-weight:700;margin-bottom:1mm}
.bulletin .b-mentions-option{display:flex;align-items:center;gap:1.5mm;margin-top:1mm;white-space:nowrap}
.bulletin .b-mentions-check{display:inline-block;width:3.5mm;height:3.5mm;border:1px solid #000;box-sizing:border-box;flex:none}
.bulletin .b-disciple{border:1px solid #000;padding:1mm 1.5mm;width:28mm;min-width:28mm;box-sizing:border-box;font-size:9.5pt;align-self:stretch}
.bulletin .b-disciple-title{text-align:center;font-weight:700;margin-bottom:1mm}
.bulletin .b-disciple-row{display:grid;grid-template-columns:7mm 1fr;gap:1mm;align-items:end;margin-top:1mm;white-space:nowrap}
.bulletin .b-disciple-write{display:block;width:100%;height:4mm;border-bottom:1px solid #000;box-sizing:border-box}

.bulletin .b-sum td{padding:.45mm .9mm;font-size:9.5pt}
.bulletin .b-sum td.l{text-align:left;padding-right:1mm;white-space:nowrap}
.bulletin .b-sum td.v{font-weight:700;text-align:right;min-width:0;white-space:nowrap}
.bulletin .b-sum td.v.r{color:#c00000}
.bulletin .b-sum .b-den{color:#000;font-weight:400}
.bulletin .b-sign{text-align:left;font-size:10.5pt;padding:1.5mm 2mm;border:1px solid #000;min-width:62mm;box-sizing:border-box}
.bulletin .b-sign .pr{margin-top:1.5mm;font-weight:700}
.bulletin .b-sign .nm{margin-top:12mm;font-size:10pt}
.bulletin .b-lines{margin-top:3mm;min-height:14mm;line-height:7mm;font-size:10.5pt;white-space:pre-wrap;word-break:break-word;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 6.2mm,#000 6.2mm,#000 6.35mm);background-size:100% 7mm;padding:0 1mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{width:190mm;margin:0 auto;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#000;font-size:10.5pt}
.sheet h2{font-family:inherit;text-align:center;font-size:17pt;font-weight:600;margin:4mm 0 1mm}
.sheet .sub{text-align:center;margin-bottom:4mm}
.sheet table{width:100%;border-collapse:collapse;margin-bottom:5mm}
.sheet th,.sheet td{border:1px solid #000;padding:1mm 2mm;font-size:10pt}
.sheet th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .k{display:flex;flex-wrap:wrap;gap:3mm 8mm;margin-bottom:5mm}

@media print{
  @page{size:A4;margin:9mm}
  html,body{background:#fff!important;height:auto}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
  #printRoot .bulletin{margin:0 auto;box-shadow:none;break-after:page;page-break-after:always}
  #printRoot .bulletin:last-child{break-after:auto;page-break-after:auto}
  #printRoot .sheet{break-after:page}
  #printRoot .sheet:last-child{break-after:auto}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow:auto;padding:8px}
  .side h4{display:none}
  .side a.nav{white-space:nowrap}
  main{padding:16px 12px 50px}
  .topbar{flex-wrap:wrap;gap:8px}
  .tri{margin-left:0}
  .two{grid-template-columns:1fr}
  .kpi{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function compactStudentPhoto(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type||!file.type.startsWith('image/'))return reject(new Error('Choisissez un fichier image valide.'));
    if(file.size>10*1024*1024)return reject(new Error('La photo dépasse la taille autorisée de 10 Mo.'));
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error('Lecture de la photo impossible.'));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Cette image ne peut pas être ouverte.'));
      img.onload=()=>{
        const target=4/5;let sx=0,sy=0,sw=img.width,sh=img.height;
        if(sw/sh>target){sw=sh*target;sx=(img.width-sw)/2}else{sh=sw/target;sy=(img.height-sh)/2}
        const c=document.createElement('canvas');c.width=240;c.height=300;
        const ctx=c.getContext('2d');if(!ctx)return reject(new Error('Traitement de la photo impossible.'));
        ctx.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',.76));
      };
      img.src=String(rd.result);
    };
    rd.readAsDataURL(file);
  });
}

function sha256Hex(text){
  const bytes=new TextEncoder().encode(text),bitLength=bytes.length*8;
  const totalLength=Math.ceil((bytes.length+9)/64)*64,data=new Uint8Array(totalLength);
  data.set(bytes);data[bytes.length]=0x80;
  const view=new DataView(data.buffer);
  view.setUint32(totalLength-8,Math.floor(bitLength/0x100000000),false);
  view.setUint32(totalLength-4,bitLength>>>0,false);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for(let off=0;off<totalLength;off+=64){
    const w=new Uint32Array(64);
    for(let i=0;i<16;i++)w[i]=view.getUint32(off+i*4,false);
    for(let i=16;i<64;i++){
      const x=w[i-15],y=w[i-2],s0=rotr(x,7)^rotr(x,18)^(x>>>3),s1=rotr(y,17)^rotr(y,19)^(y>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+SHA256_K[i]+w[i])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    h=[(h[0]+a)>>>0,(h[1]+b)>>>0,(h[2]+c)>>>0,(h[3]+d)>>>0,(h[4]+e)>>>0,(h[5]+f)>>>0,(h[6]+g)>>>0,(h[7]+hh)>>>0];
  }
  return h.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function legacyHashPw(pw,salt){
  const data=new TextEncoder().encode(salt+':'+pw);
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(const b of data){h1=Math.imul(h1^b,2654435761);h2=Math.imul(h2^b,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'f'+(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}

  const input=salt+':'+pw;
  return sha256Hex(input)===stored||legacyHashPw(pw,salt)===stored;
}

const seqIdx=t=>t===3?[4]:[(t-1)*2,(t-1)*2+1];
function getG(cls,sid,sub){return(cls.grades[sid]&&cls.grades[sid][sub])||null}
function setG(cls,sid,sub,i,v){const g=cls.grades[sid]||(cls.grades[sid]={});const a=g[sub]||(g[sub]=[null,null,null,null,null]);a[i]=v}
function subAvg(cls,sid,sub,t){const g=getG(cls,sid,sub);if(!g)return null;const v=seqIdx(t).map(i=>g[i]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function compute(cls,t){
  const per={};
  for(const s of cls.students){
    const m={};let cs=0,pts=0;
    for(const sub of cls.subjects){const v=subAvg(cls,s.id,sub.id,t);m[sub.id]=v;if(v!=null){cs+=sub.coef;pts+=v*sub.coef}}
    per[s.id]={m,cs,pts,avg:cs>0?pts/cs:null,sr:{}};
  }
  const key=s=>Math.round(per[s.id].avg*100);
  const ranked=cls.students.filter(s=>per[s.id].avg!=null);
  const keys=ranked.map(key).sort((a,b)=>b-a);
  for(const s of ranked){const k=key(s);per[s.id].rank={r:keys.indexOf(k)+1,tie:keys.filter(x=>x===k).length>1}}
  for(const sub of cls.subjects){
    const ks=cls.students.map(s=>per[s.id].m[sub.id]).filter(v=>v!=null).map(v=>Math.round(v*100)).sort((a,b)=>b-a);
    for(const s of cls.students){const v=per[s.id].m[sub.id];if(v!=null){const k=Math.round(v*100);per[s.id].sr[sub.id]={r:ks.indexOf(k)+1,tie:ks.filter(x=>x===k).length>1}}}
  }
  const avgs=ranked.map(s=>per[s.id].avg);
  return{per,ranked,classAvg:avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null};
}
function getRes(cls,t){const k=cls.id+':'+t;return calcCache[k]||(calcCache[k]=compute(cls,t))}
function bulletinRows(cls,sid,res,t){
  const rows=[];let cur=null,gc=0,gp=0;
  const flush=()=>{if(cur)rows.push({type:'group',label:cur,coef:gc,pts:gp,avg:gc>0?gp/gc:null});gc=0;gp=0};
  const seqs=seqIdx(t);
  for(const sub of cls.subjects){
    const g=(sub.group||'').trim();
    if(g!==(cur||'')){flush();cur=g||null}
    const gr=getG(cls,sid,sub.id),m=res.per[sid].m[sub.id];
    rows.push({type:'sub',sub,ns:seqs.map(i=>gr?gr[i]:null),n1:gr?gr[seqs[0]]:null,n2:seqs.length>1?(gr?gr[seqs[1]]:null):null,m,coef:sub.coef,pts:m!=null?m*sub.coef:null,rank:res.per[sid].sr[sub.id]});
    if(m!=null&&cur){gc+=sub.coef;gp+=m*sub.coef}
  }
  flush();return rows;
}
function missingCount(cls,sid,t){
  let n=0;const seqs=seqIdx(t);
  for(const sub of cls.subjects){if(sub.opt)continue;const g=getG(cls,sid,sub.id);if(!g||seqs.some(i=>g[i]==null))n++}
  return n;
}
function completion(cls,t){
  const subs=cls.subjects.filter(s=>!s.opt);const seqs=seqIdx(t);const tot=cls.students.length*subs.length*seqs.length;if(!tot)return null;
  let f=0;
  for(const s of cls.students)for(const sub of subs){const g=getG(cls,s.id,sub.id);if(g)for(const i of seqs)if(g[i]!=null)f++}
  return f/tot;
}

/* ---------- Bulletin ---------- */
function bulletinHtml(cls,sid,t){
  const L=LB[cls.lang||'fr'],sc=viewSchool(),st=cls.students.find(s=>s.id===sid);
  const res=getRes(cls,t),P=res.per[sid],rows=bulletinRows(cls,sid,res,t);
  const hd={n1:L.n1,n2:L.n2,m:L.m,coef:L.coef,pts:L.pts};
  let b='';
  for(const r of rows){
    if(r.type==='group'){
      b+='<tr class="grp"><td class="mt" colspan="3">'+esc(L.grp+r.label)+'</td>'+L.order.filter(k=>k!=='n1'&&k!=='n2').map(k=>'<td style="color:'+(k==='m'&&r.avg!=null&&r.avg<10?'#c00000':'inherit')+'">'+(k==='m'?fmt(r.avg):k==='coef'?(r.coef||''):fmt(r.pts))+'</td>').join('')+'<td></td><td></td></tr>';
    }else{
      const cell={n1:fmt(r.n1),n2:fmt(r.n2),m:fmt(r.m),coef:r.coef,pts:fmt(r.pts)};
      const teacher=viewUsers().find(u=>u.id===r.sub.teacherId);b+='<tr><td class="mt"><span>'+esc(r.sub.name)+'</span>'+(teacher?' <span class="sub-teacher">/&nbsp;&nbsp;'+esc(teacher.name)+'</span>':'')+'</td>'+L.order.map(k=>{
        const val=k==='n1'?r.n1:k==='n2'?r.n2:k==='m'?r.m:null;
        let style='';
        if(k==='m')style='font-weight:700;';
        if(val!=null&&val<10)style+='color:#c00000;';
        return '<td style="'+style+'">'+cell[k]+'</td>';
      }).join('')+'<td>'+rankStr(r.rank)+'</td><td class="ob">'+obs(r.m)+'</td></tr>';
    }
  }
  const cells=L.order.filter(k=>k!=='n1'&&k!=='n2').map(k=>'<td style="'+(k==='m'?'font-weight:700;'+(P.avg!=null&&P.avg<10?'color:#c00000;':''):'')+'">'+(k==='coef'?(P.cs||''):k==='pts'?fmt(P.pts):(L.totalAvg?fmt(P.avg):''))+'</td>').join('');
  b+='<tr class="tot"><td class="mt" colspan="3" style="text-align:center">'+L.total+'</td>'+cells+'<td></td><td></td></tr>';
  const prev=[];for(let k=1;k<t;k++){const a=getRes(cls,k).per[sid];prev.push(a?a.avg:null)}
  let sums='<tr><td class="l">'+L.avgT+'</td><td class="v r" style="color:'+(P.avg!=null&&P.avg<10?'#c00000':'inherit')+'">'+fmt1(P.avg)+'<span class="b-den">&nbsp;/20</span></td></tr>'+
   '<tr><td class="l">'+L.rankL+'</td><td class="v">'+(P.rank?rankStr(P.rank):'—')+'<span class="b-den">&nbsp;/'+cls.students.length+'</span></td></tr>'+
   '<tr><td class="l">'+L.avgG+'</td><td class="v" style="color:'+(res.classAvg!=null&&res.classAvg<10?'#c00000':'inherit')+'">'+fmt1(res.classAvg)+'<span class="b-den">&nbsp;/20</span></td></tr>';
  prev.forEach((a,i)=>{sums+='<tr><td class="l">'+L.prev(i+1)+'</td><td class="v" style="color:'+(a!=null&&a<10?'#c00000':'inherit')+'">'+fmt1(a)+'<span class="b-den">&nbsp;/20</span></td></tr>'});
  if(t===3&&prev.every(a=>a!=null)&&P.avg!=null){const ann=(prev[0]+prev[1]+P.avg)/3;sums+='<tr><td class="l">'+L.annual+'</td><td class="v" style="color:'+(ann<10?'#c00000':'inherit')+'">'+fmt1(ann)+'<span class="b-den">&nbsp;/20</span></td></tr>'}
  const remark=(cls.remarks[sid]&&cls.remarks[sid]['t'+t])||'';
  const pp=ppName(cls),tel=ppTel(cls);
  const photoSrc=studentPhotoSrc(cls,st);
  const photoHtml=photoSrc?'<img class="b-photo" src="'+photoSrc+'" alt="Photo de '+esc(st.name)+'">':'<div class="b-photo b-photo-empty">Photo</div>';
  return '<section class="bulletin"><img class="b-head" src="'+headerSrc()+'" alt="">'+
   '<h2 class="b-title">'+L.title(t)+'</h2>'+
   '<div class="b-profile"><div class="b-profile-info">'+
   '<div class="b-year"><span>'+L.year+'&nbsp;&nbsp;'+esc(sc.year)+'</span><span class="tr">'+L.tr(t)+'</span></div>'+
   '<div class="b-line"><span class="lbl">'+L.cls+'</span><span class="val">'+esc(cls.name)+'</span></div>'+
   '<div class="b-line"><span class="lbl">'+L.name+'</span><span class="val big">'+esc(st.name)+'</span></div>'+
   '<div class="b-line"><span class="lbl">Né(e) le</span><span class="val">'+esc(st.dob||'—')+(st.pob?' à '+esc(st.pob):'')+'</span><span class="lbl cel">Matricule : <b>'+esc(st.mat||'—')+'</b></span></div>'+
   '<div class="b-line"><span class="lbl">'+L.pp+'</span><span class="val">'+esc(pp)+'</span><span class="lbl cel">'+L.cel+'&nbsp;&nbsp;<b>'+esc(tel)+'</b></span></div>'+
   '</div>'+photoHtml+'</div>'+
   '<table class="b-table"><colgroup><col style="width:34%">'+L.order.map(k=>'<col style="width:'+({n1:8,n2:8,m:8,coef:7,pts:10}[k])+'%">').join('')+'<col style="width:8%"><col style="width:'+(L.order.length===5?'17':'17')+'%"></colgroup>'+
   '<thead><tr><th>'+L.subject+'</th>'+L.order.map(k=>'<th>'+hd[k]+'</th>').join('')+'<th>'+L.rank+'</th><th>'+L.obs+'</th></tr></thead><tbody>'+b+'</tbody></table>'+
   '<div class="b-legend">'+esc(L.legend)+'</div>'+
   '<div class="b-foot"><div class="b-foot-pair"><table class="b-sum">'+sums+'</table><div class="b-mentions"><div class="b-mentions-title">Mentions</div><div class="b-mentions-option"><span class="b-mentions-check" aria-hidden="true"></span><span>Tableau d’honneur</span></div><div class="b-mentions-option"><span class="b-mentions-check" aria-hidden="true"></span><span>Félicitations</span></div><div class="b-mentions-option"><span class="b-mentions-check" aria-hidden="true"></span><span>Encouragement</span></div></div><div class="b-disciple"><div class="b-disciple-title">DISCIPLE</div><div class="b-disciple-row"><span>HA</span><span class="b-disciple-write" aria-hidden="true"></span></div><div class="b-disciple-row"><span>HAJ</span><span class="b-disciple-write" aria-hidden="true"></span></div><div class="b-disciple-row"><span>HANJ</span><span class="b-disciple-write" aria-hidden="true"></span></div></div></div><div class="b-sign"><div>'+esc(sc.city||'Douala')+' '+L.at+' _______________</div><div class="pr">'+L.principal+'</div><div class="nm">'+esc(sc.principal||'M. ATANGANA Jean')+'</div></div></div>'+
   '<div class="b-lines">'+esc(remark)+'</div></section>';
}

/* ---------- Sessions scolaires ---------- */
function sessionTotals(classes){return{classes:(classes||[]).length,students:(classes||[]).reduce((n,c)=>n+(c.students||[]).length,0)}}
function sessionDate(iso){if(!iso)return'—';const d=new Date(iso);return isNaN(d)?'—':d.toLocaleDateString('fr-FR')}
function sessionsHtml(){
  // Nettoie automatiquement les doublons d'archives au chargement
  if(Array.isArray(DB.sessions)){
    const seen=new Set();
    DB.sessions=DB.sessions.filter(s=>{
      if(seen.has(s.year))return false;
      seen.add(s.year);return true;
    });
  }
  const archived=archivedSessions(),tot=sessionTotals(DB.classes);
  const needActivate = DB.school.year!=='2027/2028';
  let h='<div class="page-h"><div><h1>Sessions scolaires</h1><p>Session active : <b>'+esc(DB.school.year)+'</b> — Consultez les années clôturées ou préparez la nouvelle session.</p></div>'+(needActivate?'<div class="session-actions"><button class="btn green" data-act="direct-activate" style="font-size:16px;padding:12px 24px">⚡ ACTIVER 2027/2028 EN UN CLIC</button></div>':'')+'</div>';
  if(needActivate && DB.sessions && DB.sessions.length>0){
    const hasArchive = DB.sessions.some(s=>s.year==='2026/2027');
    // Vérifier si les notes ont été effacées (classes vides de notes = essai précédent échoué)
    let anyGrades=false;
    for(let ci=0;ci<DB.classes.length;ci++){for(let sid in DB.classes[ci].grades){for(let subid in DB.classes[ci].grades[sid]){const g=DB.classes[ci].grades[sid][subid];if(g&&g.some(x=>x!=null)){anyGrades=true;break}}if(anyGrades)break}if(anyGrades)break}
    if(hasArchive){
      h+='<div class="notice" style="background:'+(anyGrades?'#e6f4dc':'#fbe4e4')+';border-color:'+(anyGrades?'#b9d89b':'#e7b9bb')+';padding:16px">';
      if(!anyGrades){
        h+='<b style="color:var(--red);font-size:16px">⚠️ LES NOTES ONT ÉTÉ EFFACÉES PAR UN ESSAI PRÉCÉDENT</b><br>Vous devez restaurer les données avant de pouvoir activer correctement :<br><br><button class="btn danger" data-act="restore-archive" style="font-size:15px;padding:10px 18px">🔄 RESTAURER LES DONNÉES 2026/2027 ET TOUTES LES NOTES</button><br><br>Le bouton Activer ne fonctionnera pas tant que les notes ne seront pas restaurées.';
      }else{
        h+='✅ Les notes sont bien présentes. Vous pouvez activer la nouvelle session. Les élèves avec moyenne <10/20 seront marqués <b>Ancien</b> (redoublent), ceux ≥10/20 seront <b>NA</b> (passent en classe supérieure).';
      }
      h+='</div>';
    }
  }
  if(isReadOnlySession())h+='<div class="notice info">Vous consultez une session archivée en lecture seule. <button class="btn sm" data-act="session-current">Revenir à la session en cours</button></div>';
  h+='<div class="panel"><h3>Session en cours <span class="badge ok">ACTIVE</span></h3><p><b>Année scolaire :</b> '+esc(DB.school.year)+' · <b>Classes :</b> '+tot.classes+' · <b>Élèves :</b> '+tot.students+'</p><button class="btn" data-act="session-current">Ouvrir la session en cours</button></div>';
  h+='<div class="panel"><h3>Sessions clôturées</h3>';
  if(!archived.length)h+='<p class="muted">Aucune session clôturée pour le moment. Les années clôturées seront conservées ici avec leurs classes, élèves, notes et bulletins.</p>';
  else h+='<div class="tw"><table class="t"><thead><tr><th>Année scolaire</th><th>Date de clôture</th><th>Classes</th><th>Élèves</th><th></th></tr></thead><tbody>'+archived.map(a=>{const n=sessionTotals(a.classes);return'<tr><td><b>'+esc(a.year)+'</b></td><td>'+sessionDate(a.closedAt)+'</td><td>'+n.classes+'</td><td>'+n.students+'</td><td class="right"><button class="btn sm" data-act="session-view" data-id="'+esc(a.id)+'">Consulter / imprimer</button></td></tr>'}).join('')+'</tbody></table></div>';
  h+='</div>';
  if(isAdmin())h+='<div class="notice">La clôture archive les données de l’année, recrée les classes pour l’année suivante et ne supprime aucune ancienne note ni aucun bulletin.</div>';
  return h;
}
function closeKey(classId,studentId){return classId+'::'+studentId}
function startCloseYear(){
  const nextClasses=DB.classes.map(c=>({sourceId:c.id,id:uid(),name:c.name,ord:c.ord})),decisions={};
  DB.classes.forEach(c=>c.students.forEach(st=>{decisions[closeKey(c.id,st.id)]={sourceClassId:c.id,studentId:st.id,decision:'',targetClassId:''}}));
  S.closeState={year:DB.school.year,nextYear:nextSchoolYear(DB.school.year),nextClasses,decisions};
}
function annualStudentAverage(cls,studentId){
  const vals=[1,2,3].map(t=>getRes(cls,t).per[studentId]?.avg).filter(v=>v!=null);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
function closePlanComplete(){
  if(!S.closeState)return false;
  return Object.values(S.closeState.decisions).every(p=>p.decision&& (p.decision!=='admis'||p.targetClassId));
}
function closeProgress(){
  if(!S.closeState)return{done:0,total:0};
  const rows=Object.values(S.closeState.decisions);
  return{done:rows.filter(p=>p.decision&&(p.decision!=='admis'||p.targetClassId)).length,total:rows.length};
}
function closeYearHtml(){
  if(!isAdmin())return'<div class="notice">Seul l’administrateur peut clôturer une session scolaire.</div>';
  if(!S.closeState)return'<div class="panel"><h2>Clôture de l’année scolaire</h2><p>Aucune préparation n’est en cours.</p><button class="btn" data-act="sessions-cancel-close">Retour aux sessions</button></div>';
  const state=S.closeState,prog=closeProgress();
  let h='<div class="page-h"><div><h1>Clôturer '+esc(state.year)+'</h1><p>La nouvelle session proposée sera <b>'+esc(state.nextYear)+'</b>.</p></div><button class="btn" data-act="sessions-cancel-close">Annuler</button></div>'+
    '<div class="notice info">Choisissez une décision pour chaque élève. Pour un élève admis, sélectionnez sa classe d’accueil parmi les classes qui seront recréées. Un redoublant reste dans sa classe ; une sortie de fin de cycle n’est pas réinscrite. Les destinations proposées sont les classes actuelles qui seront recréées ; créez d’abord toute classe d’accueil manquante. Rien n’est archivé avant votre confirmation finale.</div>'+
    '<div class="toolbar"><span id="close-progress" class="small muted">Décisions complètes : '+prog.done+' / '+prog.total+'</span><span class="grow"></span><button id="close-confirm" class="btn primary" data-act="confirm-close-year" '+(closePlanComplete()?'':'disabled')+'>Confirmer et créer '+esc(state.nextYear)+'</button></div>';
  if(!DB.classes.length)h+='<div class="panel empty"><h3>Aucune classe à recréer</h3><p>La session suivante sera créée sans classe.</p></div>';
  for(const cls of DB.classes){
    h+='<div class="panel"><h3>'+esc(cls.name)+' <span class="badge">'+cls.students.length+' élève'+(cls.students.length===1?'':'s')+'</span></h3>';
    if(!cls.students.length){h+='<p class="small muted">Aucun élève dans cette classe ; la classe sera recréée vide.</p></div>';continue}
    h+='<div class="tw"><table class="t"><thead><tr><th>Élève</th><th>Moyenne annuelle indicative</th><th>Décision</th><th>Classe d’accueil si admis</th></tr></thead><tbody>';
    [...cls.students].sort(cmpName).forEach(st=>{
      const key=closeKey(cls.id,st.id),plan=state.decisions[key],avg=annualStudentAverage(cls,st.id);
      h+='<tr><td>'+tagBadge(st)+' <b>'+esc(st.name)+'</b></td><td class="num">'+fmt1(avg)+'</td><td><select class="inp sm" data-close-choice="'+esc(key)+'"><option value="">— Choisir —</option><option value="admis" '+(plan.decision==='admis'?'selected':'')+'>Admis</option><option value="redouble" '+(plan.decision==='redouble'?'selected':'')+'>Redouble</option><option value="sorti" '+(plan.decision==='sorti'?'selected':'')+'>Sortie / fin de cycle</option></select></td><td><select class="inp sm" data-close-target="'+esc(key)+'" '+(plan.decision==='admis'?'':'disabled')+'><option value="">— Choisir une classe —</option>'+state.nextClasses.map(nc=>'<option value="'+esc(nc.id)+'" '+(plan.targetClassId===nc.id?'selected':'')+'>'+esc(nc.name)+'</option>').join('')+'</select></td></tr>';
    });
    h+='</tbody></table></div></div>';
  }
  h+='<div class="toolbar"><span class="small muted">Décisions complètes : '+prog.done+' / '+prog.total+'</span><span class="grow"></span><button class="btn" data-act="sessions-cancel-close">Annuler</button><button class="btn primary" data-act="confirm-close-year" '+(closePlanComplete()?'':'disabled')+'>Confirmer et créer '+esc(state.nextYear)+'</button></div>';
  return h;
}
function updateCloseProgress(){
  const p=closeProgress(),txt='Décisions complètes : '+p.done+' / '+p.total;
  const label=$('#close-progress');if(label)label.textContent=txt;
  const ready=closePlanComplete();$$('[data-act="confirm-close-year"]').forEach(b=>b.disabled=!ready);
}
function cloneClassToNextSession(cls,id){
  const c=JSON.parse(JSON.stringify(cls));c.id=id;c.students=[];c.grades={};c.remarks={};c.locks={1:false,2:false,3:false};
  c.subjects=(cls.subjects||[]).map(s=>({...s,id:uid()}));return c;

function startSessionSimulation(){
  // Mapping des classes supérieures pour préselection auto
  const nextLevelMap={'6e':'5e','5e':'4e','4e':'3e','3e':'2A','2A':'1A','2C':'1D','1A':'TA','1D':'TD','F1':'F2','TA':'','TD':'','F2':''};
  // Créer map des classes simulées par presetKey
  const nextClasses=DB.classes.map(c=>({sourceId:c.id,id:'sim-'+uid(),name:c.name,ord:c.ord,presetKey:c.presetKey}));
  const decisions={};
  DB.classes.forEach(c=>{
    // Trouver la classe d'accueil par défaut pour ce niveau
    const nextPreset=nextLevelMap[c.presetKey]||'';
    let defaultTargetId='';
    if(nextPreset){
      // Chercher une classe de niveau supérieur existante
      const target=nextClasses.find(nc=>nc.presetKey===nextPreset);
      if(target)defaultTargetId=target.id;
    }
    c.students.forEach(st=>{
      const avg=annualStudentAverage(c,st.id);
      // Décision par défaut : si pas de note → redouble ; si ≥10 → admis ; sinon redouble ; Tle → sorti
      let decision;
      if(nextPreset===''){
        decision='sorti';
      }else if(avg==null || avg<10){
        decision='redouble';
      }else{
        decision='admis';
      }
      decisions[closeKey(c.id,st.id)]={
        sourceClassId:c.id,studentId:st.id,
        decision:decision,
        targetClassId:decision==='admis'?defaultTargetId:''
      }
    })
  });
  S.simulationState={sourceYear:DB.school.year,year:'2027/2028',nextClasses,decisions};S.closeState=null;S.sessionId=null;S.classId=null;S.view='simulate-year';render();
}
function simulationComplete(){
  if(!S.simulationState)return false;
  return Object.values(S.simulationState.decisions).every(p=>p.decision&&(p.decision!=='admis'||p.targetClassId));
}

function applySimulationYear(){
  const state=S.simulationState;
  if(!state){toast('Aucune simulation en cours.','err');return;}
  const nextLevelMap={'6e':'5e','5e':'4e','4e':'3e','3e':'2A','2A':'1A','2C':'1D','1A':'TA','1D':'TD','F1':'F2','TA':'','TD':'','F2':''};
  // Vérifie qu'on ne va pas archiver une session déjà archivée (évite doublons)
  if(!Array.isArray(DB.sessions))DB.sessions=[];
  const alreadyArchived=DB.sessions.some(a=>a.year===DB.school.year);
  if(!alreadyArchived){
    // Archive l'année actuelle
    const archived={id:uid(),year:DB.school.year,closedAt:new Date().toISOString(),classes:JSON.parse(JSON.stringify(DB.classes))};
    DB.sessions.unshift(archived);
  }
  // Créer les classes nécessaires (niveau actuel + niveaux supérieurs)
  const neededPresets=new Set();
  for(const cls of DB.classes){
    neededPresets.add(cls.presetKey); // classe pour redoublants
    const nextP=nextLevelMap[cls.presetKey];
    if(nextP)neededPresets.add(nextP); // classe supérieure pour admis
  }
  const nextClasses=[];
  for(const presetKey of neededPresets){
    const pr=PRESETS.find(p=>p.key===presetKey);
    if(!pr)continue;
    nextClasses.push({
      id:uid(),
      name:pr.label,
      ord:PRESETS.findIndex(p=>p.key===presetKey),
      presetKey:presetKey,
      ppId:'',ppName:'',
      subjects:pr.subs().map(s=>({...s,id:uid()})),
      students:[],locks:{1:false,2:false,3:false},grades:{},remarks:{}
    });
  }
  // Affecte les élèves - sécurité : toute décision manquante = redouble par défaut
  const rosters=new Map(nextClasses.map(c=>[c.presetKey,c.students]));
  for(const cls of DB.classes)for(const st of cls.students){
    let p=state.decisions[closeKey(cls.id,st.id)];
    if(!p)p={decision:'redouble',targetClassId:''};
    let decision=p.decision;
    if(!decision){
      decision = nextLevelMap[cls.presetKey]==='' ? 'sorti' : 'redouble';
    }
    if(decision==='sorti')continue;
    let targetPreset;
    if(decision==='redouble'){
      targetPreset=cls.presetKey;
    }else{
      let targetSim=null;
      if(p.targetClassId) targetSim=state.nextClasses.find(nc=>nc.id===p.targetClassId);
      targetPreset=targetSim?nextLevelMap[targetSim.presetKey]||targetSim.presetKey:nextLevelMap[cls.presetKey];
    }
    const targetCls=nextClasses.find(c=>c.presetKey===targetPreset);
    if(!targetCls)continue;
    const student=JSON.parse(JSON.stringify(st));
    student.sessionTag=decision==='redouble'?'Ancien':'NA';
    student.mat=genMat();
    student.photo=student.photo||'';
    targetCls.students.push(student);
  }
  // Trie les élèves par nom dans chaque classe
  nextClasses.forEach(c=>c.students.sort(cmpName));
  // Force la mise à jour de l'année en PREMIER dans la sauvegarde
  DB.school.year=state.year; // 2027/2028 - OBLIGATOIRE, avant toute autre opération
  DB.classes=nextClasses;
  calcCache={};
  S.simulationState=null;S.sessionId=null;S.view='dash';S.classId=null;S.tab='eleves';S.trim=1;
  // Sauvegarde IMMÉDIATE synchrone pour éviter tout état interrompu
  clearTimeout(saveT);
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){memOnly=true}
  dirty();render();
  toast('✅ Nouvelle session activée : '+DB.school.year+' !','ok');
}

        classes[npk]={id:genId(),name:prname,ord:0,presetKey:npk,ppId:'',ppName:'',subjects:nsubs,students:[],locks:{1:false,2:false,3:false},grades:{},remarks:{}};
        log('✅ Classe sup : '+prname+' pour '+pk);
      }
    }

    log('Étape 4/5 : Répartition élèves (calcul MOYENNE GLOBALE : somme(notes*moy_coef)/somme(coef))','#ffcc00');
    var totalAdmis=0,totalRedoublants=0,totalSortis=0;
    var effectifs={};for(var pk in classes){effectifs[pk]={name:classes[pk].name,total:0}}
    for(var i=0;i<DB.classes.length;i++){
      var c=DB.classes[i],targetPk=nextMap[c.presetKey];
      var nbA=0,nbR=0,nbS=0;
      log('  Traitement '+c.name+' ('+c.students.length+' élèves)');
      for(var j=0;j<c.students.length;j++){
        var s=c.students[j];
        var points=0,coefs=0,nbn=0;
        var grades=c.grades[s.id]||{};
        for(var si=0;si<c.subjects.length;si++){
          var subj=c.subjects[si];
          var arr=grades[subj.id];
          if(!arr)continue;
          var ss=0,sc=0;
          for(var n=0;n<arr.length;n++){
            var v=arr[n];
            if(v!=null&&!isNaN(+v)&&+v>=0&&+v<=20){ss+=+v;sc++;nbn++}
          }
          if(sc>0){points+=(ss/sc)*subj.coef;coefs+=subj.coef}
        }
        var moy=coefs>0?points/coefs:null;
        var dec,dest,tag;
        if(!targetPk){dec='sorti';totalSortis++;nbS++;continue}
        if(moy!=null&&moy>=10){dec='admis';totalAdmis++;nbA++;dest=classes[targetPk];tag='NA'}
        else{dec='redouble';totalRedoublants++;nbR++;dest=classes[c.presetKey];tag='Ancien'}
        log('    → '+s.name+' : '+nbn+' notes | moy='+(moy?moy.toFixed(2):'SANS')+' → '+dec+' ('+tag+')');
        if(dest){
          dest.students.push({id:s.id,name:s.name,sex:s.sex||'',mat:s.mat||'',dob:s.dob||'',pob:s.pob||'',photo:s.photo||'',sessionTag:tag,average:moy});
          effectifs[dest.presetKey].total++;
        }
      }
      log('  '+c.name+' : '+nbA+' admis / '+nbR+' redoublants / '+nbS+' sortis');
    }
    log('✅ Total : '+totalAdmis+' admis | '+totalRedoublants+' redoublants | '+totalSortis+' sortis','#4fa824');
    for(var pk in effectifs)log('   Effectif '+effectifs[pk].name+' : '+effectifs[pk].total+' élèves');
    var finalClasses=[];for(var pk in classes)finalClasses.push(classes[pk]);

    log('Étape 5/5 : Sauvegarde activation 2027/2028...','#ffcc00');
    DB.school.year='2027/2028';DB.classes=finalClasses;
    S.view='dash';S.classId=null;S.tab='eleves';S.trim=1;S.simulationState=null;S.closeState=null;S.sessionId=null;S.mine=true;
    if(typeof calcCache!=='undefined')calcCache={};
    localStorage.setItem('mbi_gestion_bulletins_v1',JSON.stringify(DB));
    log('✅ SAUVEGARDÉ !','#4fa824');
    status.style.color='#4fa824';status.textContent='✅ ACTIVATION RÉUSSIE - Rechargement...';
    setTimeout(function(){location.reload()},1500);
  }catch(err){
    log('❌ ERREUR : '+err.message,'#ff4444');
    log(err.stack,'#ff6666');
    status.style.color='#ff4444';status.textContent='❌ ERREUR - copiez les logs';
  }
}

function parseNote(s){

}

  el.classList.remove('bad');

  const old=getG(cls,el.dataset.sid,sub.id);const oldV=old?old[+el.dataset.seq]:null;
  if(oldV!=null && oldV!==v){if(!confirm('Modifier la note de '+cls.students.find(s=>s.id===el.dataset.sid).name+' — '+sub.name+' (S'+(+el.dataset.seq+1)+') de '+String(oldV).replace('.',',')+' en '+(v==null?'vide':String(v).replace('.',','))+' ?')){el.value=oldV==null?'':String(oldV).replace('.',',');return false}}
  setG(cls,el.dataset.sid,sub.id,+el.dataset.seq,v);
  el.value=v==null?'':String(v).replace('.',',');
  if(v!=null&&v<10)el.classList.add('low');else el.classList.remove('low');
  dirty();return true;
}

/* --- Statistiques --- */
const BINS=[['< 5',0,5],['5 à 8',5,8],['8 à 10',8,10],['10 à 12',10,12],['12 à 14',12,14],['14 à 16',14,16],['16 et +',16,21]];
function statsData(cls,t){
  const res=getRes(cls,t),list=cls.students;
  const rk=res.ranked.map(s=>({s,a:res.per[s.id].avg})).sort((x,y)=>y.a-x.a);
  const avgs=rk.map(x=>x.a);
  const bins=BINS.map(([l,lo,hi])=>({l,lo,n:avgs.filter(a=>a>=lo&&a<hi).length}));
  const bySex=['M','F'].map(k=>{const a=rk.filter(x=>x.s.sex===k).map(x=>x.a);return{k,n:list.filter(s=>s.sex===k).length,avg:mean(a),pass:a.length?a.filter(v=>v>=10).length/a.length:null}});
  const subs=cls.subjects.map(sub=>{
    const v=list.map(s=>res.per[s.id].m[sub.id]).filter(x=>x!=null);
    return{sub,n:v.length,avg:mean(v),min:v.length?Math.min(...v):null,max:v.length?Math.max(...v):null,pass:v.length?v.filter(x=>x>=10).length/v.length:null};
  });
  const evo=[1,2,3].map(k=>getRes(cls,k).classAvg);
  return{res,rk,avgs,bins,bySex,subs,evo,mean:mean(avgs),med:median(avgs),pass:avgs.length?avgs.filter(a=>a>=10).length/avgs.length:null};
}

  h+='<div class="panel"><h3>Résultats par matière</h3><div class="tw"><table class="t"><thead><tr><th>Matière</th><th class="num">Coef.</th><th class="num">Élèves notés</th><th class="num">Moyenne</th><th class="num">Min.</th><th class="num">Max.</th><th class="num">≥ 10</th><th style="width:140px"></th></tr></thead><tbody>'+

function exportCsv(cls,t){

/* ---------- Import des élèves ---------- */
const SEXM=['M','H','G','GARCON','GARÇON','MASCULIN','MALE'],SEXF=['F','FILLE','FEMININ','FÉMININ','FEMALE'];
function parseStudents(text){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    let cells=/[\t;]/.test(line)?line.split(/[\t;]/):(line.includes(',')?line.split(','):[line]);
    cells=cells.map(c=>c.trim()).filter(Boolean);
    let sex='',parts=[];
    for(const c of cells){
      const u=c.toUpperCase();
      if(SEXM.includes(u)){sex='M';continue}
      if(SEXF.includes(u)){sex='F';continue}
      if(/^\d{1,4}[.)]?$/.test(c))continue;
      if(/^(N°|N°\.|NO|NUM[ÉE]RO|NOMS?( ET PR[ÉE]NOMS?)?|PR[ÉE]NOMS?|NAMES?|SEXE|GENRE|MATRICULE)$/i.test(c))continue;
      if(/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}$/.test(c))continue;
      parts.push(c.replace(/^\d{1,4}\s*[.)\-]\s+/,''));
    }
    const name=parts.join(' ').replace(/\s+/g,' ').trim().toLocaleUpperCase('fr');
    if(name.length<2)continue;
    if(/^(NOMS?( ET PR[ÉE]NOMS?)?|NAMES?|N°|NO)$/.test(name))continue;
    out.push({name,sex});
  }
  return out;
}
let IMP=[];
function importPreview(text){
  const cls=curClass(),have=new Set(cls.students.map(s=>s.name.toLocaleUpperCase('fr')));
  const seen=new Set();
  IMP=parseStudents(text).map(x=>{const dup=have.has(x.name)||seen.has(x.name);seen.add(x.name);return{...x,dup}});
  const ok=IMP.filter(x=>!x.dup).length,dup=IMP.length-ok;
  $('#imp-prev').innerHTML=IMP.length?'<p class="small"><b>'+ok+'</b> élève'+(ok>1?'s':'')+' à ajouter'+(dup?' · <span class="badge warn">'+dup+' déjà présent'+(dup>1?'s':'')+' (ignoré'+(dup>1?'s':'')+')</span>':'')+'</p><div class="tw" style="max-height:230px;overflow:auto"><table class="t"><tbody>'+IMP.map((x,i)=>'<tr><td style="width:40px">'+(i+1)+'</td><td'+(x.dup?' class="muted" style="text-decoration:line-through"':'')+'>'+esc(x.name)+'</td><td style="width:60px">'+(x.sex||'')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="small muted">Rien à importer pour le moment.</p>';
  $('#imp-go').disabled=!ok;$('#imp-go').textContent=ok?'Importer '+ok+' élève'+(ok>1?'s':''):'Importer';
}

function loadDemo(){
  const cls=newClass('6e','6e (exemple)');
  const sn=['MBALLA','FOTSO','NJOYA','TCHAMBA','ESSOMBA','KAMGA','NKOULOU','BELLO','ATANGANA','MOUKOKO','TCHOUMI','ONANA'];
  const gn=['Arnaud','Sandrine','Michel','Grace','Brice','Laure','Junior','Estelle','Franck','Mireille','Cédric','Nadine','Prisca','Yannick'];
  const used=new Set();
  while(cls.students.length<14){const n=(sn[Math.floor(Math.random()*sn.length)]+' '+gn[Math.floor(Math.random()*gn.length)]).toLocaleUpperCase('fr');if(used.has(n))continue;used.add(n);cls.students.push({id:uid(),name:n,sex:Math.random()<.5?'M':'F',mat:genMat(),dob:'',pob:'',sessionTag:'N'})}
  cls.students.sort(cmpName);
  cls.students.slice(0,3).forEach((s,i)=>s.photo='sample:'+i);
  for(const s of cls.students){const lvl=6+Math.random()*8;for(const sub of cls.subjects){
    if(sub.name==='ALLEMAND'&&Math.random()<.5)continue;if(sub.name==='ESPAGNOL'&&cls.grades[s.id]&&cls.grades[s.id][cls.subjects.find(x=>x.name==='ALLEMAND').id])continue;
    for(let q=0;q<4;q++){const v=Math.max(0,Math.min(20,Math.round((lvl+(Math.random()*8-4))*4)/4));setG(cls,s.id,sub.id,q,v)}}}
  DB.classes.push(cls);dirty();return cls;
}

document.addEventListener('paste',e=>{
  const el=e.target;if(!el.classList||!el.classList.contains('cell'))return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');
  if(!/[\n\t]/.test(txt.trim()))return;
  e.preventDefault();
  const rows=txt.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(r=>r.split('\t'));
  const r0=+el.dataset.r,c0=+el.dataset.c;let n=0,bad=0;
  rows.forEach((row,i)=>row.forEach((v,j)=>{
    const t=$('.cell[data-r="'+(r0+i)+'"][data-c="'+(c0+j)+'"]');if(!t)return;
    t.value=v.trim();if(commitCell(t))n++;else bad++;
  }));
  refreshSummary();if(n)toast(n+' note'+(n>1?'s collées':' collée')+(bad?' ('+bad+' invalide'+(bad>1?'s':'')+')':'')+'.',bad?'':'ok');
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(isReadOnlySession()){toast('Cette session est archivée et consultable en lecture seule.','err');return;}
  const fd=Object.fromEntries(new FormData(f).entries()),err=m=>{const x=$('#fe',f.closest('.modal')||document);if(x)x.textContent=m};
  const kind=f.dataset.form;
  if(kind==='setup'){if(!confirm('Créer le compte administrateur et commencer ?'))return;
    const un=fd.username.trim().toLowerCase();if(!/^[a-z0-9._-]{2,}$/.test(un))return err('Identifiant : lettres, chiffres, point ou tiret (2 caractères minimum), sans espace.');
    const salt=uid();DB.school.name=fd.school.trim()||DB.school.name;
    const u={id:uid(),name:fd.name.trim(),username:un,phone:'',role:'admin',salt,hash:await hashPw(fd.pw,salt)};
    DB.users.push(u);dirty();saveNow();ME=u;try{sessionStorage.setItem(SKEY,u.id)}catch(x){}render();
  }else if(kind==='login'){
    const u=DB.users.find(x=>x.username===fd.username.trim().toLowerCase());
    if(!u||!verifyPw(fd.pw,u.salt,u.hash))return err(DB.demoMode?'Identifiant ou mot de passe incorrect. Vérifiez admin / admin1234 ou utilisez « Réparer l’accès démo » sans effacer vos données.':'Identifiant ou mot de passe incorrect.');
    ME=u;try{sessionStorage.setItem(SKEY,u.id)}catch(x){}S.sessionId=null;S.closeState=null;S.simulationState=null;S.view='dash';render();
  }else if(kind==='pw'){if(!confirm('Changer le mot de passe ?'))return;
    if(!verifyPw(fd.old,ME.salt,ME.hash))return err('Le mot de passe actuel est incorrect.');
    ME.salt=uid();ME.hash=await hashPw(fd.new,ME.salt);dirty();render();toast('Mot de passe modifié.','ok');
  }else if(kind==='teacher'){if(!confirm('Enregistrer cet enseignant ?'))return;
    const un=fd.username.trim().toLowerCase();if(!/^[a-z0-9._-]{2,}$/.test(un))return err('Identifiant : lettres, chiffres, point ou tiret, sans espace.');
    const id=f.dataset.id;if(DB.users.some(u=>u.username===un&&u.id!==id))return err('Cet identifiant est déjà utilisé.');
    let u=id&&DB.users.find(x=>x.id===id);
    if(!u){u={id:uid(),role:'prof'};DB.users.push(u)}
    u.name=fd.name.trim();u.username=un;u.phone=fd.phone.trim();

    dirty();closeModal();render();

  }else if(kind==='newclass'){if(!confirm('Créer cette classe ?'))return;
    const c=newClass(fd.preset,fd.name.trim());DB.classes.push(c);dirty();closeModal();S.view='class';S.classId=c.id;S.tab='eleves';render();
  }else if(kind==='student'){if(!confirm('Enregistrer cet élève ?'))return;
    const cls=curClass(),name=fd.name.trim().replace(/\s+/g,' ').toLocaleUpperCase('fr'),id=f.dataset.id;
    if(cls.students.some(s=>s.name===name&&s.id!==id))return err('Un élève porte déjà ce nom dans cette classe.');

    if(id){const s=cls.students.find(x=>x.id===id),legacySample=!Object.prototype.hasOwnProperty.call(s,'photo')?demoPhotoIndex(cls,s):-1;s.name=name;s.sex=fd.sex;s.mat=mat;s.dob=fd.dob||'';s.pob=(fd.pob||'').trim();if(photo)s.photo=photo;else if(legacySample>=0&&legacySample<DEMO_PHOTOS.length)s.photo='sample:'+legacySample}else cls.students.push({id:uid(),name,sex:fd.sex,mat:mat,dob:fd.dob||'',pob:(fd.pob||'').trim(),photo:photo||'',sessionTag:'N'});
    cls.students.sort(cmpName);dirty();closeModal();render();

    const last=cls.subjects[cls.subjects.length-1];cls.subjects.push({id:uid(),name:'NOUVELLE MATIÈRE',coef:1,group:g,opt:false,teacherId:''});dirty();closeModal();render();

function handleFile(el){
  const file=el.files&&el.files[0];if(!file)return;const kind=el.dataset.file;
  const bad=m=>{const x=$('#fe');if(x)x.textContent=m;else toast(m,'err')};
  if(kind==='header'){if(!confirm('Remplacer l’en-tête des bulletins par cette image ?'))return;
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const w=Math.min(1400,img.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(img.height*w/img.width);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);DB.school.header=c.toDataURL('image/jpeg',.88);URL.revokeObjectURL(url);dirty();render();toast('En-tête remplacé.','ok')};
    img.onerror=()=>toast('Image illisible.','err');img.src=url;return;
  }
  const rd=new FileReader();
  rd.onerror=()=>bad('Lecture du fichier impossible.');
  rd.onload=()=>{
    const txt=String(rd.result);
    if(kind==='imp'){const ta=$('#imp-text');ta.value=txt;importPreview(txt);return}
    let d;try{d=JSON.parse(txt)}catch(e){return bad('Ce fichier n’est pas un fichier JSON valide.')}
    if(kind==='restore'){if(!confirm('Restaurer cette sauvegarde (les données actuelles seront remplacées) ?'))return;
      if(!d||!d.school||!Array.isArray(d.users)||!Array.isArray(d.classes)||!d.users.some(u=>u.role==='admin'))return bad('Ce fichier n’est pas une sauvegarde complète de cette application.');
      DB=d;calcCache={};S.sessionId=null;S.closeState=null;S.simulationState=null;saveNow();closeModal();ME=null;try{sessionStorage.removeItem(SKEY)}catch(e){}render();toast('Sauvegarde restaurée : connectez-vous.','ok');
    }else if(kind==='merge'){if(!confirm('Fusionner les notes de ce fichier dans les classes correspondantes ?'))return;
      if(!d||d.type!=='mbi-notes'||!Array.isArray(d.classes))return bad('Ce fichier n’est pas un fichier de notes exporté par un enseignant.');
      let n=0,skipped=0;
      for(const fc of d.classes){const c=DB.classes.find(x=>x.id===fc.id);if(!c){skipped++;continue}
        for(const sid in fc.grades){if(!c.students.some(s=>s.id===sid))continue;
          for(const sub in fc.grades[sid]){if(!c.subjects.some(s=>s.id===sub))continue;
            fc.grades[sid][sub].forEach((v,i)=>{if(v!=null&&i<5&&typeof v==='number'&&v>=0&&v<=20){setG(c,sid,sub,i,v);n++}})}}}
      dirty();closeModal();render();toast(n+' note'+(n>1?'s importées':' importée')+(skipped?' · '+skipped+' classe(s) du fichier introuvable(s)':'')+'.',n?'ok':'');
    }
  };
  rd.readAsText(file,'utf-8');
}

/* ---------- Données de démonstration (production) ---------- */
async function seedDemoData(){
  matCounter=0;
  const mkUser = async (name, username, pw, role, phone='') => {
    const salt = uid();
    const hash = await hashPw(pw, salt);
    return {id: uid(), name, username, salt, hash, role, phone};
  };
  const admin = await mkUser("ATANGANA Jean", "admin", "admin1234", "admin", "699 00 11 22");
  const teachers = [
    await mkUser("MBALLA Paul", "pmballa", "prof1234", "teacher", "699 11 22 33"),
    await mkUser("FOTSO Marie", "mfotso", "prof1234", "teacher", "699 22 33 44"),
    await mkUser("NJOYA Ibrahim", "injoya", "prof1234", "teacher", "699 33 44 55"),
    await mkUser("KAMGA Sophie", "skamga", "prof1234", "teacher", "699 44 55 66"),
    await mkUser("ESSOMBA Robert", "ressomba", "prof1234", "teacher", "699 55 66 77"),
  ];
  DB.users = [admin, ...teachers];
  DB.school.name = "Ming's Bilingual Institute";
  DB.school.city = "Douala";
  DB.school.year = schoolYear();
  DB.school.principal = "M. ATANGANA Jean";
  DB.demoMode = true;

  const families = ['MBALLA','FOTSO','NJOYA','TCHAMBA','ESSOMBA','KAMGA','NKOULOU','BELLO','ATANGANA','MOUKOKO','TCHOUMI','ONANA','BIYA','EYENGA','NGONO','MANGA','ZAMBO','ABENA','MENDOMO','NDONGO','TALLA','YOMBI','FOUDA','MVOGO'];
  const given = ['Arnaud','Sandrine','Michel','Grace','Brice','Laure','Junior','Estelle','Franck','Mireille','Cédric','Nadine','Prisca','Yannick','Aurélien','Christelle','Brigitte','Fabrice','Hervé','Inès','Joël','Karine','Lionel','Nadège','Olivier','Patricia','Rachel','Samuel','Thérèse','Ulrich','Vanessa','William','Xavier','Yvette','Zacharie','Boris','Carine','Dieudonné','Élodie','Ghislain','Henriette'];

  function makeStudents(n){
    const used = new Set();
    const out = [];
    while(out.length < n){
      const name = (families[Math.floor(Math.random()*families.length)] + ' ' + given[Math.floor(Math.random()*given.length)]).toLocaleUpperCase('fr');
      if(used.has(name)) continue;
      used.add(name);
      out.push({id: uid(), name, sex: Math.random()<.5?'M':'F', mat: genMat(), sessionTag:'N', dob: (2008+Math.floor(Math.random()*4))+'-'+String(1+Math.floor(Math.random()*12)).padStart(2,'0')+'-'+String(1+Math.floor(Math.random()*28)).padStart(2,'0'), pob: ['Douala','Yaoundé','Bafoussam','Garoua','Bamenda','Maroua'][Math.floor(Math.random()*6)]});
    }
    out.sort(cmpName);
    return out;
  }

  function assignTeachers(cls){
    let i = 0;
    for(const sub of cls.subjects){
      sub.teacherId = teachers[i % teachers.length].id;
      i++;
    }
    cls.ppId = teachers[Math.floor(Math.random()*teachers.length)].id;
  }

  function genNotes(cls){
    for(const s of cls.students){
      const base = 7 + Math.random()*8;
      for(const sub of cls.subjects){
        if(sub.opt && Math.random() < .4) continue;
        const diff = (sub.coef>=4) ? -1.2 : (sub.coef<=1 ? 1.2 : 0);
        for(let q=0;q<5;q++){
          const v = Math.max(0, Math.min(20, Math.round((base + diff + (Math.random()*6-3))*4)/4));
          setG(cls, s.id, sub.id, q, v);
        }
      }
    }
  }

  const classSpecs = [
    {key:'6e', name:'6e A'},
    {key:'5e', name:'5e A'},
    {key:'4e', name:'4e B'},
    {key:'3e', name:'3e A'},
    {key:'2C', name:'2nde C'},
    {key:'1D', name:'1ère D'},
    {key:'TD', name:'Tle D'},
    {key:'F1', name:'Form I'},
  ];

  for(const spec of classSpecs){
    const cls = newClass(spec.key, spec.name);
    cls.locks = {1:true,2:false,3:false};
    const nStudents = 20 + Math.floor(Math.random()*10);
    cls.students = makeStudents(nStudents);
    if(spec.key==='6e')cls.students.slice(0,3).forEach((st,i)=>st.photo='sample:'+i);
    assignTeachers(cls);
    genNotes(cls);
    DB.classes.push(cls);
  }

  for(const cls of DB.classes){
    for(const s of cls.students){
      if(Math.random() < .25){
        cls.remarks[s.id] = cls.remarks[s.id] || {};
        cls.remarks[s.id]['t1'] = "Élève sérieux, doit poursuivre ses efforts.";
        if(Math.random() < .5) cls.remarks[s.id]['t2'] = "Bons résultats, encouragements.";
      }
    }
  }

  dirty();
  saveNow();
}

async function seedThenRender(){
  try{
    if(!DB.users.length && !DB.classes.length){
      await seedDemoData();
    }
  }catch(e){ console.error(e); }
  render();
}

seedThenRender();
